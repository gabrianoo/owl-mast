# Runtime configuration. Database settings come from the environment; no credentials live here.
spring:
  application:
    name: owl-mast
  r2dbc:
    url: ${OWLMAST_DATABASE_R2DBC_URL:r2dbc:postgresql://localhost:5432/owlmast}
    username: ${OWLMAST_DATABASE_USERNAME:owlmast}
    password: ${OWLMAST_DATABASE_PASSWORD:}
  flyway:
    # Migrations run once at startup over JDBC (bounded, startup-only blocking); runtime is R2DBC.
    url: ${OWLMAST_DATABASE_JDBC_URL:jdbc:postgresql://localhost:5432/owlmast}
    user: ${OWLMAST_DATABASE_USERNAME:owlmast}
    password: ${OWLMAST_DATABASE_PASSWORD:}
    locations: classpath:db/migration
    fail-on-missing-locations: true

  webflux:
    # Common error envelope (OM-01.04): RFC 9457 problem details for Spring's own error responses
    # (404, 405, validation, ResponseStatusException). Exceptions that leave a controller unhandled
    # are mapped to a 500 problem detail by platform/web/UnhandledFailureAdvice. Never include stack
    # traces, messages or binding errors; the frontend renders its own safe copy.
    problemdetails:
      enabled: true

server:
  reactive:
    session:
      # The browser's only credential (docs/identity.md): one HttpOnly, Secure, SameSite=Lax cookie
      # holding an opaque id of a session kept in this process's memory. Tokens stay in the backend.
      cookie:
        name: OWLMAST_SESSION
        http-only: true
        secure: true
        same-site: lax
        path: /api

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # Readiness refuses traffic until the schema baseline and the identity provider are proven.
        readiness:
          include:
            - readinessState
            - schemaBaseline
            - identityDiscovery

owlmast:
  identity:
    # Required: bundled Keycloak realm or a compatible external OpenID Connect issuer (AC2).
    issuer-uri: ${OWLMAST_IDENTITY_ISSUER_URI:}
    # A plaintext http issuer is refused unless this is true (cluster-local or disposable fixtures only).
    allow-insecure-issuer: ${OWLMAST_IDENTITY_ALLOW_INSECURE_ISSUER:false}
    # Optional: where the backend itself reaches the issuer (discovery, token and key endpoints) when
    # that differs from the public issuer the browser and the tokens use, as with the bundled Keycloak
    # behind its own public origin. Absent means the issuer. Plaintext needs its own opt-in.
    backchannel-uri: ${OWLMAST_IDENTITY_BACKCHANNEL_URI:}
    allow-insecure-backchannel: ${OWLMAST_IDENTITY_ALLOW_INSECURE_BACKCHANNEL:false}
  sign-in:
    # Browser sign-in (OM-02.01, docs/identity.md). All three are required; there is no value that
    # turns authentication off. The secret comes from the environment and is never logged.
    client-id: ${OWLMAST_IDENTITY_CLIENT_ID:}
    client-secret: ${OWLMAST_IDENTITY_CLIENT_SECRET:}
    # The one public origin that serves the shell (/) and this backend (/api): https, or http on a
    # loopback host. Redirects and the session cookie belong to it.
    application-origin: ${OWLMAST_IDENTITY_APPLICATION_ORIGIN:}
    # audience: the audience a bearer credential must carry; absent means the client id.
    # Tenant of every signed-in principal until OM-02.02 supplies tenant membership.
    tenant: default
  blocking:
    max-concurrency: 8
    max-queued-per-thread: 16
    deadline: 10s
  jobs:
    # Durable work (OM-01.03, docs/durable-work-and-audit-contract.md). Values restate the
    # work-item contract v1 defaults; durations are ISO-8601.
    max-attempts: 5
    backoff-base: PT1S
    backoff-cap: PT5M
    lease-duration: PT30S
    claim-batch-size: 10
    poll-interval: PT1S
    initial-delay: PT0S
    # handler-deadline: absent means nine tenths of lease-duration; must stay shorter than the lease.
    # instance-id: names this instance in lease_owner; absent means the host name (the pod name).
    scheduler:
      # In-process Spring scheduling is the only wake-up source; tests may drive the processor.
      enabled: true
  audit:
    # Bound of one separate (failed/denied/unresolved) outcome write; ISO-8601.
    outcome-write-deadline: PT5S
