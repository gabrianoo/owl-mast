# Runtime configuration. Database settings come from the environment; no credentials live here.
spring:
  application:
    name: owl-mast
  r2dbc:
    url: ${OWLMAST_DATABASE_R2DBC_URL:r2dbc:postgresql://localhost:5432/owlmast}
    username: ${OWLMAST_DATABASE_USERNAME:owlmast}
    password: ${OWLMAST_DATABASE_PASSWORD:}
  flyway:
    # Migrations run once at startup over JDBC (bounded, startup-only blocking); runtime is R2DBC.
    url: ${OWLMAST_DATABASE_JDBC_URL:jdbc:postgresql://localhost:5432/owlmast}
    user: ${OWLMAST_DATABASE_USERNAME:owlmast}
    password: ${OWLMAST_DATABASE_PASSWORD:}
    locations: classpath:db/migration
    fail-on-missing-locations: true

  webflux:
    # Common error envelope (OM-01.04): RFC 9457 problem details on every error response. Never
    # include stack traces, messages or binding errors; the frontend renders its own safe copy.
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # Readiness refuses traffic until the schema baseline and the identity provider are proven.
        readiness:
          include: readinessState,schemaBaseline,identityDiscovery

owlmast:
  identity:
    # Required: bundled Keycloak realm or a compatible external OpenID Connect issuer (AC2).
    issuer-uri: ${OWLMAST_IDENTITY_ISSUER_URI:}
  blocking:
    max-concurrency: 8
    max-queued-per-thread: 16
    deadline: 10s
  jobs:
    # Durable work (OM-01.03, docs/durable-work-and-audit-contract.md). Values restate the
    # work-item contract v1 defaults; durations are ISO-8601.
    max-attempts: 5
    backoff-base: PT1S
    backoff-cap: PT5M
    lease-duration: PT30S
    claim-batch-size: 10
    poll-interval: PT1S
    scheduler:
      # In-process Spring scheduling is the only wake-up source; tests may drive the processor.
      enabled: true
