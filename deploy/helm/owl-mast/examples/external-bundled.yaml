# Existing PostgreSQL 18 with VectorChord 1.1.1 installed (`CREATE EXTENSION vchord CASCADE` in the
# application database), bundled Keycloak using its own database/principal on the same server.
# sslMode `require` encrypts the connection but does not authenticate the server; `verify-ca` and `verify-full`
# are refused until the chart mounts a CA trust (docs/installation.md).
database:
  bundled: false
  name: owlmast
  existingSecret: owl-mast-db
  external:
    host: postgresql.data.example.internal
    port: 5432
    sslMode: require
identity:
  bundled: true
  keycloak:
    database:
      name: keycloak
      existingSecret: owl-mast-keycloak-db
      external:
        host: postgresql.data.example.internal
        port: 5432
        sslMode: require
