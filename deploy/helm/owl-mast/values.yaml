# Owl Mast installation values (OM-01.02). No credential values live here: every credential is an
# existing Kubernetes Secret reference with the keys `username` and `password`.
# The PostgreSQL/VectorChord and Keycloak images are pinned by immutable digest (qualified on
# 2026-11-07, docs/installation.md). The backend image is referenced by tag until a registry manifest
# digest exists; set backend.image.digest to pin it (NOTES warns while the reference is a mutable tag).

nameOverride: ""
fullnameOverride: ""
# Extra labels applied to every rendered resource, including retained PersistentVolumeClaims. Keys under
# app.kubernetes.io/ and helm.sh/ are reserved for the chart (selectors) and are refused.
commonLabels: {}

backend:
  image:
    repository: owl-mast/backend
    tag: "0.1.0"
    # Optional until the image is published: set it to the registry manifest digest (sha256:...) for an
    # immutable install; the tag is then informative. Empty means the mutable tag above decides what runs.
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 1
  containerPort: 8080
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  javaToolOptions: "-XX:MaxRAMPercentage=75"
  probes:
    startup:
      path: /actuator/health/liveness
      periodSeconds: 5
      failureThreshold: 36
    liveness:
      path: /actuator/health/liveness
      periodSeconds: 10
      failureThreshold: 3
    readiness:
      path: /actuator/health/readiness
      periodSeconds: 10
      failureThreshold: 3
  # Additional plain environment variables (name/value). Never put credentials here. Names that would
  # override the validated configuration (OWLMAST_*, SPRING_*, MANAGEMENT_*, SERVER_*, JVM option
  # variables) are refused by the schema.
  extraEnv: []

# Independent frontend artifact (AD-14). The shell image is delivered by OM-01.04; these values only
# define its deployment and routing contract. Disabled until an image is supplied.
frontend:
  enabled: false
  image:
    repository: owl-mast/frontend
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 1
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  probes:
    liveness:
      path: /
      periodSeconds: 15
      failureThreshold: 3
    readiness:
      path: /
      periodSeconds: 10
      failureThreshold: 3

# Routing contract between the independent artifacts. Public origins stay an OM-02.01 gate; the
# Ingress is disabled by default and never created without an explicit host. The prefixes are pinned to
# what the artifacts serve (no rewrite is rendered): apiPathPrefix is /api or below /api/,
# actuatorPathPrefix is /actuator or below /actuator/, frontendPathPrefix is /.
routing:
  apiPathPrefix: /api
  actuatorPathPrefix: /actuator
  frontendPathPrefix: /
  ingress:
    enabled: false
    className: ""
    # Lowercase DNS name (optional leading '*.'), no scheme, port or path.
    host: ""
    annotations: {}
    # [{hosts: [<host>], secretName: <tls secret>}]; when set, one entry must cover `host`.
    tls: []
  # Gateway API (stable gateway.networking.k8s.io/v1 HTTPRoute) as the first-class routing option. The
  # operator supplies the Gateway (GatewayClass, controller, listeners, TLS) and the Gateway API CRDs;
  # the chart renders an HTTPRoute attached to the referenced parent(s). Mutually exclusive with the
  # Ingress: enabling both is refused as ambiguous. Rendering requires the capability
  # gateway.networking.k8s.io/v1/HTTPRoute (for `helm template`: --api-versions gateway.networking.k8s.io/v1/HTTPRoute).
  gateway:
    enabled: false
    # At least one parent Gateway reference is required when enabled.
    parentRefs: []
    #  - name: shared-gateway
    #    namespace: gateway-system
    #    sectionName: https
    hostnames: []
    annotations: {}

# Application database. `bundled: true` deploys the PostgreSQL/VectorChord instance below;
# `bundled: false` requires compatible external connection values (PostgreSQL 18 with VectorChord
# 1.1.1 and its pgvector dependency installed in the database).
database:
  bundled: true
  name: owlmast
  # Existing Secret with keys `username` and `password` for the application principal.
  existingSecret: owl-mast-db
  external:
    host: ""
    port: 5432
    # require | verify-ca | verify-full (applied to R2DBC and JDBC URLs). verify-* needs a CA trust the
    # chart does not mount yet. disable | allow | prefer can fall back to plaintext and are refused
    # unless allowInsecureTransport is true.
    sslMode: require
    allowInsecureTransport: false

# Bundled PostgreSQL 18.3 with VectorChord 1.1.1 (pgvector 0.8.2 as its required dependency).
postgresql:
  image:
    repository: tensorchord/vchord-postgres
    tag: pg18-v1.1.1
    digest: sha256:700ff05ebdc7e4afd4dd8442e0684293046c3833677fec326550000a04cf8a91
    pullPolicy: IfNotPresent
  # Existing Secret with keys `username` and `password` for the provisioning superuser. It
  # initialises databases, principals, grants and extensions once; runtime principals never use it.
  adminExistingSecret: owl-mast-postgres-admin
  service:
    port: 5432
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    # Empty selects the cluster default StorageClass. The claim is retained on uninstall
    # (helm.sh/resource-policy: keep) and never recreated on upgrade.
    storageClass: ""
    size: 10Gi
    accessModes:
      - ReadWriteOnce
    # Reuse a claim that this installation previously created (or an operator-owned claim with
    # compatible ownership). Empty creates a new run-owned claim.
    existingClaim: ""
  # Set to true for the upgrade that enables the identity bundle on a bundled PostgreSQL whose volume
  # was initialised with identity.bundled=false: first-initialisation scripts never rerun, so a
  # PRE-upgrade hook Job (with its own script ConfigMap, waiting for PostgreSQL readiness) provisions
  # Keycloak's database and principal before Helm waits for the Keycloak and backend consumers.
  # Idempotent: nothing existing is dropped; an existing role keeps its password. Meaningful only on
  # an upgrade of an existing release; leave false afterwards.
  provisionKeycloakDatabase: false
  securityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
  probes:
    startup:
      periodSeconds: 5
      failureThreshold: 36
    liveness:
      periodSeconds: 15
      failureThreshold: 3
    readiness:
      periodSeconds: 5
      failureThreshold: 3

# Identity provider. There is no value that disables authentication: `bundled: false` requires
# an external OpenID Connect issuer whose discovery document the backend verifies at readiness.
identity:
  bundled: true
  # Realm used by the bundled issuer URL and the synthetic import. Browser realm/client policy is OM-02.01.
  realm: owl-mast
  external:
    # https:// URL with a host, no query or fragment.
    issuerUri: ""
    # Accept a plaintext http:// issuer (disposable local fixtures only): discovery and signing keys
    # then travel unauthenticated.
    allowInsecureIssuer: false
  keycloak:
    image:
      repository: quay.io/keycloak/keycloak
      tag: "26.8.2"
      digest: sha256:3879c623248408de29a5303178b5816c77e8dfef3890c361f8c0bbeaa979ba3b
      pullPolicy: IfNotPresent
    # Existing Secret with keys `username` and `password` for the temporary bootstrap admin.
    bootstrapExistingSecret: owl-mast-keycloak-bootstrap
    # Import a minimal synthetic realm named `identity.realm` on start (fixture only).
    importRealm: true
    # Required with importRealm=false: acknowledges that an operator creates the realm `identity.realm`
    # (without it the issuer never exists and the backend never becomes ready).
    realmManagedByOperator: false
    # Trust X-Forwarded-* / Forwarded headers ("xforwarded" | "forwarded"). Leave empty unless a trusted
    # proxy that overwrites these headers is the only path to Keycloak (the OM-02.01 public-origin gate).
    proxyHeaders: ""
    database:
      name: keycloak
      # Existing Secret with keys `username` and `password` for Keycloak's own database principal.
      existingSecret: owl-mast-keycloak-db
      # Used only when database.bundled is false: where Keycloak's database lives.
      external:
        host: ""
        port: 5432
        sslMode: require
        allowInsecureTransport: false
    service:
      port: 8080
      managementPort: 9000
    resources:
      requests:
        cpu: 500m
        memory: 768Mi
      limits:
        cpu: "1"
        memory: 1536Mi
    probes:
      startup:
        periodSeconds: 5
        failureThreshold: 60
      liveness:
        periodSeconds: 15
        failureThreshold: 3
      readiness:
        periodSeconds: 10
        failureThreshold: 3

# Ingress-only NetworkPolicies for the bundled dependencies (default on): PostgreSQL :5432 accepts the
# backend, Keycloak and the provisioning Job of this release; Keycloak :8080 accepts the backend. Node
# traffic (kubelet probes, API-server proxy on a single-node target) stays allowed by Kubernetes
# semantics. extraFrom adds NetworkPolicyPeer entries (for example a Gateway data plane for Keycloak).
networkPolicy:
  enabled: true
  postgresql:
    extraFrom: []
  keycloak:
    extraFrom: []
