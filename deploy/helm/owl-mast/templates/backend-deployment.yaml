{{- include "owl-mast.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "owl-mast.backend.fullname" . }}
  labels:
    {{- include "owl-mast.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  # Single instance (AD-14): the old pod stops before the new one starts, so a rollout never runs two
  # backends (and two startup migrations) against the same database. Browser sessions live in this pod's
  # memory (OM-02.01): every rollout or restart signs everyone out, and more than one replica is refused.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "owl-mast.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "owl-mast.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        owlmast.aisquad.com/database-mode: {{ ternary "bundled" "external" .Values.database.bundled | quote }}
        owlmast.aisquad.com/identity-mode: {{ ternary "bundled" "external" .Values.identity.bundled | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: {{ include "owl-mast.image" .Values.backend.image | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.backend.containerPort }}
          env:
            - name: SERVER_PORT
              value: {{ .Values.backend.containerPort | quote }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.backend.javaToolOptions | quote }}
            - name: OWLMAST_DATABASE_R2DBC_URL
              value: {{ printf "r2dbc:postgresql://%s:%s/%s?sslMode=%s" (include "owl-mast.database.host" .) (include "owl-mast.database.port" .) .Values.database.name (include "owl-mast.database.sslMode" .) | quote }}
            - name: OWLMAST_DATABASE_JDBC_URL
              value: {{ printf "jdbc:postgresql://%s:%s/%s?sslmode=%s" (include "owl-mast.database.host" .) (include "owl-mast.database.port" .) .Values.database.name (include "owl-mast.database.sslMode" .) | quote }}
            - name: OWLMAST_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: username
            - name: OWLMAST_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: password
            # The issuer tokens carry: the bundled Keycloak's public origin and realm, or the external issuer as it is.
            - name: OWLMAST_IDENTITY_ISSUER_URI
              value: {{ include "owl-mast.identity.issuerUri" . | quote }}
            # The backend itself refuses a plaintext issuer unless told otherwise: true only for a bundled
            # Keycloak whose public origin is a loopback http origin (local fixtures; owl-mast.validate accepts
            # one only beside a loopback routing.publicOrigin) or the explicit
            # identity.external.allowInsecureIssuer opt-in.
            - name: OWLMAST_IDENTITY_ALLOW_INSECURE_ISSUER
              value: {{ ternary "true" "false" (ternary (hasPrefix "http://" (include "owl-mast.keycloak.publicOrigin" .)) (default false .Values.identity.external.allowInsecureIssuer) .Values.identity.bundled) | quote }}
            {{- if .Values.identity.bundled }}
            # Where the backend reaches the bundled Keycloak: the cluster-local Service, plaintext inside the
            # cluster (NetworkPolicy admits the backend only). An external issuer is used on its own address.
            - name: OWLMAST_IDENTITY_BACKCHANNEL_URI
              value: {{ include "owl-mast.identity.backchannelUri" . | quote }}
            - name: OWLMAST_IDENTITY_ALLOW_INSECURE_BACKCHANNEL
              value: "true"
            {{- end }}
            # The backend is a confidential OpenID Connect client; tokens stay in the backend.
            - name: OWLMAST_IDENTITY_CLIENT_ID
              value: {{ include "owl-mast.identity.clientId" . | quote }}
            - name: OWLMAST_IDENTITY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "owl-mast.identity.clientSecret" . }}
                  key: client-secret
            # The one application origin (frontend at /, backend at /api): redirect URI and session cookie.
            - name: OWLMAST_IDENTITY_APPLICATION_ORIGIN
              value: {{ include "owl-mast.routing.publicOrigin" . | quote }}
            {{- range .Values.backend.extraEnv }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.backend.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.backend.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.backend.probes.startup.failureThreshold }}
            {{- with .Values.backend.probes.startup.timeoutSeconds }}
            timeoutSeconds: {{ . }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.backend.probes.liveness.failureThreshold }}
            {{- with .Values.backend.probes.liveness.timeoutSeconds }}
            timeoutSeconds: {{ . }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.backend.probes.readiness.failureThreshold }}
            # Defaulted here as well: a release upgraded with --reuse-values carries no timeoutSeconds, and the
            # kubelet default of 1 s is shorter than the backend's identity-discovery timeout.
            timeoutSeconds: {{ dig "timeoutSeconds" 5 .Values.backend.probes.readiness }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
