{{- if and .Values.database.bundled (not .Values.postgresql.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "owl-mast.postgresql.dataClaim" . }}
  labels:
    {{- include "owl-mast.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  annotations:
    # Retained on uninstall; the claim outlives the release and is reused through
    # postgresql.persistence.existingClaim. Snapshot cadence/provider is an explicit later decision.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.postgresql.persistence.accessModes | nindent 4 }}
  {{- with .Values.postgresql.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgresql.persistence.size }}
{{- end }}
