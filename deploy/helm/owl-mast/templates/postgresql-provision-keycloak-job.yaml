{{- if and .Values.database.bundled .Values.identity.bundled .Values.postgresql.provisionKeycloakDatabase }}
# Explicit, operator-requested provisioning of Keycloak's database and principal on a bundled
# PostgreSQL whose data directory was initialised while the identity bundle was disabled
# (first-initialisation scripts never rerun). It runs as a PRE-upgrade hook against the PostgreSQL of
# the release as it is before the upgrade, so Keycloak's database exists before Helm applies and waits
# for the Keycloak and backend consumers. The hook carries its own script ConfigMap (hook resources
# are not release resources) and waits, bounded, for PostgreSQL readiness before provisioning.
# Idempotent: nothing existing is dropped or recreated. Refused on install (owl-mast.validate): a fresh
# install provisions at first initialisation. Bounded: the script fails at once when the PostgreSQL
# Service does not resolve, its readiness wait is short, and activeDeadlineSeconds keeps the whole Job
# below Helm's default 5m timeout; there is no retry (backoffLimit 0).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "owl-mast.postgresql.provisionScripts" . }}
  labels:
    {{- include "owl-mast.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql-provisioning
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  provision-keycloak.sh: {{ (include (print $.Template.BasePath "/postgresql-init-configmap.yaml") . | fromYaml).data | dig "provision-keycloak.sh" "" | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "owl-mast.postgresql.provisionJob" . }}
  labels:
    {{- include "owl-mast.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql-provisioning
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        {{- include "owl-mast.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql-provisioning
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: {{ .Values.postgresql.securityContext.runAsUser }}
        runAsGroup: {{ .Values.postgresql.securityContext.runAsGroup }}
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          image: {{ include "owl-mast.image" .Values.postgresql.image | quote }}
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          command: ["bash", "/owl-mast/provision-keycloak.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: PGHOST
              value: {{ include "owl-mast.postgresql.fullname" . }}
            - name: PGPORT
              value: {{ .Values.postgresql.service.port | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.adminExistingSecret }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.adminExistingSecret }}
                  key: password
            # The application principal and database, so the script can refuse a collision with them.
            - name: OWLMAST_APP_DATABASE
              value: {{ .Values.database.name | quote }}
            - name: OWLMAST_APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: username
            - name: OWLMAST_KEYCLOAK_DATABASE
              value: {{ .Values.identity.keycloak.database.name | quote }}
            - name: OWLMAST_KEYCLOAK_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.identity.keycloak.database.existingSecret }}
                  key: username
            - name: OWLMAST_KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.identity.keycloak.database.existingSecret }}
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: scripts
              mountPath: /owl-mast
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: {{ include "owl-mast.postgresql.provisionScripts" . }}
            defaultMode: 0555
{{- end }}
