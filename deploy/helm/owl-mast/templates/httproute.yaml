{{- if .Values.routing.gateway.enabled }}
# Gateway API routing (stable gateway.networking.k8s.io/v1 HTTPRoute). The Gateway, its GatewayClass and
# controller are supplied by the operator and referenced explicitly; the chart renders routes only. The
# Gateway API CRDs must be installed in the cluster before this resource can be applied.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "owl-mast.fullname" . }}
  labels:
    {{- include "owl-mast.labels" . | nindent 4 }}
  {{- with .Values.routing.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range .Values.routing.gateway.parentRefs }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .name | quote }}
      {{- with .namespace }}
      namespace: {{ . | quote }}
      {{- end }}
      {{- with .sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
      {{- with .port }}
      port: {{ . }}
      {{- end }}
    {{- end }}
  {{- with .Values.routing.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.routing.apiPathPrefix }}
        - path:
            type: PathPrefix
            value: {{ .Values.routing.actuatorPathPrefix }}
      backendRefs:
        - name: {{ include "owl-mast.backend.fullname" . }}
          port: {{ .Values.backend.service.port }}
    {{- if .Values.frontend.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.routing.frontendPathPrefix }}
      backendRefs:
        - name: {{ include "owl-mast.frontend.fullname" . }}
          port: {{ .Values.frontend.service.port }}
    {{- end }}
{{- end }}
