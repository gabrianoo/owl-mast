{{- if .Values.identity.bundled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "owl-mast.keycloak.fullname" . }}
  labels:
    {{- include "owl-mast.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  replicas: 1
  # Single instance. With the default (ispn) cache two Keycloak pods that run together try to form a cluster
  # (JGroups, discovered through the shared database); the NetworkPolicy admits only the backend on :8080, so
  # they cannot, the new pod's cluster health check stays DOWN, it never becomes ready and the rollout hangs
  # until `helm upgrade --wait` times out. Found by the bootstrap-admin retirement on the Kind target
  # (2026-11-12), the first upgrade that changed this pod. The cure is KC_CACHE=local below: a pod never
  # looks for a cluster, so an overlap is harmless. Rolling without surge only shortens the overlap: under
  # RollingUpdate the controller does not count a terminating pod, so the new pod can start while the old one
  # is still shutting down. Deliberately not `type: Recreate`: a release installed while this Deployment
  # still rolled carries the API server's default rollingUpdate block, and a server-side apply that only
  # changes the type is refused ("rollingUpdate may not be specified when strategy type is Recreate").
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "owl-mast.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: keycloak
  template:
    metadata:
      labels:
        {{- include "owl-mast.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        owlmast.aisquad.com/database-mode: {{ ternary "bundled" "external" .Values.database.bundled | quote }}
        {{- if .Values.identity.keycloak.importRealm }}
        # The realm file only (not the ConfigMap's labels): a changed identity.realm restarts Keycloak, which
        # imports the new realm at start; a chart version bump alone does not.
        checksum/realm: {{ (include (print $.Template.BasePath "/keycloak-realm-configmap.yaml") . | fromYaml).data | toJson | sha256sum }}
        {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Read-only root: /opt/keycloak/lib/quarkus is an emptyDir so Keycloak can re-augment for the
        # configured database at start; an empty mount would hide the image's build output
        # (quarkus-application.dat) and Keycloak could not start, so it is seeded from the same image first.
        - name: seed-quarkus-build
          image: {{ include "owl-mast.image" .Values.identity.keycloak.image | quote }}
          imagePullPolicy: {{ .Values.identity.keycloak.image.pullPolicy }}
          # Contents only, no attribute preservation: the emptyDir root is not owned by the runtime user.
          command: ["sh", "-c", "cp -R /opt/keycloak/lib/quarkus/. /seed/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: quarkus
              mountPath: /seed
      containers:
        - name: keycloak
          image: {{ include "owl-mast.image" .Values.identity.keycloak.image | quote }}
          imagePullPolicy: {{ .Values.identity.keycloak.image.pullPolicy }}
          args:
            - start
            {{- if .Values.identity.keycloak.importRealm }}
            - --import-realm
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: {{ printf "jdbc:postgresql://%s:%s/%s?sslmode=%s" (include "owl-mast.keycloak.database.host" .) (include "owl-mast.keycloak.database.port" .) .Values.identity.keycloak.database.name (include "owl-mast.keycloak.database.sslMode" .) | quote }}
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.identity.keycloak.database.existingSecret }}
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.identity.keycloak.database.existingSecret }}
                  key: password
            {{- if eq (include "owl-mast.keycloak.bootstrapAdminEnabled" .) "true" }}
            # Temporary: switch identity.keycloak.bootstrapAdmin.enabled off once a permanent admin exists.
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.identity.keycloak.bootstrapExistingSecret }}
                  key: username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.identity.keycloak.bootstrapExistingSecret }}
                  key: password
            {{- end }}
            # Cluster-local issuer; public origins and TLS termination are an OM-02.01 gate.
            - name: KC_HOSTNAME
              value: {{ include "owl-mast.keycloak.baseUrl" . | quote }}
            - name: KC_HTTP_ENABLED
              value: "true"
            # One instance, no cluster (see the strategy above). A build option: `start` re-augments for it, like
            # for KC_DB.
            - name: KC_CACHE
              value: local
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HTTP_MANAGEMENT_PORT
              value: "9000"
            {{- with .Values.identity.keycloak.proxyHeaders }}
            # Trusted only when set explicitly: a cluster-local Keycloak has no proxy in front of it.
            - name: KC_PROXY_HEADERS
              value: {{ . | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: {{ .Values.identity.keycloak.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.identity.keycloak.probes.startup.failureThreshold }}
            {{- with (dig "timeoutSeconds" 0 .Values.identity.keycloak.probes.startup) }}
            timeoutSeconds: {{ . }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: {{ .Values.identity.keycloak.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.identity.keycloak.probes.liveness.failureThreshold }}
            {{- with (dig "timeoutSeconds" 0 .Values.identity.keycloak.probes.liveness) }}
            timeoutSeconds: {{ . }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: {{ .Values.identity.keycloak.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.identity.keycloak.probes.readiness.failureThreshold }}
            {{- with (dig "timeoutSeconds" 0 .Values.identity.keycloak.probes.readiness) }}
            timeoutSeconds: {{ . }}
            {{- end }}
          resources:
            {{- toYaml .Values.identity.keycloak.resources | nindent 12 }}
          # Read-only root: Keycloak writes its runtime data, the start-time (re)build of the Quarkus
          # application and temporary files only to these emptyDirs.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /opt/keycloak/data
            - name: quarkus
              mountPath: /opt/keycloak/lib/quarkus
            {{- if .Values.identity.keycloak.importRealm }}
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: quarkus
          emptyDir: {}
        {{- if .Values.identity.keycloak.importRealm }}
        - name: realm
          configMap:
            name: {{ include "owl-mast.keycloak.realmConfigMap" . }}
        {{- end }}
{{- end }}
