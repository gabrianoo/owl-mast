# Qualified pins for OM-01.01-T1. Evidence and re-check commands: docs/toolchain-qualification.md.
# Libraries without a version here are managed by the Spring Boot 4.1.2 BOM.
[versions]
java = "27"
spring-boot = "4.1.2"
spotless = "8.11.0"
google-java-format = "2.0.0"
errorprone-plugin = "5.2.0"
errorprone = "2.52.0"
archunit = "1.5.1"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
