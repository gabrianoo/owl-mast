#Daemon JVM criteria (Gradle 9.8.2): Eclipse Temurin 27, auto-provisioned when no matching JDK is installed.
#Direct Adoptium release assets for the qualified build jdk-27.0.1.0.2+1 (checksums in docs/toolchain-qualification.md).
#Criteria constrain major version and vendor only; settings.gradle.kts and backend/build.gradle.kts enforce the exact
#runtime version from gradle.properties. Executably qualified: Linux x86_64 (local WSL2 and GitHub ubuntu-latest).
#Linux aarch64 and macOS aarch64 URLs provision the same build but are not executably qualified. No Windows or
#macOS x86_64 asset of 27.0.1+1 was published on 2026-11-06, so those platforms are unsupported until one is pinned.
toolchainUrl.LINUX.X86_64=https\://github.com/adoptium/temurin27-binaries/releases/download/jdk-27.0.1.0.2%2B1/OpenJDK27U-jdk_x64_linux_hotspot_27.0.1.0.2_1.tar.gz
toolchainUrl.LINUX.AARCH64=https\://github.com/adoptium/temurin27-binaries/releases/download/jdk-27.0.1.0.2%2B1/OpenJDK27U-jdk_aarch64_linux_hotspot_27.0.1.0.2_1.tar.gz
toolchainUrl.MAC_OS.AARCH64=https\://github.com/adoptium/temurin27-binaries/releases/download/jdk-27.0.1.0.2%2B1/OpenJDK27U-jdk_aarch64_mac_hotspot_27.0.1.0.2_1.tar.gz
toolchainVendor=ADOPTIUM
toolchainVersion=27
