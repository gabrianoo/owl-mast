# Team / enterprise overrides for _bmad/config.toml.
# Committed to the repo — applies to every developer on the project.
# Tables deep-merge over base config; keyed entries merge by key.
# Example: override an agent descriptor, or add a new agent.
#
# [agents.bmad-agent-pm]
# description = "Prefers short, bulleted PRDs over narrative drafts."

# GitHub delivery workflow (docs/github-delivery-workflow.md): build specs, deferred work,
# epic-context caches and sprint state are disposable working copies of GitHub state.
# Keep them out of Git so they never need merging or tracking. Historical artifacts already
# committed under _bmad-output/implementation-artifacts stay where they are.
[modules.bmm]
implementation_artifacts = "{project-root}/.bmad-work"
