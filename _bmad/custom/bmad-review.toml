# Owner decisions 2026-11-09: PR reviews land as GitHub review comments, not a JSON file; posting is
# automatic (no confirmation step), and every finding is posted (no cap). The shipped output_format
# ("both", JSON block included) is kept on purpose for content that is not a pull request.
activation_steps_prepend = [
  """Standing rule for this run: when you stage the content in step 2, also record the reviewed SHA, the full SHA that `git rev-parse` returns for the branch head, or the end commit of a commit range. For a PR passed by number or URL, stage `gh pr diff <ref>` and record that PR's `headRefOid` from `gh pr view <ref> --json headRefOid` at that moment. With several PRs, record one SHA per PR. on_complete uses these values, never the HEAD at posting time.""",
]
output_preferences = "When the content is a GitHub pull request (on_complete says how to tell) and the user invoked this skill directly, present the Markdown report only: do not print the JSON block or write a findings file, and, before on_complete runs, show nothing but the plan line. For any other content, and whenever another skill invoked this one, present per output_format as usual."
on_complete = """Posting applies only when the user invoked this skill directly. When another skill invoked it (a `skill:bmad-review` directive or a forwarded call), skip posting and stop: the caller gets the full report.

Decide whether the reviewed content is a GitHub pull request. It is when it was passed as one or more PR numbers or URLs, or when it is a branch with exactly one open PR against the base branch the diff was taken from: `gh pr list --head <branch> --base <base-branch> --state open --json number,url,baseRefName,headRefOid`. A commit range counts only when a PR or branch was also named; a range alone is never posted. When the content is not a pull request, skip posting and stop; the report was already presented. When several PRs were passed, do parts A to I once per PR, using the findings located in that PR's diff; findings outside all of those diffs go in the body of the first PR's review.

Standing rules for every text you post, inline or in a body: replace anything credential-like (tokens, keys, passwords, connection strings) with a placeholder and note the replacement in the body (part F). The commands below write `<owner>`, `<repo>`, and `<number>`: replace them with the values from the PR's own URL (`gh pr view <url-or-number> --json url,baseRefName,headRefOid`), never from the checkout's remote, and never leave gh's `{owner}`/`{repo}` placeholders in a command, because gh fills those from the checkout.

For a pull request, post the findings to it as one pull request review:
A. Check the reviewed SHA. `gh api repos/<owner>/<repo>/compare/<reviewed-sha>...<headRefOid> --jq .status` must print `identical` or `ahead`; that means the PR has the commit. If it prints anything else, or fails, the reviewed SHA is not on the PR: tell the user to push and run the review again, skip posting, and present the full Markdown report in chat.
B. Check for an earlier post. List the PR's reviews (`gh api --paginate repos/<owner>/<repo>/pulls/<number>/reviews`) and look for one by the current user (`gh api user --jq .login`) whose `commit_id` is the reviewed SHA and whose body starts with the heading literal `## bmad-review: PR #<number> at <reviewed-sha>`, with the full 40-character SHA and no backticks, for example `## bmad-review: PR #113 at b44d90c38068d26dbd866a07617ba86d77af9e7d`. If your own POST in this run already succeeded (for example a timeout after the server accepted it), do not post again; report that review's URL. If an earlier run posted it, this is a rerun of the same SHA: post anyway, with the heading `## bmad-review rerun: PR #<number> at <reviewed-sha>` and a link to the earlier review in the body. When this review follows an earlier round on another SHA, link that round's review in the body.
C. Collect the findings. Post every finding. When two or more lenses find the same problem at the same place, post one comment that names every lens.
D. Anchor each finding. Set `commit_id` to the reviewed SHA; if the PR head has moved since the review, anchor to the reviewed SHA anyway and note the move in the body. Anchors must be valid in the diff GitHub holds for that SHA: `gh api -H "Accept: application/vnd.github.diff" repos/<owner>/<repo>/compare/<baseRefName>...<reviewed-sha>`; the checkout and the PR's current files do not count. Anchor at the most specific line the finding names. Use `side: "RIGHT"` for added or unchanged lines and `side: "LEFT"` for removed lines; for a range, also set `start_line` and `start_side`. Before posting, check every anchor against that diff's hunk ranges and move any finding outside them into the body. Findings about a whole deleted file, and document-level, cross-file, or missing-file findings, also go in the body.
E. Format each comment as: `**[<lens>] <short title>**`, then the problem and its consequence, then `**Suggested fix:** <fix>`. Include code-relevant details, such as identifiers, line references, and acceptance-criteria IDs.
F. Write the body. This is the complete list of what it holds, in order: the heading from part B; the reviewed SHA, and a note when the PR head has moved since the review (part D); a link to the earlier round or earlier review when there is one (part B); the lenses run; a note that these are unverified AI review findings with no severity ranking; the findings to fix first; the unanchored findings (part D); the credential placeholders made, if any; and the attribution line this session puts at the end of PR descriptions. With zero findings, post a review with only this body and state in it that the review was clean.
G. Post. Write the review as a JSON file (`body`, `event`, `commit_id`, `comments`) and send it with `gh api -X POST repos/<owner>/<repo>/pulls/<number>/reviews --input <file>`, with `event: "COMMENT"` (never APPROVE or REQUEST_CHANGES). On a 422 that says a comment could not be resolved, re-check every anchor against the part D diff, move the ones outside its hunks into the body, and retry once. Treat any other error, or a second failure, as a failed post (part I).
H. Verify. Count the posted inline comments with `gh api --paginate repos/<owner>/<repo>/pulls/<number>/reviews/<id>/comments --jq '.[].id' | wc -l` and compare with what was sent. If they differ, list the missing comments and post them as a follow-up COMMENT review on the reviewed SHA whose body starts with `## bmad-review follow-up: PR #<number> at <reviewed-sha>` and links the main review, and report it.
I. Report. On success, limit the chat report to the posted review's URL, the finding count per lens, and the findings to fix first. If posting fails, say so, show the error, and present the full Markdown report in chat instead."""
