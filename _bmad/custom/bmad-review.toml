# Owner decisions 2026-11-09: PR reviews land as GitHub review comments, not a JSON file; posting is
# automatic (no confirmation step), and every finding is posted (no cap). The shipped output_format
# ("both", JSON block included) is kept on purpose for content that is not a pull request.
activation_steps_prepend = [
  """Standing rule for this run: when you stage the content in step 2, also record the reviewed SHA: for a branch, the full SHA that `git rev-parse` returns for its head; for a commit range, the range's end commit. For a PR passed by number or URL, first read its `headRefOid`, `baseRefName`, `state`, and `mergeCommit` (`gh pr view <ref> --json url,headRefOid,baseRefName,state,mergeCommit`), then stage GitHub's diff at that SHA, `gh api -H "Accept: application/vnd.github.diff" repos/<owner>/<repo>/compare/<diff-base>...<headRefOid>`, and record `headRefOid` and the diff base. The diff base is `<baseRefName>` for an OPEN PR and `<mergeCommit>^1` (written `<mergeCommit>%5E1` in the URL) for a MERGED PR, because the base branch already contains a merged head; read `state` and `mergeCommit` with `gh pr view` as well. If the staging fetch fails (auth, 404, timeout) or the diff is truncated, report it and stop; never fall back to a local diff. The diff is truncated when the JSON compare (`gh api repos/<owner>/<repo>/compare/<diff-base>...<headRefOid> --jq '.files | length'`) reports 300 or more files; a file with `changes` > 0 and no `patch` in that JSON is unpatched (GitHub left its hunks out), so record those files too. When a commit range is named together with the PR, stage the range instead and record its end commit and that this is a range review. With several PRs, stage one diff per PR, record one SHA per PR, and tag each finding with its PR. Uncommitted, staged-only, provided-diff, and file-list content, and a branch diff that includes uncommitted changes, get no reviewed SHA. on_complete uses these values, never the HEAD at posting time.""",
]
output_preferences = "When the content is a GitHub pull request (on_complete says how to tell) and the user invoked this skill directly, present the Markdown report only: do not print the JSON block or write a findings file, and, before on_complete runs, show nothing but the plan line. For any other content, and whenever another skill invoked this one, present per output_format as usual."
on_complete = """Posting applies only when the user invoked this skill directly. When another skill invoked it (a `skill:bmad-review` directive or a forwarded call), skip posting and stop: the caller gets the full report.

Decide whether the reviewed content is a GitHub pull request. It is when it was passed as one or more PR numbers or URLs, or when it is a branch with exactly one open PR against the base branch the diff was taken from: `gh pr list --head <branch> --base <base-branch> --state open --json number,url,baseRefName,headRefOid`. Content with no reviewed SHA (uncommitted, staged-only, provided-diff, file-list, or a branch diff that includes uncommitted changes) is never posted, and a commit range counts only when a PR or branch was also named. If the lookup fails (auth, network), report the error and present the full report per output_format. When the content is not a pull request, skip posting and stop; the report was already presented. When several PRs were passed, do parts A to I once per PR, using the findings tagged with that PR; findings outside all of the diffs go in the body of the first PR whose post succeeds.

Standing rule for every text you post, inline or in a body: replace anything credential-like (tokens, keys, passwords, connection strings) with a placeholder and note the replacement in the body (part F).

Commands below write `<owner>`, `<repo>`, and `<number>`: fill them from the PR's URL (`gh pr view <ref> --json url`), and never leave gh's `{owner}`/`{repo}` placeholders in a command, because gh fills those from the checkout. A bare number or branch is resolved by gh against the checkout's repository, so print the resolved PR URL in the report (part I) so the user can see where the review went.

For a pull request, post the findings to it as one pull request review:
A. Check the reviewed SHA. Two calls: `gh api repos/<owner>/<repo>/compare/<reviewed-sha>...<headRefOid> --jq .status` must print `identical` or `ahead` (the SHA is on the PR head's history), and `gh api repos/<owner>/<repo>/compare/<diff-base>...<reviewed-sha> --jq .ahead_by` must print a number greater than 0 (the SHA is past the diff base, not a base-branch commit). If either prints anything else, treat the reviewed SHA as not on the PR: for an OPEN PR tell the user to push and run the review again; for a MERGED PR say the SHA is not on the PR. Either way skip posting and present the full Markdown report in chat. If a call fails, report the error and do the same.
B. Check for an earlier post. List the PR's reviews (`gh api --paginate repos/<owner>/<repo>/pulls/<number>/reviews`), keep that list for part G, and look for one whose `commit_id` is the reviewed SHA and whose body starts with the heading literal `## bmad-review: PR #<number> at <reviewed-sha>`, with the full 40-character SHA and no backticks, for example `## bmad-review: PR #113 at b44d90c38068d26dbd866a07617ba86d77af9e7d`. Also match on the author when `gh api user --jq .login` works; if it fails (for example a 403 for an integration token), match on heading and `commit_id` only. Then:
   B1. Your own POST in this run already succeeded (for example, it timed out but the server had accepted it): do not post again; continue to part H with that review.
   B2. An earlier run posted it: this is a rerun of the same SHA; post anyway with the heading `## bmad-review rerun: PR #<number> at <reviewed-sha>` and a link to the earlier review in the body.
   B3. This review follows an earlier round on another SHA: link that round's review in the body.
C. Collect the findings. Post every finding. When two or more lenses find the same problem at the same place, post one comment that names every lens.
D. Anchor each finding. Set `commit_id` to the reviewed SHA; if the PR head has moved since the review, anchor to the reviewed SHA anyway and note the move in the body. Anchors must be valid in the diff GitHub holds for that SHA: `gh api -H "Accept: application/vnd.github.diff" repos/<owner>/<repo>/compare/<diff-base>...<reviewed-sha>`, with the diff base recorded at staging; the checkout and the PR's current files do not count. If that diff cannot be fetched, or is truncated as defined at staging, put every finding in the body with its file and line, post no inline comments, and say why in the body. Findings in an unpatched file go in the body. In a range review, LEFT line numbers refer to the range start, not the diff base, so findings on removed lines go in the body. Anchor at the most specific line the finding names. Use `side: "RIGHT"` for added or unchanged lines and `side: "LEFT"` for removed lines; for a range, also set `start_line` and `start_side`, and `start_line` and `line` must fall in the same hunk on the same side. Before posting, check every anchor against that diff's hunk ranges and move any finding outside them into the body. Findings about a whole deleted file, and document-level, cross-file, or missing-file findings, also go in the body.
E. Format each comment as: `**[<lens>] <short title>**`, then the problem and its consequence, then `**Suggested fix:** <fix>`. Include code-relevant details, such as identifiers, line references, and acceptance-criteria IDs.
F. Write the body. This is the complete list of what it holds, in order: the heading from part B; the reviewed SHA, and a note when the PR head has moved since the review (part D); a link to the earlier round or earlier review when there is one (part B); for a follow-up round, the earlier round's threads checked against the reviewed SHA, each as left resolved, reopened (with a reply), or open owner decision; the lenses run; a note that these are unverified AI review findings with no severity ranking; the findings to fix first, which is the coordinator's pick and a deliberate exception, for PR bodies and the chat report only, to SKILL.md's no-ranking rule (the lenses' findings stay unranked); the unanchored findings (part D); the credential placeholders made, if any; and the attribution line this session puts at the end of PR descriptions. With zero findings, post a review with only this body and state in it that the review was clean.
G. Post. Write the review as a JSON file (`body`, `event`, `commit_id`, `comments`) and send it with `gh api -X POST repos/<owner>/<repo>/pulls/<number>/reviews --input <file>`, with `event: "COMMENT"` (never APPROVE or REQUEST_CHANGES). Record the returned review id. On a 422 that says a comment could not be resolved, re-check every anchor against the part D diff, move the ones outside its hunks into the body, and retry once; if the re-check changes nothing, retry once with `comments: []` and every finding in the body. On a timeout or a 5xx, list the PR's reviews again and look for the exact heading this POST sent (including `rerun`) at the reviewed SHA, accepting only a review that was not in the part B list: if it is there, continue to part H with it; if not, wait about 30 seconds and look once more, then treat the post as failed (part I). Never POST again blindly. Treat any other error, or a second failure, as a failed post (part I).
H. Verify. Run `got=$(gh api --paginate repos/<owner>/<repo>/pulls/<number>/reviews/<id>/comments --jq '.[] | "\\(.path):\\(.line // .original_line)"')`. If gh exits non-zero, report the error and post no follow-up. Otherwise count with `n=$(printf '%s' "$got" | grep -c .)`, which prints 0 for an empty list, and compare `$n` with the number of comments sent. Also compare the `path:line` pairs in `$got` with the pairs sent, as a multiset: each pair sent but not returned is a missing comment. If anything is missing, post a follow-up COMMENT review on the reviewed SHA with no inline comments, whose body starts with `## bmad-review follow-up: PR #<number> at <reviewed-sha>`, links the main review, and lists each missing comment with its file and line. Report the follow-up review's URL.
I. Report. On success, limit the chat report to the posted review's URL (which shows the resolved repository), the finding count per lens, and the findings to fix first. If posting fails, say so, show the error, and present the full Markdown report in chat instead."""
