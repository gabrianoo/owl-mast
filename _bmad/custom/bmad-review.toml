# Team override for bmad-review (owner-requested engineering rules, 2026-11-07). Lists append to the skill defaults.

[workflow]
persistent_facts = [
  """All Ubuntu CI jobs must pin an explicitly qualified fixed runner version (for Owl Mast, ubuntu-26.04); never use ubuntu-latest or another floating Ubuntu runner alias, including in matrices or reusable workflows. Verify runner availability and checks before claiming qualification.""",
  """Owl Mast Kubernetes/Helm packaging must support stable Gateway API routing as a first-class option, alongside optional Ingress compatibility. Validate parent Gateway/listener references, routes/backend services, prerequisites and fail-closed configuration; include render/negative tests and distinguish manifest support from controller/runtime qualification. Kubernetes Ingress API is frozen, not removed/deprecated; ingress-nginx controller retirement is a separate fact.""",
]
review_guidance = [
  """All Ubuntu CI jobs must pin an explicitly qualified fixed runner version (for Owl Mast, ubuntu-26.04); never use ubuntu-latest or another floating Ubuntu runner alias, including in matrices or reusable workflows. Verify runner availability and checks before claiming qualification.""",
  """Owl Mast Kubernetes/Helm packaging must support stable Gateway API routing as a first-class option, alongside optional Ingress compatibility. Validate parent Gateway/listener references, routes/backend services, prerequisites and fail-closed configuration; include render/negative tests and distinguish manifest support from controller/runtime qualification. Kubernetes Ingress API is frozen, not removed/deprecated; ingress-nginx controller retirement is a separate fact.""",
]

# Owner request 2026-11-09: PR reviews land as GitHub review comments, not a JSON file.
# Deliberate owner decisions (2026-11-09): posting is automatic, with no confirmation step, and every
# finding is posted, with no cap; the review body states that the findings are unverified. The shipped
# output_format ("both", JSON block included) is kept on purpose for content that is not a pull request.
activation_steps_append = [
  """When staging the content, record the reviewed SHA: the full `git rev-parse` of the branch head or the end of the commit range at that moment. on_complete uses that value, not the HEAD at posting time.""",
]
output_preferences = "When the content is a GitHub pull request (on_complete says how to tell), present the markdown report only: do not print the JSON block or write a findings file, and before on_complete runs show nothing but the plan line. on_complete decides what the chat report contains. For any other content, present per output_format as usual."
on_complete = """Decide first whether the reviewed content is a GitHub pull request: it was passed as one or more PR numbers or URLs, or it is a branch or commit range whose branch has exactly one open PR (`gh pr list --head <branch> --state open --json number,url,baseRefName,headRefOid`, requiring exactly one result). When it is not, present the markdown report in chat as usual and stop here. When several PRs were passed, do the following once per PR, using the findings located in that PR's diff; findings in none of those diffs go in the body of the first PR's review.

For a pull request, post the findings to it as one pull request review, then report:
1. Identify the PR. Take owner, repo, and number from the PR's own URL (`gh pr view <url-or-number> --json url,baseRefName,headRefOid`), never from the checkout's remote. Check that the reviewed SHA is one of the PR's commits (`gh api --paginate repos/{owner}/{repo}/pulls/{number}/commits --jq '.[].sha'`). If it is not, tell the user to push, and post a review with only a body that holds every finding and says why nothing is anchored.
2. Check for an earlier post. Look for an existing review by the current user (`gh api user --jq .login`) on the same `commit_id` whose body starts with the heading `## bmad-review: PR #{number} at <full 40-character sha>` (`gh api --paginate repos/{owner}/{repo}/pulls/{number}/reviews`). If one exists, do not post again; report its URL instead. When this review follows an earlier round on another SHA, link that round's review in the body.
3. Select the findings. Post every finding. When two or more lenses find the same problem at the same place, post one comment that names every lens. Replace anything credential-like (tokens, keys, passwords, connection strings) in a finding with a placeholder and say so in the body.
4. Anchor each finding. Set `commit_id` to the reviewed SHA; if the PR head has moved since the review, say so in the body and anchor to the reviewed SHA anyway. Anchors must be valid in the diff GitHub shows for that SHA: run `git fetch origin`, then `git diff origin/<baseRefName>...<reviewed-sha>`; the PR's current files do not count. Use `side: "RIGHT"` for added or unchanged lines and `side: "LEFT"` (with `start_side` for a range) for removed lines, at the most specific line the finding names, using `start_line` for a range. Findings about a whole deleted file, and document-level, cross-file, or missing-file findings, go in the body.
5. Format each comment as: `**[<lens>] <short title>**`, then the problem and its consequence, then `**Suggested fix:** <fix>`. Include code-relevant details, such as identifiers, line references, and acceptance-criteria IDs.
6. Write the body. Start with the heading from step 2, then include the reviewed SHA, the lenses run, a note that these are unverified AI review findings with no severity ranking, the suggested first fixes, the unanchored findings, and the attribution line this session puts at the end of PR descriptions. With zero findings, post a review with only this body and say the review was clean.
7. Post. Write the review as a JSON file (`body`, `event`, `commit_id`, `comments`) and send it with `gh api -X POST repos/{owner}/{repo}/pulls/{number}/reviews --input <file>`, with `event: "COMMENT"` (never APPROVE or REQUEST_CHANGES). On a 422 saying a comment could not be resolved, move the failing comments into the body and retry once.
8. Verify. Count the posted inline comments with `gh api --paginate --slurp repos/{owner}/{repo}/pulls/{number}/reviews/{id}/comments --jq 'map(length) | add'` and compare with what was sent. If they differ, list the missing comments, post them as a follow-up COMMENT review on the same `commit_id` whose body starts with `## bmad-review follow-up: PR #{number} at <sha>` and links the main review, and report it.
9. Report. On success, limit the chat report to the posted review's URL, the finding count per lens, and the few findings worth acting on first. If posting fails, say so, show the error, and present the full markdown report in chat instead."""
