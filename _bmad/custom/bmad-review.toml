# Owner decisions 2026-11-09: PR reviews land as GitHub review comments, not a JSON file; posting is
# automatic (no confirmation step), and every finding is posted (no cap). The shipped output_format
# ("both", JSON block included) is kept on purpose for content that is not a pull request. "The findings
# to fix first" in the review body and the chat report is the coordinator's pick and a deliberate exception,
# for those two places only, to SKILL.md's no-ranking rule; the lenses' findings stay unranked.
activation_steps_prepend = [
  """Standing rule for this run: when you stage the content in step 2, also record the reviewed SHA: for a branch, the full SHA that `git rev-parse` returns for its head; for a commit range, the range's end commit. For a PR passed by number or URL, first read its `headRefOid`, `baseRefName`, `state`, and `mergeCommit` (`gh pr view <ref> --json url,headRefOid,baseRefName,state,mergeCommit`), then stage GitHub's diff at that SHA, `gh api -H "Accept: application/vnd.github.diff" repos/<owner>/<repo>/compare/<diff-base>...<headRefOid>`, and record `headRefOid` and the diff base. The diff base is `<baseRefName>` for an OPEN PR and `<mergeCommit>^1` (written `<mergeCommit>%5E1` in the URL) for a MERGED PR, because the base branch already contains a merged head; read `state` and `mergeCommit` with `gh pr view` as well. If the staging fetch fails (auth, 404, timeout) or the diff is truncated, report it and stop; never fall back to a local diff. The diff is truncated when the JSON compare (`gh api repos/<owner>/<repo>/compare/<diff-base>...<headRefOid> --jq '.files | length'`) reports 300 or more files; a file with `changes` > 0 and no `patch` in that JSON is unpatched (GitHub left its hunks out), so record those files too. When a commit range is named together with the PR, stage the range instead and record its end commit and that this is a range review. With several PRs, stage one diff per PR, record one SHA per PR, and tag each finding with its PR. Uncommitted, staged-only, provided-diff, and file-list content, and a branch diff that includes uncommitted changes, get no reviewed SHA; such content is presented per output_format and never posted. on_complete uses these values, never the HEAD at posting time.""",
]
output_preferences = "When the content has a reviewed SHA (the standing rule above records one) for a GitHub pull request (on_complete says how a PR is identified) and the user invoked this skill directly, present the Markdown report only: do not print the JSON block or write a findings file, and, before on_complete runs, show nothing but the plan line. For any other content, including content with no reviewed SHA, and whenever another skill invoked this one, present per output_format as usual."
on_complete = """Posting applies only when the user invoked this skill directly. When another skill invoked it (a `skill:bmad-review` directive or a forwarded call), skip posting and stop: the caller gets the full report.

Decide whether the reviewed content is a GitHub pull request. Content with no reviewed SHA (see the standing rule) is not a pull request: present the full report per output_format and stop. Otherwise it is a pull request when it was passed as one or more PR numbers or URLs, or when it is a branch with exactly one open PR against the base branch the diff was taken from: `gh pr list --head <branch> --base "${base#*/}" --state open --json number,url,baseRefName,headRefOid`, where `${base#*/}` strips a remote prefix such as `origin/`, because GitHub's base is the bare branch name. A commit range counts only when a PR or branch was also named. If the lookup fails (auth, network), report the error and present the full report per output_format. When the content is not a pull request, skip posting and stop; the report was already presented. When several PRs were passed, do parts A to I once per PR, using the findings tagged with that PR; findings outside all of the diffs go in the body of the first PR whose post succeeds.

Standing rule for every text you post, inline or in a body: replace anything credential-like (tokens, keys, passwords, connection strings) with a placeholder and note the replacement in the body (part F).

Commands below write `<owner>`, `<repo>`, and `<number>`: fill them from the PR's URL (`gh pr view <ref> --json url`), and never leave gh's `{owner}`/`{repo}` placeholders in a command, because gh fills those from the checkout. A bare number or branch is resolved by gh against the checkout's repository, so print the resolved PR URL in the report (part I) to show the user where the review went.

Headings. This review's heading is `## bmad-review: PR #<number> at <reviewed-sha>`, with the full 40-character SHA and no backticks, for example `## bmad-review: PR #113 at b44d90c38068d26dbd866a07617ba86d77af9e7d`. A rerun (part B) uses `## bmad-review rerun: PR #<number> at <reviewed-sha>`, a follow-up (part H) `## bmad-review follow-up: PR #<number> at <reviewed-sha>`, and a continuation (part G) `## bmad-review continued (<n>): PR #<number> at <reviewed-sha>`. A heading is the whole first line of a body; match headings on the whole first line, never on a prefix.

For a pull request, post the findings to it as one pull request review:
A. Check the reviewed SHA. Two calls: `gh api repos/<owner>/<repo>/compare/<reviewed-sha>...<headRefOid> --jq .status` must print `identical` or `ahead` (the SHA is in the PR head's history), and `gh api repos/<owner>/<repo>/compare/<diff-base>...<reviewed-sha> --jq .ahead_by` must print a number greater than 0 (the SHA is past the diff base, not a base-branch commit; for a branch source the diff base is the base branch). If either prints anything else, treat the reviewed SHA as not on the PR: for an OPEN PR tell the user to push and run the review again; for a MERGED PR say the SHA is not on the PR. Either way skip posting and present the full Markdown report in chat. If a call fails, report the error and do the same.
B. Check for an earlier post. List the PR's reviews (`gh api --paginate repos/<owner>/<repo>/pulls/<number>/reviews`), keep that list for part G, and look for one whose `commit_id` is the reviewed SHA and whose first line is exactly this review's heading. Also match on the author when `gh api user --jq .login` works; if it fails (for example a 403 for an integration token), match on heading and `commit_id` only. Then:
   B1. An earlier run posted it: this is a rerun of the same SHA; post with the rerun heading and link the earlier review in the body (F3).
   B2. This review follows an earlier round on another SHA: link that round's review (F3) and list its open threads (F4).
C. Collect the findings. Post every finding. When two or more lenses find the same problem at the same place, post one comment that names every lens.
D. Anchor each finding. Set `commit_id` to the reviewed SHA; if the PR head has moved since the review, anchor to the reviewed SHA anyway and note the move in the body (F2). Anchors must be valid in the diff GitHub holds for that SHA: `gh api -H "Accept: application/vnd.github.diff" repos/<owner>/<repo>/compare/<diff-base>...<reviewed-sha>`, with the diff base recorded at staging; the checkout and the PR's current files do not count. If that diff cannot be fetched, or is truncated as defined at staging, put every finding in the body with its file and line, post no inline comments, and say why in the body. Findings in an unpatched file go in the body. In a range review, LEFT line numbers refer to the range start, not the diff base, so findings on removed lines go in the body. Anchor at the most specific line the finding names. Use `side: "RIGHT"` for added or unchanged lines and `side: "LEFT"` for removed lines; for a range, also set `start_line` and `start_side`, and `start_line` and `line` must fall in the same hunk on the same side. Before posting, check every anchor against that diff's hunk ranges and move any finding outside them into the body. Findings about a whole deleted file, and document-level, cross-file, or missing-file findings, also go in the body.
E. Format each comment as: `**[<lens>] <short title>**`, then the problem and its consequence, then `**Suggested fix:** <fix>`. Include code-relevant details, such as identifiers, line references, and acceptance-criteria IDs.
F. Write the body, in this order and nothing else:
   F1. the heading (see Headings);
   F2. the reviewed SHA, and a note when the PR head has moved since the review (part D);
   F3. a link to the earlier round or earlier review when there is one (part B);
   F4. for a follow-up round, the earlier round's threads still open at the reviewed SHA, listed with their URLs; this procedure posts no replies and resolves nothing, and the body says so;
   F5. the lenses run;
   F6. a note that these are unverified AI review findings with no severity ranking;
   F7. the findings to fix first;
   F8. the unanchored findings (part D);
   F9. the credential placeholders made, if any;
   F10. the attribution line this session puts at the end of PR descriptions.
   With zero findings, post a review with only this body and state in it that the review was clean.
G. Post. Write the review as a JSON file (`body`, `event`, `commit_id`, `comments`). If the body is longer than 60,000 characters (GitHub rejects a body over 65,536), keep F1 to F7 and F10 in the main body and move the rest, in order, into one or more continuation bodies, each starting with the continuation heading and a link to the main review; post the continuations as COMMENT reviews on the reviewed SHA with no inline comments after the main review succeeds. Send the main review with `gh api -X POST repos/<owner>/<repo>/pulls/<number>/reviews --input <file>`, with `event: "COMMENT"` (never APPROVE or REQUEST_CHANGES). Record the returned review id. On a 422 that says a comment could not be resolved, re-check every anchor against the part D diff, move the ones outside its hunks into the body, and retry once; on any second 422, retry once more with `comments: []` and every finding in the body. On a timeout or a 5xx, list the PR's reviews again and look for a review at the reviewed SHA whose first line is exactly the heading this POST sent and that was not in the part B list: if found, continue to part H with it; if not, wait about 30 seconds and look once more, then treat the post as failed (part I). Never POST again blindly. Treat any other error as a failed post (part I).
H. Verify. Run `got=$(gh api --paginate "repos/<owner>/<repo>/pulls/<number>/comments?per_page=100" --jq '.[] | select(.pull_request_review_id==<id>) | "\\(.path):\\(.line // .original_line)"')`; the review-level endpoint `reviews/<id>/comments` returns `null` for `line` and `original_line`, so it cannot be used here. If gh exits non-zero, report the error and post no follow-up. Otherwise count with `n=$(printf '%s' "$got" | grep -c .)`, which prints 0 for an empty list, and compare `$n` with the number of comments sent. Also compare the `path:line` pairs in `$got` with the pairs sent, as a multiset: each pair sent but not returned is a missing comment. If anything is missing, post a follow-up COMMENT review on the reviewed SHA with no inline comments, whose body starts with the follow-up heading, links the main review, and lists each missing comment with its file and line. Report the follow-up review's URL.
I. Report. On success, limit the chat report to the posted review's URL (which shows the resolved repository), the finding count per lens, and the findings to fix first. If posting fails, say so, show the error, and present the full Markdown report in chat instead."""
