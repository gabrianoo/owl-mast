# Team override for bmad-walkthrough. Lists append to the skill defaults.

[workflow]
# GitHub delivery workflow (owner-requested 2026-11-09): Approve merges the PR and moves the ticket to Done.
# Owner decision 2026-11-12: a risk spot the human does not accept is not fixed in the walkthrough; it becomes a
# finding of a walkthrough round and goes through a bmad-build fix round and a bmad-review round like any other.
activation_steps_prepend = [
  """When the request names a GitHub delivery issue and PR, treat the PR as the explicit change and hydrate the story spec from the issue with `python3 -m automation.github_delivery spec-pull <issue> --out .bmad-work/<key>.md` so orientation finds its intent and review order (`docs/github-delivery-workflow.md` section "3. bmad-walkthrough"). If `gh` is unavailable or the helper refuses, report its message and HALT.""",
  """Standing rule for a GitHub delivery walkthrough: after the detail pass (step 3) presents its risk spots, number them and ask the human which ones they accept, before the closing menu. If the human asks to ship or to rework before the detail pass was shown, identify the risk spots and ask this question first; the decision prompt comes after it. A risk is accepted only when the human says so explicitly; silence, "next" or a general approval is not acceptance, so ask until every risk spot has an answer. Do not ask again about a risk that an earlier walkthrough of this PR recorded as accepted, unless the code at that spot changed since; the only records that count are the summary of a round that `review-state` lists and the PR's `walkthrough-accepted-risks` document read with `doc-pull`. Never fix a risk in this thread, and do not offer the wrap-up step's interactive patching: `docs/github-delivery-workflow.md` section "3. bmad-walkthrough" steps 2-4 say where each risk goes, and on_complete acts on it.""",
]
persistent_facts = [
  "file:{project-root}/docs/github-delivery-workflow.md",
]
on_complete = """For a GitHub delivery walkthrough, act on the risk answers and on the human's decision per `docs/github-delivery-workflow.md` section "3. bmad-walkthrough" steps 3-6. Risks first: every risk spot the human does not explicitly accept becomes one finding of a walkthrough round, posted with `post-review --verdict changes` against the head the walkthrough showed; the round's summary says it is a walkthrough round and lists each accepted risk with the human's reason, and Rework feedback from the same walkthrough goes into the same round. The round limit decides what follows, as step 3 lists. Round 9 or lower: launch the bmad-build fix-round thread and end this thread; leave the ticket In review, because the fix round moves it to In progress when it starts, bmad-review reviews the fix as usual, and a clean round starts a new walkthrough. Round 10: post it, then set the ticket Blocked with a PR comment, because no round is left to review a fix. No round left: post nothing and set the ticket Blocked with a PR comment that lists the risks. Approve is refused in this thread while a risk is neither accepted nor fixed. When every risk is accepted and no round is posted, record each accepted risk in the PR's `walkthrough-accepted-risks` document with `doc-push`; an accepted risk does not block Approve. Approve: verify the last review round is clean and was posted against the current head (`last_round_at_head`), no review thread is open, every check is green and the PR is mergeable; then merge exactly that head with `gh pr merge <PR> --merge --delete-branch --match-head-commit <head_sha>`, where `<head_sha>` comes from the `review-state` call that passed the gate (if GitHub refuses because the head moved, nothing merged: report it and leave the ticket In review), move the ticket from In review to Done with the helper, and make sure the issue is closed. Any failed precondition: report it and leave the ticket In review. Rework (no unaccepted risk): record the feedback as the next review round with `post-review`, list the accepted risks in its summary, and offer to launch a bmad-build fix-round thread (round 10, or no round left: Blocked, as for risks); leave the ticket In review, because the fix round moves it to In progress when it starts. Discuss: no GitHub change."""
