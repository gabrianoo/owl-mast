# Team override for bmad-code-review (owner-requested engineering rules, 2026-11-07). Lists append to the skill defaults.

[workflow]
persistent_facts = [
  """All Ubuntu CI jobs must pin an explicitly qualified fixed runner version (for Owl Mast, ubuntu-26.04); never use ubuntu-latest or another floating Ubuntu runner alias, including in matrices or reusable workflows. Verify runner availability and checks before claiming qualification.""",
  """Owl Mast Kubernetes/Helm packaging must support stable Gateway API routing as a first-class option, alongside optional Ingress compatibility. Validate parent Gateway/listener references, routes/backend services, prerequisites and fail-closed configuration; include render/negative tests and distinguish manifest support from controller/runtime qualification. Kubernetes Ingress API is frozen, not removed/deprecated; ingress-nginx controller retirement is a separate fact.""",
]

# Owner decisions 2026-11-09: PR reviews land as GitHub review comments, like bmad-review; posting is
# automatic (no confirmation step), and every triaged finding is posted (no cap).
activation_steps_append = [
  """Standing rule for this run: immediately after writing `{diff_file}` in step-01, record the reviewed SHA. For a PR source it is that PR's `headRefOid` from `gh pr view <ref> --json headRefOid` at that moment; for a branch diff it is the full SHA that `git rev-parse` returns for HEAD; for a commit range it is the range end. on_complete uses this value, never the HEAD at posting time.""",
  """In step-04-present.md, run the posting procedure in `workflow.on_complete` after section 6 and before presenting the section 7 menu, so it runs whichever option the user then picks.""",
]
on_complete = """Decide whether the reviewed change is a GitHub pull request. It is when all three hold: the diff source was a PR, a branch, or a commit range for which a PR or branch was also named; the branch has exactly one open PR against the base branch the diff was taken from (`gh pr list --head <branch> --base <base-branch> --state open --json number,url,baseRefName,headRefOid`); and part A below confirms the PR has the reviewed SHA. Uncommitted, staged-only, provided-diff, and file-list sources are never posted, because the reviewed code is not in any commit on GitHub. When the change is not a pull request, skip posting and say why.

Standing rules for every text you post, inline or in a body: replace anything credential-like (tokens, keys, passwords, connection strings) with a placeholder and note the replacement in the body (part F). The commands below write `<owner>`, `<repo>`, and `<number>`: replace them with the values from the PR's own URL (`gh pr view <url-or-number> --json url,baseRefName,headRefOid`), never from the checkout's remote, and never leave gh's `{owner}`/`{repo}` placeholders in a command, because gh fills those from the checkout.

For a pull request, post the triaged findings to it as one pull request review:
A. Check the reviewed SHA. `gh api repos/<owner>/<repo>/compare/<reviewed-sha>...<headRefOid> --jq .status` must print `identical` or `ahead`; that means the PR has the commit. If it prints anything else, or fails, the reviewed SHA is not on the PR: tell the user to push and run the review again, and skip posting; the findings in chat and in the story file remain the record.
B. Check for an earlier post. List the PR's reviews (`gh api --paginate repos/<owner>/<repo>/pulls/<number>/reviews`) and look for one by the current user (`gh api user --jq .login`) whose `commit_id` is the reviewed SHA and whose body starts with the heading literal `## bmad-code-review: PR #<number> at <reviewed-sha>`, with the full 40-character SHA and no backticks, for example `## bmad-code-review: PR #113 at b44d90c38068d26dbd866a07617ba86d77af9e7d`. If your own POST in this run already succeeded (for example a timeout after the server accepted it), do not post again; report that review's URL. If an earlier run posted it, this is a rerun of the same SHA: post anyway, with the heading `## bmad-code-review rerun: PR #<number> at <reviewed-sha>` and a link to the earlier review in the body. When this review follows an earlier round on another SHA, link that round's review in the body.
C. Collect the findings. Post every `decision-needed`, `patch`, and `defer` finding as an inline comment. Rejected findings, including a `decision-needed` finding the user resolved as reject, are not posted inline; they go in the body (part F).
D. Anchor each finding. Set `commit_id` to the reviewed SHA; if the PR head has moved since the review, anchor to the reviewed SHA anyway and note the move in the body. Anchors must be valid in the diff GitHub holds for that SHA: `gh api -H "Accept: application/vnd.github.diff" repos/<owner>/<repo>/compare/<baseRefName>...<reviewed-sha>`; the checkout and the PR's current files do not count. Anchor at the most specific line the finding names. Use `side: "RIGHT"` for added or unchanged lines and `side: "LEFT"` for removed lines; for a range, also set `start_line` and `start_side`. Before posting, check every anchor against that diff's hunk ranges and move any finding outside them into the body. Findings about a whole deleted file also go in the body.
E. Format each comment as: `**[<bucket> · <severity>] <title>**`, then the problem and its evidence, including any acceptance criterion (AC) or constraint it violates, then `**Suggested fix:** <fix>`, then a status line: `Status: fixed in <sha>` when the fix is committed, `Status: fixed in working tree, not yet committed` when it is not, `Status: open action item`, `Status: deferred — <reason>`, or `Status: decided — <decision>`. The status is a snapshot of this run; a later round's review records what was pushed since.
F. Write the body. This is the complete list of what it holds, in order: the heading from part B; the reviewed SHA, and a note when the PR head has moved since the review (part D); a link to the earlier round or earlier review when there is one (part B); the story or spec reviewed, or `no story file`; the triage counts (decision-needed / patch / defer / rejected); the resulting story status, or, with no story file, `story status: n/a`; the unanchored findings (part D); the Rejected appendix in a collapsed `<details>` block; the credential placeholders made, if any; and the attribution line this session puts at the end of PR descriptions. With no inline comments to post (a clean review, or every finding rejected), post a review with only this body.
G. Post. Write the review as a JSON file (`body`, `event`, `commit_id`, `comments`) and send it with `gh api -X POST repos/<owner>/<repo>/pulls/<number>/reviews --input <file>`, with `event: "COMMENT"` (never APPROVE or REQUEST_CHANGES). On a 422 that says a comment could not be resolved, re-check every anchor against the part D diff, move the ones outside its hunks into the body, and retry once. Treat any other error, or a second failure, as a failed post (part I).
H. Verify. Count the posted inline comments with `gh api --paginate repos/<owner>/<repo>/pulls/<number>/reviews/<id>/comments --jq '.[].id' | wc -l` and compare with what was sent. If they differ, list the missing comments and post them as a follow-up COMMENT review on the reviewed SHA whose body starts with `## bmad-code-review follow-up: PR #<number> at <reviewed-sha>` and links the main review, and report it.
I. Report. Give the user the review URL. If posting fails, say so and show the error; the findings already presented in chat and written to the story file remain the record."""
