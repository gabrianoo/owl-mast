# Team override for bmad-code-review (owner-requested engineering rules, 2026-11-07). Lists append to the skill defaults.

[workflow]
persistent_facts = [
  """All Ubuntu CI jobs must pin an explicitly qualified fixed runner version (for Owl Mast, ubuntu-26.04); never use ubuntu-latest or another floating Ubuntu runner alias, including in matrices or reusable workflows. Verify runner availability and checks before claiming qualification.""",
  """Owl Mast Kubernetes/Helm packaging must support stable Gateway API routing as a first-class option, alongside optional Ingress compatibility. Validate parent Gateway/listener references, routes/backend services, prerequisites and fail-closed configuration; include render/negative tests and distinguish manifest support from controller/runtime qualification. Kubernetes Ingress API is frozen, not removed/deprecated; ingress-nginx controller retirement is a separate fact.""",
]

# Owner decisions 2026-11-09: PR reviews land as GitHub review comments, like bmad-review; posting is
# automatic (no confirmation step), and every triaged finding is posted (no cap).
activation_steps_append = [
  """Standing rule for this run: when step-01 writes `{diff_file}`, record the reviewed SHA. For a PR source, do not diff the local HEAD: first read the PR's `headRefOid` and `baseRefName` (`gh pr view <ref> --json url,headRefOid,baseRefName`), then write `{diff_file}` from GitHub's diff at that SHA, `gh api -H "Accept: application/vnd.github.diff" repos/<owner>/<repo>/compare/<baseRefName>...<headRefOid>`, and record `headRefOid`. For a branch diff, record the full SHA that `git rev-parse` returns for HEAD; for a commit range, the range's end commit. When step-01 narrows `{diff_file}` to a file group (instruction 7), record the group too. on_complete uses these values, never the HEAD at posting time.""",
  """In step-04-present.md, run the posting procedure in `workflow.on_complete` after section 6 and before presenting the section 7 menu. A run is one pass through step-04; section 7's "Re-run code review" starts a new run. A session abandoned at the section 4 or 5 prompts posts nothing; the story file is its record.""",
]
on_complete = """If this procedure already posted in this run (one pass through step-04), report that review's URL and stop; the terminal "On Complete" pass must not post again.

Decide whether the reviewed change is a GitHub pull request. When the diff source was a PR number or URL, it is that PR (`gh pr view <ref> --json url,number,baseRefName,headRefOid`); skip the branch lookup. When the source was a branch, or a commit range for which a branch was also named, it is a pull request when the branch has exactly one open PR against the base branch the diff was taken from: `gh pr list --head <branch> --base <base-branch> --state open --json number,url,baseRefName,headRefOid`. Uncommitted, staged-only, provided-diff, and file-list sources, and a bare commit range, are never posted, because the reviewed code is not in any commit on GitHub. If the lookup fails (auth, network), report the error and skip posting. When the change is not a pull request, skip posting and say why.

Standing rule for every text you post, inline or in a body: replace anything credential-like (tokens, keys, passwords, connection strings) with a placeholder and note the replacement in the body (part F).

Commands below write `<owner>`, `<repo>`, and `<number>`: fill them from the PR's URL (`gh pr view <ref> --json url`), and never leave gh's `{owner}`/`{repo}` placeholders in a command, because gh fills those from the checkout. A bare number or branch is resolved by gh against the checkout's repository, so print the resolved PR URL in the report (part I) so the user can see where the review went.

For a pull request, post the triaged findings to it as one pull request review:
A. Check the reviewed SHA. Two calls: `gh api repos/<owner>/<repo>/compare/<reviewed-sha>...<headRefOid> --jq .status` must print `identical` or `ahead` (the SHA is on the PR head's history), and `gh api repos/<owner>/<repo>/compare/<baseRefName>...<reviewed-sha> --jq .ahead_by` must print a number greater than 0 (the SHA is past the merge base, not a base-branch commit). If either prints anything else, treat the reviewed SHA as not on the PR: tell the user to push and run the review again, and skip posting (part I). If a call fails, report the error and do the same.
B. Check for an earlier post. List the PR's reviews (`gh api --paginate repos/<owner>/<repo>/pulls/<number>/reviews`) and look for one whose `commit_id` is the reviewed SHA and whose body starts with the heading literal `## bmad-code-review: PR #<number> at <reviewed-sha>`, with the full 40-character SHA and no backticks, for example `## bmad-code-review: PR #113 at b44d90c38068d26dbd866a07617ba86d77af9e7d`. When the review covers a file group, the heading continues ` (files: <group>)`, and a review of another group is not an earlier post of this one. Also match on the author when `gh api user --jq .login` works; if it fails (for example a 403 for an integration token), match on heading and `commit_id` only. Then:
   B1. Your own POST in this run already succeeded (for example, it timed out but the server had accepted it): do not post again; continue to part H with that review.
   B2. An earlier run posted it: this is a rerun of the same SHA; post anyway with the heading `## bmad-code-review rerun: PR #<number> at <reviewed-sha>` and a link to the earlier review in the body.
   B3. This review follows an earlier round on another SHA: link that round's review in the body.
C. Collect the findings. Post every `decision-needed`, `patch`, and `defer` finding as an inline comment. Rejected findings, including a `decision-needed` finding the user resolved as reject, are not posted inline; they go in the body (part F).
D. Anchor each finding. Set `commit_id` to the reviewed SHA; if the PR head has moved since the review, anchor to the reviewed SHA anyway and note the move in the body. Anchors must be valid in the diff GitHub holds for that SHA: `gh api -H "Accept: application/vnd.github.diff" repos/<owner>/<repo>/compare/<baseRefName>...<reviewed-sha>`; the checkout and the PR's current files do not count. If that diff cannot be fetched, or GitHub truncates it, put every finding in the body with its file and line, post no inline comments, and say why in the body. Anchor at the most specific line the finding names. Use `side: "RIGHT"` for added or unchanged lines and `side: "LEFT"` for removed lines; for a range, also set `start_line` and `start_side`, and `start_line` and `line` must fall in the same hunk on the same side. Before posting, check every anchor against that diff's hunk ranges and move any finding outside them into the body. Findings about a whole deleted file also go in the body.
E. Format each comment as: `**[<bucket> · <severity>] <title>**`, then the problem and its evidence, including any acceptance criterion (AC) or constraint it violates, then `**Suggested fix:** <fix>`, then a status line: `Status: fixed in <sha>` when the fix is committed, `Status: fixed in working tree, not yet committed` when it is not, `Status: open action item`, `Status: deferred — <reason>`, or `Status: decided — <decision>`. The status is a snapshot of this run; a later round's review records what was pushed since.
F. Write the body. This is the complete list of what it holds, in order: the heading from part B; the reviewed SHA, and a note when the PR head has moved since the review (part D); a link to the earlier round or earlier review when there is one (part B); for a follow-up round, the earlier round's threads checked against the reviewed SHA, each as left resolved, reopened (with a reply), or open owner decision; when the review covers a file group, the files covered and the groups still to review; the review layers that failed, if any, with a note that the review may be incomplete; the story or spec reviewed, or `no story file`; the triage counts (decision-needed / patch / defer / rejected); the resulting story status, or, with no story file, `story status: n/a`; the unanchored findings (part D); the Rejected appendix in a collapsed `<details>` block; the credential placeholders made, if any; and the attribution line this session puts at the end of PR descriptions. With no inline comments to post (a clean review, or every finding rejected), post a review with only this body; call it clean only when no layer failed.
G. Post. Write the review as a JSON file (`body`, `event`, `commit_id`, `comments`) and send it with `gh api -X POST repos/<owner>/<repo>/pulls/<number>/reviews --input <file>`, with `event: "COMMENT"` (never APPROVE or REQUEST_CHANGES). Record the returned review id. On a 422 that says a comment could not be resolved, re-check every anchor against the part D diff, move the ones outside its hunks into the body, and retry once; if the re-check changes nothing, retry once with `comments: []` and every finding in the body. On a timeout or a 5xx, repeat the part B lookup for the heading at the reviewed SHA: if the review is there, continue to part H with it. Treat any other error, or a second failure, as a failed post (part I).
H. Verify. Run `ids=$(gh api --paginate repos/<owner>/<repo>/pulls/<number>/reviews/<id>/comments --jq '.[].id')`. If gh exits non-zero, report the error and post no follow-up. Otherwise count the lines of `$ids` and compare with the number of comments sent. If they differ, post a follow-up COMMENT review on the reviewed SHA with no inline comments, whose body starts with `## bmad-code-review follow-up: PR #<number> at <reviewed-sha>`, links the main review, and lists each missing comment with its file and line. Report the follow-up review's URL.
I. Report. Give the user the review URL, which shows the resolved repository. If posting fails or was skipped, say so and show the error or reason; the findings already presented in chat and written to the story file remain the record."""
