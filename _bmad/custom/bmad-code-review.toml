# Team override for bmad-code-review (owner-requested engineering rules, 2026-11-07). Lists append to the skill defaults.

[workflow]
persistent_facts = [
  """All Ubuntu CI jobs must pin an explicitly qualified fixed runner version (for Owl Mast, ubuntu-26.04); never use ubuntu-latest or another floating Ubuntu runner alias, including in matrices or reusable workflows. Verify runner availability and checks before claiming qualification.""",
  """Owl Mast Kubernetes/Helm packaging must support stable Gateway API routing as a first-class option, alongside optional Ingress compatibility. Validate parent Gateway/listener references, routes/backend services, prerequisites and fail-closed configuration; include render/negative tests and distinguish manifest support from controller/runtime qualification. Kubernetes Ingress API is frozen, not removed/deprecated; ingress-nginx controller retirement is a separate fact.""",
]

# Owner decisions 2026-11-09: PR reviews land as GitHub review comments, like bmad-review; posting is
# automatic (no confirmation step), and every triaged finding is posted (no cap).
activation_steps_append = [
  """Standing rule for this run: when step-01 writes `{diff_file}`, record the reviewed SHA. For a PR source, do not diff the local HEAD: first read the PR's `headRefOid`, `baseRefName`, `state`, and `mergeCommit` (`gh pr view <ref> --json url,headRefOid,baseRefName,state,mergeCommit`), then write `{diff_file}` from GitHub's diff at that SHA, `gh api -H "Accept: application/vnd.github.diff" repos/<owner>/<repo>/compare/<diff-base>...<headRefOid>`, and record `headRefOid` and the diff base. The diff base is `<baseRefName>` for an OPEN PR and `<mergeCommit>^1` (written `<mergeCommit>%5E1` in the URL) for a MERGED PR, because the base branch already contains a merged head; read `state` and `mergeCommit` with `gh pr view` as well. If the staging fetch fails (auth, 404, timeout) or the diff is truncated, report it and stop; never fall back to a local diff. The diff is truncated when the JSON compare (`gh api repos/<owner>/<repo>/compare/<diff-base>...<headRefOid> --jq '.files | length'`) reports 300 or more files; a file with `changes` > 0 and no `patch` in that JSON is unpatched (GitHub left its hunks out), so record those files too. For a branch diff, or a diff from a spec's `baseline_commit`, record the full SHA that `git rev-parse` returns for HEAD; for a commit range, the range's end commit, and that this is a range review. When step-01 instruction 7 narrows `{diff_file}` to a file group, record the group; for a PR source, narrow by filtering GitHub's compare diff to the group's paths, never by rebuilding the diff from the local HEAD. on_complete uses these values, never the HEAD at posting time.""",
  """In step-04-present.md, run the posting procedure in `workflow.on_complete` after section 6 and before presenting the section 7 menu. A run is one pass through step-04; section 7's "Re-run code review" starts a new run. A session abandoned at the prompts in section 4 or 5 posts nothing; the story file is its record.""",
  """Before step-04 section 5 applies patches for a PR source, require `git rev-parse HEAD` to equal the reviewed SHA. When it does not, apply nothing, give those findings `Status: open action item`, and tell the user the patches were not applied because the checkout is not at the PR head.""",
]
on_complete = """If this procedure already posted in this run (one pass through step-04), for example because step-04's terminal On Complete section reaches it after the post made before the section 7 menu, report that review's URL and stop. A POST that timed out within this pass is handled in part G, not here.

Decide whether the reviewed change is a GitHub pull request. When the diff source was a PR number or URL, it is that PR (`gh pr view <ref> --json url,number,baseRefName,headRefOid,state,mergeCommit`); skip the branch lookup. When the source was a branch, a spec's `baseline_commit`, or a commit range, and HEAD is on a branch and the diff holds no working-tree changes, it is a pull request when that branch (`git branch --show-current`) has exactly one open PR against the base branch the diff was taken from: `gh pr list --head <branch> --base "${base#*/}" --state open --json number,url,baseRefName,headRefOid`, where `${base#*/}` strips a remote prefix such as `origin/`, because GitHub's base is the bare branch name. Uncommitted, staged-only, provided-diff, and file-list sources, and a range with no branch, are never posted, because the reviewed code is not in any commit on GitHub. If the lookup fails (auth, network), report the error and skip posting. When the change is not a pull request, skip posting and say why.

Standing rule for every text you post, inline or in a body: replace anything credential-like (tokens, keys, passwords, connection strings) with a placeholder and note the replacement in the body (part F).

Commands below write `<owner>`, `<repo>`, and `<number>`: fill them from the PR's URL (`gh pr view <ref> --json url`), and never leave gh's `{owner}`/`{repo}` placeholders in a command, because gh fills those from the checkout. A bare number or branch is resolved by gh against the checkout's repository, so print the resolved PR URL in the report (part I) to show the user where the review went.

Headings. This review's heading is `## bmad-code-review: PR #<number> at <reviewed-sha>`, with the full 40-character SHA and no backticks, for example `## bmad-code-review: PR #113 at b44d90c38068d26dbd866a07617ba86d77af9e7d`. When the review covers a file group, every heading below ends with ` (files: <group>)`. A rerun (part B) uses `## bmad-code-review rerun: PR #<number> at <reviewed-sha>`, a follow-up (part H) `## bmad-code-review follow-up: PR #<number> at <reviewed-sha>`, and a continuation (part G) `## bmad-code-review continued (<n>): PR #<number> at <reviewed-sha>`. A heading is the whole first line of a body; match headings on the whole first line, never on a prefix, so a review of another file group, or of the whole PR, never matches this one.

For a pull request, post the triaged findings to it as one pull request review:
A. Check the reviewed SHA. Two calls: `gh api repos/<owner>/<repo>/compare/<reviewed-sha>...<headRefOid> --jq .status` must print `identical` or `ahead` (the SHA is in the PR head's history), and `gh api repos/<owner>/<repo>/compare/<diff-base>...<reviewed-sha> --jq .ahead_by` must print a number greater than 0 (the SHA is past the diff base, not a base-branch commit; for a branch source the diff base is the base branch). If either prints anything else, treat the reviewed SHA as not on the PR: for an OPEN PR tell the user to push and run the review again; for a MERGED PR say the SHA is not on the PR. Either way skip posting (part I). If a call fails, report the error and do the same.
B. Check for an earlier post. List the PR's reviews (`gh api --paginate repos/<owner>/<repo>/pulls/<number>/reviews`), keep that list for part G, and look for one whose `commit_id` is the reviewed SHA and whose first line is exactly this review's heading. Also match on the author when `gh api user --jq .login` works; if it fails (for example a 403 for an integration token), match on heading and `commit_id` only. Then:
   B1. An earlier run posted it: this is a rerun of the same SHA; post with the rerun heading and link the earlier review in the body (F3).
   B2. This review follows an earlier round on another SHA: link that round's review (F3) and list its open threads (F4).
C. Collect the findings. Post every `decision-needed`, `patch`, and `defer` finding as an inline comment. Rejected findings, including a `decision-needed` finding the user resolved as reject, are not posted inline; they go in the body (F11).
D. Anchor each finding. Set `commit_id` to the reviewed SHA; if the PR head has moved since the review, anchor to the reviewed SHA anyway and note the move in the body (F2). Anchors must be valid in the diff GitHub holds for that SHA: `gh api -H "Accept: application/vnd.github.diff" repos/<owner>/<repo>/compare/<diff-base>...<reviewed-sha>`, with the diff base recorded at staging; the checkout and the PR's current files do not count. If that diff cannot be fetched, or is truncated as defined at staging, put every finding in the body with its file and line, post no inline comments, and say why in the body. Findings in an unpatched file go in the body. In a range review, LEFT line numbers refer to the range start, not the diff base, so findings on removed lines go in the body. Anchor at the most specific line the finding names. Use `side: "RIGHT"` for added or unchanged lines and `side: "LEFT"` for removed lines; for a range, also set `start_line` and `start_side`, and `start_line` and `line` must fall in the same hunk on the same side. Before posting, check every anchor against that diff's hunk ranges and move any finding outside them into the body. Findings about a whole deleted file also go in the body.
E. Format each comment as: `**[<bucket> · <severity>] <title>**`, then the problem and its evidence, including any acceptance criterion (AC) or constraint it violates, then `**Suggested fix:** <fix>`, then a status line: `Status: fixed in <sha>` when the fix is committed, `Status: fixed in working tree, not yet committed` when it is not, `Status: open action item`, `Status: deferred — <reason>`, or `Status: decided — <decision>`. The status is a snapshot of this run; a later round's review records what was pushed since.
F. Write the body, in this order and nothing else:
   F1. the heading (see Headings);
   F2. the reviewed SHA, and a note when the PR head has moved since the review (part D);
   F3. a link to the earlier round or earlier review when there is one (part B);
   F4. for a follow-up round, the earlier round's threads still open at the reviewed SHA, listed with their URLs; this procedure posts no replies and resolves nothing, and the body says so;
   F5. when the review covers a file group, the files covered and the groups still to review;
   F6. the review layers that failed, if any, with a note that the review may be incomplete;
   F7. the story or spec reviewed, or `no story file`;
   F8. the triage counts (decision-needed / patch / defer / rejected);
   F9. the resulting story status, or, with no story file, `story status: n/a`;
   F10. the unanchored findings (part D);
   F11. the Rejected appendix in a collapsed `<details>` block;
   F12. the credential placeholders made, if any;
   F13. the attribution line this session puts at the end of PR descriptions.
   With no inline comments to post (a clean review, or every finding rejected), post a review with only this body; call it clean only when no layer failed.
G. Post. Write the review as a JSON file (`body`, `event`, `commit_id`, `comments`). If the body is longer than 60,000 characters (GitHub rejects a body over 65,536), keep F1 to F9 and F13 in the main body and move the rest, in order, into one or more continuation bodies, each starting with the continuation heading and a link to the main review; post the continuations as COMMENT reviews on the reviewed SHA with no inline comments after the main review succeeds. Send the main review with `gh api -X POST repos/<owner>/<repo>/pulls/<number>/reviews --input <file>`, with `event: "COMMENT"` (never APPROVE or REQUEST_CHANGES). Record the returned review id. On a 422 that says a comment could not be resolved, re-check every anchor against the part D diff, move the ones outside its hunks into the body, and retry once; on any second 422, retry once more with `comments: []` and every finding in the body. On a timeout or a 5xx, list the PR's reviews again and look for a review at the reviewed SHA whose first line is exactly the heading this POST sent and that was not in the part B list: if found, continue to part H with it; if not, wait about 30 seconds and look once more, then treat the post as failed (part I). Never POST again blindly. Treat any other error as a failed post (part I).
H. Verify. Run `got=$(gh api --paginate "repos/<owner>/<repo>/pulls/<number>/comments?per_page=100" --jq '.[] | select(.pull_request_review_id==<id>) | "\\(.path):\\(.line // .original_line)"')`; the review-level endpoint `reviews/<id>/comments` returns `null` for `line` and `original_line`, so it cannot be used here. If gh exits non-zero, report the error and post no follow-up. Otherwise count with `n=$(printf '%s' "$got" | grep -c .)`, which prints 0 for an empty list, and compare `$n` with the number of comments sent. Also compare the `path:line` pairs in `$got` with the pairs sent, as a multiset: each pair sent but not returned is a missing comment. If anything is missing, post a follow-up COMMENT review on the reviewed SHA with no inline comments, whose body starts with the follow-up heading, links the main review, and lists each missing comment with its file and line. Report the follow-up review's URL.
I. Report. Give the user the review URL, which shows the resolved repository. If posting fails or was skipped, say so and show the error or reason; the findings already presented in chat and written to the story file remain the record."""
