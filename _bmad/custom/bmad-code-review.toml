# Team override for bmad-code-review (owner-requested engineering rules, 2026-11-07). Lists append to the skill defaults.

[workflow]
persistent_facts = [
  """All Ubuntu CI jobs must pin an explicitly qualified fixed runner version (for Owl Mast, ubuntu-26.04); never use ubuntu-latest or another floating Ubuntu runner alias, including in matrices or reusable workflows. Verify runner availability and checks before claiming qualification.""",
  """Owl Mast Kubernetes/Helm packaging must support stable Gateway API routing as a first-class option, alongside optional Ingress compatibility. Validate parent Gateway/listener references, routes/backend services, prerequisites and fail-closed configuration; include render/negative tests and distinguish manifest support from controller/runtime qualification. Kubernetes Ingress API is frozen, not removed/deprecated; ingress-nginx controller retirement is a separate fact.""",
]

# Owner request 2026-11-09: PR reviews land as GitHub review comments, like bmad-review.
# Deliberate owner decisions (2026-11-09): posting is automatic, with no confirmation step, and every
# triaged finding is posted, with no cap.
activation_steps_append = [
  """When the diff file is written, record the reviewed SHA: the full `git rev-parse` of the end commit of the diff (HEAD for a branch diff, the range end for a commit range). on_complete uses that value, not the HEAD at posting time.""",
]
on_complete = """This runs after the step 7 menu. Post before acting on whatever the user chose there, including "Start the next story" and "Re-run code review".

Decide first whether the reviewed change is a GitHub pull request: the diff source was a PR, a branch, or a commit range, the branch has exactly one open PR against the reviewed base branch (`gh pr list --head <branch> --state open --json number,url,baseRefName,headRefOid`), and the reviewed SHA equals that PR's `headRefOid`. Uncommitted, staged-only, provided-diff, and file-list sources are never posted: the reviewed code is at no SHA GitHub has. When the reviewed SHA is a local commit the PR does not have, tell the user to push and skip posting. When the change is not a pull request, skip posting and say why.

For a pull request, post the triaged findings to it as one pull request review:
1. Identify the PR. Take owner, repo, and number from the PR's own URL (`gh pr view <url-or-number> --json url,baseRefName,headRefOid`), never from the checkout's remote. Check that the reviewed SHA is one of the PR's commits (`gh api --paginate repos/{owner}/{repo}/pulls/{number}/commits --jq '.[].sha'`). If it is not, post a review with only a body that holds every finding and says why nothing is anchored.
2. Check for an earlier post. Look for an existing review by the current user (`gh api user --jq .login`) on the same `commit_id` whose body starts with the heading `## bmad-code-review: PR #{number} at <full 40-character sha>` (`gh api --paginate repos/{owner}/{repo}/pulls/{number}/reviews`). If one exists, do not post again; report its URL instead. When this review follows an earlier round on another SHA, link that round's review in the body.
3. Select the findings. Post every `decision-needed`, `patch`, and `defer` finding as an inline comment. Do not post rejected findings inline, including a `decision-needed` finding the user resolved as reject; they go in the body (step 6). Add one inline comment per posted finding. Replace anything credential-like (tokens, keys, passwords, connection strings) in a finding with a placeholder and say so in the body.
4. Anchor each finding. Set `commit_id` to the reviewed SHA; if the PR head has moved since the review, say so in the body and anchor to the reviewed SHA anyway. Anchors must be valid in the diff GitHub shows for that SHA: run `git fetch origin`, then `git diff origin/<baseRefName>...<reviewed-sha>`; the PR's current files do not count. Use `side: "RIGHT"` for added or unchanged lines and `side: "LEFT"` (with `start_side` for a range) for removed lines, at the most specific line the finding names, using `start_line` for a range. Findings about a whole deleted file, and findings that cannot be anchored to a diff line, go in the body.
5. Format each comment as: `**[<bucket> · <severity>] <title>**`, then the problem and its evidence, including any acceptance criterion (AC) or constraint it violates, then `**Suggested fix:** <fix>`, then a status line: `Status: fixed in <sha>` when the fix is committed, `Status: fixed in working tree, not yet committed` otherwise, `Status: open action item`, `Status: deferred — <reason>`, or `Status: decided — <decision>`. The status is a snapshot of this run; a later round's review records what was pushed since.
6. Write the body. Start with the heading from step 2, then include the reviewed SHA, the story or spec reviewed (or "no story file"), the triage counts (decision-needed / patch / defer / rejected), the resulting story status (or "story status: n/a (no story file)"), the unanchored findings, the Rejected appendix in a collapsed `<details>` block, and the attribution line this session puts at the end of PR descriptions. With no inline comments to post (a clean review, or every finding rejected), post a review with only this body.
7. Post. Write the review as a JSON file (`body`, `event`, `commit_id`, `comments`) and send it with `gh api -X POST repos/{owner}/{repo}/pulls/{number}/reviews --input <file>`, with `event: "COMMENT"` (never APPROVE or REQUEST_CHANGES). On a 422 saying a comment could not be resolved, move the failing comments into the body and retry once.
8. Verify. Count the posted inline comments with `gh api --paginate --slurp repos/{owner}/{repo}/pulls/{number}/reviews/{id}/comments --jq 'map(length) | add'` and compare with what was sent. If they differ, list the missing comments, post them as a follow-up COMMENT review on the same `commit_id` whose body starts with `## bmad-code-review follow-up: PR #{number} at <sha>` and links the main review, and report it.
9. Give the user the review URL. If posting fails, say so and show the error; the findings already presented in chat and written to the story file remain the record."""
