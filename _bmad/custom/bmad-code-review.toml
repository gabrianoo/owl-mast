# Team override for bmad-code-review (owner-requested engineering rules, 2026-11-07). Lists append to the skill defaults.

[workflow]
persistent_facts = [
  """All Ubuntu CI jobs must pin an explicitly qualified fixed runner version (for Owl Mast, ubuntu-26.04); never use ubuntu-latest or another floating Ubuntu runner alias, including in matrices or reusable workflows. Verify runner availability and checks before claiming qualification.""",
  """Owl Mast Kubernetes/Helm packaging must support stable Gateway API routing as a first-class option, alongside optional Ingress compatibility. Validate parent Gateway/listener references, routes/backend services, prerequisites and fail-closed configuration; include render/negative tests and distinguish manifest support from controller/runtime qualification. Kubernetes Ingress API is frozen, not removed/deprecated; ingress-nginx controller retirement is a separate fact.""",
]

# Owner request 2026-11-09: PR reviews land as GitHub review comments, like bmad-review.
on_complete = """When the reviewed change is a GitHub pull request (passed as a PR, or a branch with an open PR — check with `gh pr view <branch>`), post the triaged findings to it as one pull request review:
1. Use `gh api -X POST repos/{owner}/{repo}/pulls/{number}/reviews` with `event: "COMMENT"` (never APPROVE or REQUEST_CHANGES) and `commit_id` set to the exact head SHA that was reviewed. If the PR head has moved since the review, say so and anchor to the reviewed SHA anyway.
2. Post every `decision-needed`, `patch` and `defer` finding. Do not post rejected findings. Add one inline comment per triaged entry, on the RIGHT side at the most specific changed line (use `start_line` for a range). Check each anchor against the file at the reviewed SHA so it lands on the line the finding names, and only use lines that appear in the PR diff.
3. Format each comment as: `**[<bucket> · <severity>] <title>**`, then the problem and its evidence (with any AC or constraint it violates), then `**Suggested fix:** <fix>`, then a status line: `Status: fixed in working tree (not yet pushed)`, `Status: open action item`, `Status: deferred — <reason>`, or `Status: decided — <decision>`. The status must reflect what happened in this run.
4. Put findings that cannot be anchored to a diff line in the review body. The body should also give the reviewed SHA, the story or spec reviewed, the triage counts (decision-needed / patch / defer / rejected), the resulting story status, and the PR-description attribution line.
5. After posting, check that the number of inline comments on the review matches what was sent, and give the user the review URL. If posting fails, say so and show the error; the findings already presented in chat and written to the story file stand."""
