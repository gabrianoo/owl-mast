;border-bottom:2px solid var(--accent)}.eyebrow,.muted,.basis{color:var(--muted)}.eyebrow{margin-bottom:6px}.intro{font-size:16px;color:var(--muted);margin-top:9px;max-width:72ch}.scope{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:8px;margin:20px 0 12px;background:var(--panel)}.scope span{color:var(--muted)}.basis{margin:8px 0 14px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.filters button{border-radius:999px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.panel{border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--panel);min-width:0}.panel-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.badge{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;background:var(--nested);padding:4px 9px;font-size:14px;max-width:100%;overflow-wrap:anywhere}.knowledge{color:var(--info,var(--owl-knowledge))}.attention{color:var(--warning,var(--owl-attention))}.good{color:var(--success,var(--owl-success))}.number{font-size:36px;line-height:1.2;letter-spacing:-.03em;font-weight:650;margin:14px 0 2px}.counts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}.counts dt,.fields dt{color:var(--muted);font-size:14px;margin-bottom:4px}.counts dd{font-size:20px;font-weight:600}.counts .unknown{font-size:16px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;margin:14px 0}.fields>div{min-width:0}.fields .full{grid-column:1/-1}.fields dd{font-size:14px;overflow-wrap:anywhere}.mono{font:14px/1.55 var(--font-mono,ui-monospace,monospace);overflow-wrap:anywhere}.agent{display:inline-flex;align-items:center;gap:7px;flex-wrap:wrap}.diamond{display:inline-block;width:9px;height:9px;border-radius:1px;transform:rotate(45deg);background:var(--owl-identity-iris);margin:0 3px}.diamond.snowy{background:var(--owl-identity-mulberry)}.smallgap{margin-top:8px}.gap{margin-top:20px}.note{padding:12px 14px;background:var(--nested);border-radius:8px;margin:14px 0}.note p+p{margin-top:6px}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:24px 0 12px}.bar-row{display:grid;grid-template-columns:110px minmax(0,1fr) 32px;gap:12px;align-items:center;margin:12px 0}.bar-track{height:10px;border-radius:3px;background:var(--nested)}.bar{height:10px;border-radius:3px;background:var(--accent)}details{margin-top:12px}summary{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600;cursor:pointer;list-style:none;padding:8px 0}summary::-webkit-details-marker{display:none}summary:before{content:'›';font-size:23px;line-height:1}details[open]>summary:before{transform:rotate(90deg)}.detail{padding-top:12px;border-top:1px solid var(--line)}.detail p+p{margin-top:8px}.links{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}.links a{display:inline-flex;align-items:center;min-height:44px}.event-list{margin:0;padding:0;list-style:none;display:grid;gap:12px}.event{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:16px}.event-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}.event-title{margin:8px 0 4px}.event-byline{color:var(--muted)}.event time{color:var(--muted)}.audit-controls{display:grid;grid-template-columns:minmax(160px,220px) minmax(0,1fr);gap:14px;margin-top:20px}.empty{padding:20px;border:1px dashed var(--outline);border-radius:12px;background:var(--panel)}.footer{margin-top:20px;color:var(--muted)}.event-summary{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:22px 0 12px}.coverage-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin:12px 0}.coverage-grid p{border-top:1px solid var(--line);padding-top:8px}[hidden]{display:none!important}@media(max-width:599px){h1{font-size:25px}.grid,.audit-controls,.fields,.coverage-grid{grid-template-columns:1fr}.fields .full{grid-column:auto}.panel{padding:16px}.nav{gap:14px}.workspace{text-align:left}.bar-row{grid-template-columns:78px minmax(0,1fr) 25px;gap:10px}.counts{gap:12px}.scope{display:block}.scope span{display:block;margin-top:4px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}@media(forced-colors:active){.diamond,.bar{background:CanvasText}.badge,.panel,.event{border-color:CanvasText}button[aria-pressed=true]{outline:2px solid Highlight}}</style></head><body><p class=\"study\"><strong>Illustrative fixtures.</strong> Counts and audit events below are synthetic. They are not attached to the real Notion or repository samples.</p><header class=\"topbar\"><div class=\"brand\"><span class=\"mark\"><svg aria-hidden=\"true\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M4 5l3 2 5-1 5 1 3-2-1 11-7 4-7-4z\"/>\n  <path d=\"M7 11h3m4 0h3m-6 3 1 1 1-1\"/>\n  <path d=\"M12 2v3m0 16v1\"/>\n</svg>\n</span>Owl Mast</div><div class=\"workspace\">AISQUAD<span>Syntelligence · example scope</span></div></header><nav class=\"nav\" aria-label=\"Contextual navigation\"><a href=\"knowledge.html\">Knowledge</a><a href=\"usage.html\">Usage &amp; cost</a><a href=\"knowledge-usage.html\" aria-current=\"page\">Knowledge statistics</a><a href=\"audit.html\" >Audit history</a></nav><main><p class=\"eyebrow\">Usage / Knowledge statistics</p><h1>Loaded is observable. Useful needs evidence.</h1><p class=\"intro\">See how often skills and memory reach agents, then inspect what is known about their use.</p><div class=\"scope\"><strong>Syntelligence · project knowledge</strong><span>5 Nov 2026 · 08:00–10:00 UTC</span></div><p class=\"basis\">Counted from records you can access. This fixture covers the selected project and period.</p><div class=\"filters\" role=\"group\" aria-label=\"Knowledge type\"><button type=\"button\" data-type=\"all\" aria-pressed=\"true\">Skills + memory</button><button type=\"button\" data-type=\"skill\" aria-pressed=\"false\">Skills</button><button type=\"button\" data-type=\"memory\" aria-pressed=\"false\">Memory</button></div><div class=\"grid\"><section class=\"panel\" data-kind=\"skill\" aria-labelledby=\"skill-heading\"><div class=\"panel-head\"><h2 id=\"skill-heading\">Skills</h2><span class=\"badge knowledge\">Observed loads</span></div><p class=\"number\">12</p><p class=\"muted\">Distinct successful skill-load events</p><dl class=\"counts\"><div><dt>Agent clients</dt><dd>3</dd></div><div><dt>Sessions</dt><dd>5</dd></div><div><dt>Invocations observed</dt><dd>7</dd></div><div><dt>Useful reuses verified</dt><dd>2</dd></div></dl><p class=\"smallgap muted\">Collection current for the connected fixture sources. Invocation and verified reuse have their own evidence.</p></section><section class=\"panel\" data-kind=\"memory\" aria-labelledby=\"memory-heading\"><div class=\"panel-head\"><h2 id=\"memory-heading\">Memory</h2><span class=\"badge attention\">Partial collection</span></div><p class=\"number\">8</p><p class=\"muted\">Distinct successful memory-load events</p><dl class=\"counts\"><div><dt>Agent clients</dt><dd>2</dd></div><div><dt>Sessions</dt><dd>4</dd></div><div><dt>Application in a task</dt><dd class=\"unknown\">Unavailable</dd></div><div><dt>Useful reuses verified</dt><dd class=\"unknown\">Unavailable</dd></div></dl><p class=\"smallgap muted\">Codex load collection is delayed. Task-use evidence is not collected in this example; eight is an observed subtotal.</p></section></div><section class=\"panel gap\" aria-labelledby=\"load-chart\"><h2 id=\"load-chart\">Observed loads by type</h2><p class=\"basis\">Counted from records you can access. Selected period · loads, not effectiveness.</p><div class=\"bar-row\" data-kind=\"skill\"><span>Skills</span><span class=\"bar-track\" aria-hidden=\"true\"><span class=\"bar\" style=\"display:block;width:100%\"></span></span><strong>12</strong></div><div class=\"bar-row\" data-kind=\"memory\"><span>Memory</span><span class=\"bar-track\" aria-hidden=\"true\"><span class=\"bar\" style=\"display:block;width:66.6667%\"></span></span><strong>8</strong></div><p class=\"muted\">Bar scale: 0–12 observed loads. Memory coverage is incomplete; no usage rate or impact ranking is inferred.</p></section><div class=\"section-head\"><h2 id=\"record-count\" role=\"status\" aria-live=\"polite\">2 example records</h2><span class=\"muted\">Exact versions · inspectable evidence</span></div><section class=\"panel\" data-kind=\"skill\" aria-labelledby=\"skill-record\"><div class=\"panel-head\"><span class=\"badge knowledge\">Skill</span><span class=\"mono\">DEMO-SK04 · v2</span></div><h2 id=\"skill-record\" class=\"smallgap\">Check acceptance evidence before closing work</h2><p class=\"smallgap\">12 loads · 7 observed invocations · 2 verified useful reuses</p><details><summary>Inspect a load and its later use</summary><div class=\"detail\"><dl class=\"fields\"><div><dt>Agent / client</dt><dd class=\"agent\"><span class=\"diamond\" aria-hidden=\"true\"></span>Tawny · Claude · demo-cl-17</dd></div><div><dt>Machine / sandbox</dt><dd>Builder laptop · demo-machine-1</dd></div><div><dt>Session / task</dt><dd class=\"mono\">demo-session-17 · SYN-42 review</dd></div><div><dt>Loaded at</dt><dd>09:11:04 UTC · successful read receipt</dd></div><div><dt>Load identity</dt><dd class=\"mono\">demo-load-041 · client-observer</dd></div><div><dt>Exact version</dt><dd class=\"mono\">DEMO-SK04 v2</dd></div><div><dt>Invocation evidence</dt><dd>09:12:10 · demo-invoke-014 · skill execution reported</dd></div><div><dt>Reuse verification</dt><dd>09:30 · permitted task artifact reviewed by the example maintainer</dd></div></dl><p>This is one selected evidence chain from the fixture totals. Loading alone does not establish invocation or useful reuse. The two later events are counted in their own categories.</p><p class=\"muted\">A repeated receipt for demo-load-041 is counted once. A separate successful load, including a reported cache-served load, can count separately when it has a distinct event identity.</p></div></details><div class=\"links\"><a href=\"audit.html\">Inspect audit history</a><a href=\"knowledge-detail.html\">See the version-detail layout</a></div></section><section class=\"panel gap\" data-kind=\"memory\" aria-labelledby=\"memory-record\"><div class=\"panel-head\"><span class=\"badge knowledge\">Memory</span><span class=\"mono\">DEMO-M07 · v1</span></div><h2 id=\"memory-record\" class=\"smallgap\">Keep skipped checks separate from passing checks</h2><p class=\"smallgap\">8 observed loads · task application unavailable · partial collection</p><details><summary>Inspect memory-load evidence</summary><div class=\"detail\"><dl class=\"fields\"><div><dt>Agent / client</dt><dd class=\"agent\"><span class=\"diamond snowy\" aria-hidden=\"true\"></span>Snowy · Codex · demo-cx-16</dd></div><div><dt>Machine / sandbox</dt><dd>Review node · demo-machine-2</dd></div><div><dt>Session</dt><dd class=\"mono\">demo-session-23</dd></div><div><dt>Loaded at</dt><dd>09:21:06 UTC · demo-load-055</dd></div><div><dt>Collection freshness</dt><dd>Last successful event collection: 09:24 UTC</dd></div><div><dt>Evidence of application</dt><dd>Unavailable · no task-use event or verification</dd></div></dl><p>The load receipt establishes that this version was read into the observed agent context. It does not establish that the model applied the lesson or that the task benefited.</p></div></details></section><details class=\"panel gap\"><summary>Counting rules, coverage and unavailable states</summary><div class=\"detail\"><p><strong>One load:</strong> a successful, uniquely identified agent read/load of an exact skill or memory version. Search results, human catalog views, attempted reads and source-page creation are not loads. Delivery and load evidence remain separate when the collector distinguishes them.</p><p><strong>Different counters:</strong> observed skill invocation or memory application needs a task event. Verified useful reuse also needs permitted task evidence and human verification. These are not inferred by subtracting or multiplying load counts.</p><p><strong>Incomplete and unsupported:</strong> partial sources show observed subtotals; unsupported counters show Unavailable. Zero is used only when a supported, fully observed selected window contains no matching events.</p><p><strong>Permissions:</strong> counts, agents, session IDs, machines and drill-down evidence use current source authorization. No hidden-recipient count or inaccessible residual is disclosed. Memory here means authorized project knowledge, not imported personal memories.</p><p><strong>Retention:</strong> query text, prompts and underlying protected content are not required by these counters; A-3 remains open. This mock does not establish client telemetry capability.</p></div></details></main><p class=\"footer\">Static UX reference · 5 November 2026 · No source, permission or agent action is performed.</p><script>const buttons=[...document.querySelectorAll('[data-type]')];buttons.forEach(b=>b.addEventListener('click',()=>{const kind=b.dataset.type;buttons.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelectorAll('[data-kind]').forEach(x=>{x.hidden=kind!=='all'&&x.dataset.kind!==kind;if(x.hidden)x.querySelectorAll('details').forEach(d=>d.open=false);});document.querySelector('#record-count').textContent=kind==='all'?'2 example records':'1 example record';}));<\/script></body></html>"},{"file":"audit.html","label":"System audit history","html":"<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Owl Mast — Audit history</title><style>:root{--owl-canvas:#F5F owl-identity-slate:#556579;color-scheme:light;}\n*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent}body{--ink:var(--foreground,var(--owl-text));--muted:var(--muted-foreground,var(--owl-secondary-text));--panel:var(--card,var(--owl-card));--nested:var(--secondary,var(--owl-secondary-surface));--line:var(--border,var(--owl-divider));--accent:var(--primary,var(--owl-primary));--outline:var(--ring,var(--owl-control-outline));color:var(--ink);font:14px/1.55 var(--font-sans,system-ui,sans-serif);font-variant-numeric:tabular-nums}h1,h2,h3,p,dl,dd{margin:0}h1{font-size:28px;line-height:1.2;letter-spacing:-.025em}h2{font-size:19px;line-height:1.4}h3{font-size:16px}p,dd,h1,h2,h3{overflow-wrap:anywhere}a{color:var(--accent);text-underline-offset:3px}a,button,select,input,summary{outline-offset:3px;touch-action:manipulation}a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--outline)}button,select,input{font:inherit;min-height:44px;max-width:100%;min-width:0;border:1px solid var(--outline);border-radius:8px;background:var(--panel);color:var(--ink);padding:9px 12px}input,select{font-size:16px;width:100%}button{cursor:pointer;font-weight:600}button[aria-pressed=true]{border:2px solid var(--accent);color:var(--accent);background:var(--nested)}button:hover{background:var(--nested)}label{display:block;font-weight:600;margin-bottom:6px}.study{color:var(--muted);margin:0 0 14px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:0 0 16px}.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700}.mark{display:grid;place-items:center;width:34px;height:34px;background:var(--nested);border:1px solid var(--line);border-radius:10px;color:var(--accent)}.mark svg{width:24px;height:24px}.workspace{text-align:right}.workspace span{display:block;color:var(--muted)}.nav{display:flex;flex-wrap:wrap;gap:16px;border-bottom:1px solid var(--line);margin-bottom:22px}.nav a,.nav span{display:inline-flex;align-items:center;min-height:48px}.nav [aria-current]{font-weight:600;border-bottom:2px solid var(--accent)}.eyebrow,.muted,.basis{color:var(--muted)}.eyebrow{margin-bottom:6px}.intro{font-size:16px;color:var(--muted);margin-top:9px;max-width:72ch}.scope{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:8px;margin:20px 0 12px;background:var(--panel)}.scope span{color:var(--muted)}.basis{margin:8px 0 14px}.panel{border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--panel);min-width:0}.badge{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;background:var(--nested);padding:4px 9px;font-size:14px;max-width:100%;overflow-wrap:anywhere}.fields dt{color:var(--muted);font-size:14px;margin-bottom:4px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;margin:14px 0}.fields>div{min-width:0}.fields .full{grid-column:1/-1}.fields dd{font-size:14px;overflow-wrap:anywhere}.mono{font:14px/1.55 var(--font-mono,ui-monospace,monospace);overflow-wrap:anywhere}.smallgap{margin-top:8px}.gap{margin-top:20px}details{margin-top:12px}summary{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600;cursor:pointer;list-style:none;padding:8px 0}summary::-webkit-details-marker{display:none}summary:before{content:'›';font-size:23px;line-height:1}details[open]>summary:before{transform:rotate(90deg)}.detail{padding-top:12px;border-top:1px solid var(--line)}.detail p+p{margin-top:8px}.event-list{margin:0;padding:0;list-style:none;display:grid;gap:12px}.event{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:16px}.event-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}.event-title{margin:8px 0 4px}.event-byline{color:var(--muted)}.event time{color:var(--muted)}.audit-controls{display:grid;grid-template-columns:minmax(160px,220px) minmax(0,1fr);gap:14px;margin-top:20px}.empty{padding:20px;border:1px dashed var(--outline);border-radius:12px;background:var(--panel)}.footer{margin-top:20px;color:var(--muted)}.event-summary{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:22px 0 12px}.coverage-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin:12px 0}.coverage-grid p{border-top:1px solid var(--line);padding-top:8px}[hidden]{display:none!important}@media(max-width:599px){h1{font-size:25px}.grid,.audit-controls,.fields,.coverage-grid{grid-template-columns:1fr}.fields .full{grid-column:auto}.panel{padding:16px}.nav{gap:14px}.workspace{text-align:left}.scope{display:block}.scope span{display:block;margin-top:4px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}@media(forced-colors:active){.diamond,.badge,.panel,.event{border-color:CanvasText}button[aria-pressed=true]{outline:2px solid Highlight}}</style></head><body><p class=\"study\"><strong>Illustrative fixtures.</strong> Counts and audit events below are synthetic. They are not attached to the real Notion or repository samples.</p><header class=\"topbar\"><div class=\"brand\"><span class=\"mark\"><svg aria-hidden=\"true\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n  <path d=\"M4 5l3 2 5-1 5 1 3-2-1 11-7 4-7-4z\"/>\n  <path d=\"M7 11h3m4 0h3m-6 3 1 1 1-1\"/>\n  <path d=\"M12 2v3m0 16v1\"/>\n</svg>\n</span>Owl Mast</div><div class=\"workspace\">AISQUAD<span>Syntelligence · example scope</span></div></header><nav class=\"nav\" aria-label=\"Contextual navigation\"><a href=\"knowledge.html\">Knowledge</a><a href=\"usage.html\">Usage &amp; cost</a><a href=\"knowledge-usage.html\" >Knowledge statistics</a><a href=\"audit.html\" aria-current=\"page\">Audit history</a></nav><main><p class=\"eyebrow\">Workspace / Audit history</p><h1>Follow what Owl Mast created and changed.</h1><p class=\"intro\">Knowledge, skills and system records, traced to each authorized object.</p><div class=\"scope\"><strong>Syntelligence · authorized audit view</strong><span>5 Nov 2026 · 08:00–10:00 UTC</span></div><p class=\"basis\">Counted from records you can access. Selected fixtures, not a complete system log.</p><div class=\"audit-controls\"><div><label for=\"audit-type\">Object type</label><select id=\"audit-type\"><option>All object types</option><option>Knowledge</option><option>Skill</option><option>Delivery</option><option>Connection</option><option>Policy</option><option>Observation</option><option>Notification</option></select></div><div><label for=\"audit-search\">Find in this visible sample</label><input id=\"audit-search\" type=\"search\" placeholder=\"Object, action, actor or ID\" autocomplete=\"off\"></div></div><div class=\"event-summary\"><h2 id=\"audit-count\" role=\"status\" aria-live=\"polite\" aria-atomic=\"true\">9 example events</h2><span class=\"muted\">Newest recorded event first</span></div><ol class=\"event-list\"><li class=\"event\" data-kind=\"Notification\"><div class=\"event-top\"><span class=\"badge\">Notification</span><time datetime=\"2026-11-05T09:42:03Z\">09:42:03 UTC</time></div><h2 class=\"event-title\">Notification record created</h2><p class=\"event-byline\">Notification service · Recorded</p><p class=\"smallgap\">Created a notification for a permitted observed work update.</p><details><summary>Inspect this event</summary><div class=\"detail\"><dl class=\"fields\"><div><dt>Event ID</dt><dd class=\"mono\">demo-audit-001</dd></div><div><dt>Object / version</dt><dd class=\"mono\">demo-notification-09</dd></div></dl><p>Object version: notification v1. Correlation: demo-work-update-18. Delivery to a device is not established by creating this record.</p></div></details></li><li class=\"event\" data-kind=\"Observation\"><div class=\"event-top\"><span class=\"badge\">Observation</span><time datetime=\"2026-11-05T09:40:00Z\">09:40:00 UTC</time></div><h2 class=\"event-title\">Work observation recorded</h2><p class=\"event-byline\">Source collector · Recorded</p><p class=\"smallgap\">Recorded a source-reported ticket status without changing the ticket.</p><details><summary>Inspect this event</summary><div class=\"detail\"><dl class=\"fields\"><div><dt>Event ID</dt><dd class=\"mono\">demo-audit-002</dd></div><div><dt>Object / version</dt><dd class=\"mono\">demo-observation-18</dd></div></dl><p>Source event occurred 09:39:48; recorded 09:40:00. Correlation: demo-jira-event-18. The source owns the ticket; Owl Mast created only its observation.</p></div></details></li><li class=\"event\" data-kind=\"Delivery\"><div class=\"event-top\"><span class=\"badge\">Delivery</span><time datetime=\"2026-11-05T09:35:02Z\">09:35:02 UTC</time></div><h2 class=\"event-title\">Knowledge delivery failed</h2><p class=\"event-byline\">Knowledge service · Failed</p><p class=\"smallgap\">A delivery attempt failed before a successful receipt was observed.</p><details><summary>Inspect this event</summary><div class=\"detail\"><dl class=\"fields\"><div><dt>Event ID</dt><dd class=\"mono\">demo-audit-003</dd></div><div><dt>Object / version</dt><dd class=\"mono\">demo-delivery-08</dd></div></dl><p>Attempt: demo-attempt-08. Recorded 09:35:02. Outcome: no successful delivery receipt. Retry, if observed, receives its own attempt identity; the failure does not create a load or reuse count.</p></div></details></li><li class=\"event\" data-kind=\"Policy\"><div class=\"event-top\"><span class=\"badge\">Policy</span><time datetime=\"2026-11-05T09:32:10Z\">09:32:10 UTC</time></div><h2 class=\"event-title\">Promotion policy version saved</h2><p class=\"event-byline\">Example project maintainer · Recorded</p><p class=\"smallgap\">Saved an authorized change to the project promotion policy.</p><details><summary>Inspect this event</summary><div class=\"detail\"><dl class=\"fields\"><div><dt>Event ID</dt><dd class=\"mono\">demo-audit-004</dd></div><div><dt>Object / version</dt><dd class=\"mono\">demo-policy-03</dd></div></dl><p>Authorized change: manual-approval mode → automatic mode. Policy v2 → v3. Reason: approved project policy change. Correlation: demo-admin-action-03. No publication is established.</p></div></details></li><li class=\"event\" data-kind=\"Connection\"><div class=\"event-top\"><span class=\"badge\">Connection</span><time datetime=\"2026-11-05T09:28:00Z\">09:28:00 UTC</time></div><h2 class=\"event-title\">Client location observation recorded</h2><p class=\"event-byline\">Enrollment observer · Recorded</p><p class=\"smallgap\">Recorded Builder laptop as the latest observed location for the enrolled client.</p><details><summary>Inspect this event</summary><div class=\"detail\"><dl class=\"fields\"><div><dt>Event ID</dt><dd class=\"mono\">demo-audit-005</dd></div><div><dt>Object / version</dt><dd class=\"mono\">demo-client-17</dd></div></dl><p>Client: demo-cl-17; machine: demo-machine-1. Observed 09:27:52; recorded 09:28:00. Earlier locations stay in history. No current execution or isolation is established.</p></div></details></li><li class=\"event\" data-kind=\"Skill\"><div class=\"event-top\"><span class=\"badge\">Skill</span><time datetime=\"2026-11-05T09:12:10Z\">09:12:10 UTC</time></div><h2 class=\"event-title\">Skill invocation observed</h2><p class=\"event-byline\">Tawny · Claude · demo-cl-17 · Recorded</p><p class=\"smallgap\">Recorded a reported invocation after the skill-load receipt.</p><details><summary>Inspect this event</summary><div class=\"detail\"><dl class=\"fields\"><div><dt>Event ID</dt><dd class=\"mono\">demo-audit-006</dd></div><div><dt>Object / version</dt><dd class=\"mono\">DEMO-SK04 v2</dd></div></dl><p>Session: demo-session-17. Machine: Builder laptop. Invocation: demo-invoke-014. Linked load: demo-load-041. Correlation: demo-task-42. Neither invocation nor loading alone establishes useful reuse.</p></div></details></li><li class=\"event\" data-kind=\"Skill\"><div class=\"event-top\"><span class=\"badge\">Skill</span><time datetime=\"2026-11-05T09:11:04Z\">09:11:04 UTC</time></div><h2 class=\"event-title\">Skill load receipt created</h2><p class=\"event-byline\">Client observer · Recorded</p><p class=\"smallgap\">Recorded a successful load into the authorized agent context.</p><details><summary>Inspect this event</summary><div class=\"detail\"><dl class=\"fields\"><div><dt>Event ID</dt><dd class=\"mono\">demo-audit-007</dd></div><div><dt>Object / version</dt><dd class=\"mono\">DEMO-SK04 v2</dd></div></dl><p>Receipt: demo-load-041. Agent: Tawny / demo-cl-17. Session: demo-session-17. Machine: Builder laptop. Duplicate transport receipt for the same load identity is not a second load.</p></div></details></li><li class=\"event\" data-kind=\"Knowledge\"><div class=\"event-top\"><span class=\"badge\">Knowledge</span><time datetime=\"2026-11-05T09:05:00Z\">09:05:00 UTC</time></div><h2 class=\"event-title\">Knowledge version created</h2><p class=\"event-byline\">Knowledge capture service · Recorded</p><p class=\"smallgap\">Created a new project version from an authorized source record.</p><details><summary>Inspect this event</summary><div class=\"detail\"><dl class=\"fields\"><div><dt>Event ID</dt><dd class=\"mono\">demo-audit-008</dd></div><div><dt>Object / version</dt><dd class=\"mono\">DEMO-K12 v2</dd></div></dl><p>Authorized version difference: “A passing check proves validation” → “Confirm which tests ran before treating a check as validation.” New version v2 references v1; the earlier event is not silently rewritten. Correlation: demo-capture-12. Source body is not duplicated into this audit.</p></div></details></li><li class=\"event\" data-kind=\"Knowledge\"><div class=\"event-top\"><span class=\"badge\">Knowledge</span><time datetime=\"2026-11-05T08:40:00Z\">08:40:00 UTC</time></div><h2 class=\"event-title\">Lifecycle event · content unavailable</h2><p class=\"event-byline\">Knowledge lifecycle service · Recorded</p><p class=\"smallgap\">A withdrawal event is visible to this example audit reader; the former content is unavailable.</p><details><summary>Inspect this event</summary><div class=\"detail\"><dl class=\"fields\"><div><dt>Event ID</dt><dd class=\"mono\">demo-audit-010</dd></div><div><dt>Object / version</dt><dd class=\"mono\">Audit reference demo-W04</dd></div></dl><p>Occurred 08:39:50; recorded 08:40:00. The former title, body, source identity and reason are omitted because current access does not permit them. Audit access does not restore withdrawn or revoked content.</p></div></details></li></ol><section class=\"empty\" id=\"audit-empty\" hidden><h2>No matching events in this sample</h2><p>Clear the filters to return to this permitted fixture history.</p><button id=\"audit-reset\" type=\"button\" class=\"smallgap\">Clear filters</button></section><details class=\"panel gap\"><summary>Coverage: the full system is the target</summary><div class=\"detail\"><p>The requested audit scope covers every record Owl Mast creates, including later changes and outcomes. Knowledge and skills may be an initial implementation slice only if sequencing requires it; that does not reduce the target.</p><div class=\"coverage-grid\"><p>Knowledge and skill versions; evaluations</p><p>Publications and lifecycle changes</p><p>Load, delivery and reuse evidence</p><p>Work observations and relationship mappings</p><p>Generated summaries and derived records</p><p>Connections, policies and permitted alias changes</p><p>Notification records and delivery outcomes</p><p>Failed attempts, corrections and collection gaps</p></div><p>Each object type needs creation/change/outcome events, source and actor, version, correlation and timestamps. The selected fixtures do not establish implementation coverage.</p></div></details><details class=\"panel gap\"><summary>Audit integrity and access</summary><div class=\"detail\"><p><strong>Correct through a later event.</strong> A correction references the earlier event and explains what changed. Earlier history is not silently rewritten in the user view; retention, storage and tamper-evidence guarantees remain architecture decisions.</p><p><strong>Successful records and failed attempts differ.</strong> An attempted publication or delivery is not a successful creation. Delayed or unsupported audit collection shows coverage gaps, not “No activity”.</p><p><strong>History keeps permission boundaries.</strong> Titles, actors, diffs, reasons, recipient details and source links require their own current authorization. A reader with no access receives a neutral unavailable state, without a hidden-record count.</p><p><strong>No secrets or automatic raw-content retention.</strong> Exact versions and permitted changes can be inspected without storing credentials, prompts or the complete source body in the audit stream. Content-retention defaults remain open under A-3.</p></div></details></main><p class=\"footer\">Static UX reference · 5 November 2026 · No source, permission or agent action is performed.</p><script>const kind=document.querySelector('#audit-type'),query=document.querySelector('#audit-search'),rows=[...document.querySelectorAll('.event')];function apply(){const term=query.value.trim().toLocaleLowerCase();let n=0;rows.forEach(row=>{const show=(kind.value==='All object types'||row.dataset.kind===kind.value)&&(!term||row.textContent.toLocaleLowerCase().includes(term));row.hidden=!show;if(!show)row.querySelector('details').open=false;n+=show?1:0;});document.querySelector('#audit-count').textContent=n+' example '+(n===1?'event':'events');document.querySelector('#audit-empty').hidden=n!==0;}kind.addEventListener('change',apply);query.addEventListener('input',apply);document.querySelector('#audit-reset').addEventListener('click',()=>{kind.value='All object types';query.value='';apply();query.focus();});<\/script></body></html>"},{"file":"dependencies.html","label":"Ticket and PR dependencies","html":"<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Owl Mast — Dependencies</title><style>:root{--owl-card:#FFFFFF;--owl-secondary-surface:#EAF0F8;--owl-text:#172337;--owl-secondary-text:#52627A;--owl-divider:#D7E0EC;--owl-control-outline:#74849B;--owl-primary:#2456D6;--owl-knowledge:#086A7B;--owl-attention:#845900;color-scheme:light;}\n@media(prefers-color-scheme:dark){:root{--owl-card:#121A27;--owl-secondary-surface:#1B2738;--owl-text:#EAF1FA;--owl-secondary-text:#A5B5CB;--owl-divider:#2E3C50;--owl-control-outline:#73869E;--owl-primary:#91B5FF;--owl-knowledge:#70D7E7;--owl-attention:#F0C268;color-scheme:dark;}}\nhtml[data-owl-theme=\"dark\"]{--owl-card:#121A27;--owl-secondary-surface:#1B2738;--owl-text:#EAF1FA;--owl-secondary-text:#A5B5CB;--owl-divider:#2E3C50;--owl-control-outline:#73869E;--owl-primary:#91B5FF;--owl-knowledge:#70D7E7;--owl-attention:#F0C268;color-scheme:dark;}\nhtml[data-owl-theme=\"light\"]{--owl-card:#FFFFFF;--owl-secondary-surface:#EAF0F8;--owl-text:#172337;--owl-secondary-text:#52627A;--owl-divider:#D7E0EC;--owl-control-outline:#74849B;--owl-primary:#2456D6;--owl-knowledge:#086A7B;--owl-attention:#845900;color-scheme:light;}\nbutton,select{max-width:100%}@media(forced-colors:active){[aria-current],[aria-pressed=\"true\"]{outline:2px solid Highlight}}\n\n*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent}body{font:14px/1.55 var(--font-sans,system-ui,sans-serif);color:var(--foreground,var(--owl-text))}h1,h2,h3,p,dl,dd{margin:0}p,dd,h1,h2,h3{overflow-wrap:anywhere}svg{display:block}button,select{font:inherit;touch-action:manipulation}button,select,a,summary{outline-offset:3px}button:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--ring,var(--owl-control-outline))}button,select{min-height:44px;min-width:44px;border:1px solid var(--owl-control-outline);border-radius:8px;padding:9px 12px;background:var(--card,var(--owl-card));color:var(--foreground,var(--owl-text))}button{cursor:pointer;font-weight:600}button[aria-pressed=true]{border-color:var(--primary,var(--owl-primary));box-shadow:inset 0 -2px var(--primary,var(--owl-primary));background:var(--secondary,var(--owl-secondary-surface));color:var(--primary,var(--owl-primary))}select{font-size:16px;width:100%}label{display:block;font-weight:600;margin-bottom:5px}a{color:var(--primary,var(--owl-primary));text-underline-offset:3px}.link{min-height:44px;display:inline-flex;align-items:center;padding:8px 0}.muted,.basis{color:var(--muted-foreground,var(--owl-secondary-text))}.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-bottom:15px;border-bottom:1px solid var(--border,var(--owl-divider))}.brand{display:flex;gap:9px;align-items:center;font-size:17px;font-weight:700}.brand svg{width:32px;height:32px;fill:none;stroke:var(--primary,var(--owl-primary));stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.workspace{text-align:right}.workspace span{display:block;color:var(--muted-foreground,var(--owl-secondary-text))}main{margin-top:22px}.eyebrow{color:var(--muted-foreground,var(--owl-secondary-text));margin-bottom:6px}h1{font-size:28px;line-height:1.2;letter-spacing:-.025em}h2{font-size:19px;line-height:1.4}h3{font-size:16px;line-height:1.4}.intro{font-size:16px;margin-top:8px;max-width:70ch;color:var(--muted-foreground,var(--owl-secondary-text))}.note{padding:12px 14px;margin-top:16px;background:var(--secondary,var(--owl-secondary-surface));border-radius:8px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.view-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.basis{margin:12px 0}.diagram{border:1px solid var(--border,var(--owl-divider));border-radius:12px;background:var(--card,var(--owl-card));padding:14px;overflow:hidden}.canvas{width:100%;overflow:auto;overscroll-behavior:contain}.canvas>svg{width:100%;min-width:660px;height:auto;max-height:none}.node rect{fill:var(--secondary,var(--owl-secondary-surface));stroke:var(--owl-control-outline);stroke-width:1.3}.node.selected rect{stroke:var(--primary,var(--owl-primary));stroke-width:3}.node text{fill:var(--foreground,var(--owl-text));font-size:15px;font-family:var(--font-sans,system-ui)}.node .label{font-weight:650;font-size:16px}.edge{fill:none;stroke:var(--primary,var(--owl-primary));stroke-width:2}.edge.possible{stroke-dasharray:7 5}.edge.contribution{stroke:var(--info,var(--owl-knowledge))}.edge-label{fill:var(--muted-foreground,var(--owl-secondary-text));font:14px var(--font-sans,system-ui)}.arrow{fill:var(--primary,var(--owl-primary))}.arrow.contribution{fill:var(--info,var(--owl-knowledge))}.legend{display:flex;gap:12px 20px;flex-wrap:wrap;margin-top:12px;color:var(--muted-foreground,var(--owl-secondary-text));font-size:14px}.legend span{display:flex;gap:8px;align-items:center}.legend svg{width:38px;height:12px;flex:0 0 38px}.legend line{stroke:var(--primary,var(--owl-primary));stroke-width:2}.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:24px 0 12px}.node-picker{display:flex;gap:8px;flex-wrap:wrap}.node-picker button{font-family:var(--font-mono,ui-monospace,monospace);font-size:14px}.panel{border:1px solid var(--border,var(--owl-divider));border-radius:12px;padding:16px;background:var(--card,var(--owl-card));margin-top:14px}.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--border,var(--owl-divider));border-radius:999px;background:var(--secondary,var(--owl-secondary-surface));font-size:14px}.panel-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.panel h3{margin-top:10px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;margin-top:14px}.fields>div{min-width:0}dt{color:var(--muted-foreground,var(--owl-secondary-text));font-size:14px}dd{margin-top:3px;font-size:14px}.relation-list{display:grid;gap:12px}.relation{padding:14px 16px;border:1px solid var(--border,var(--owl-divider));border-radius:10px;background:var(--card,var(--owl-card))}.relation p{margin-top:5px}.relation details{margin-top:8px}.relation h3{font-size:16px}.possible-label{color:var(--warning,var(--owl-attention))}summary{min-height:44px;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;list-style:none}summary::-webkit-details-marker{display:none}summary::before{content:'›';font-size:22px;line-height:1}details[open]>summary::before{transform:rotate(90deg)}details p+p{margin-top:8px}.alternates{margin-top:20px;padding-top:12px;border-top:1px solid var(--border,var(--owl-divider))}.alternate{padding:12px 14px;background:var(--secondary,var(--owl-secondary-surface));border-radius:8px;margin-top:10px}.alternate p{margin-top:5px}.footer{margin-top:18px;color:var(--muted-foreground,var(--owl-secondary-text))}[hidden]{display:none!important}@media(max-width:599px){h1{font-size:25px}.topbar{align-items:flex-start;flex-wrap:wrap}.workspace{text-align:left}.controls,.fields{grid-template-columns:1fr}.diagram{padding:12px}.legend{gap:10px}.panel-head{align-items:flex-start}.relation{padding:14px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}@media(forced-colors:active){.node rect,.edge,.legend line{stroke:CanvasText}.node.selected rect{stroke:Highlight}.node text,.edge-label{fill:CanvasText}.arrow{fill:CanvasText}}\n</style></head><body><header class=\"topbar\"><div class=\"brand\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 5l3 2 5-1 5 1 3-2-1 11-7 4-7-4z\"/><path d=\"M7 11h3m4 0h3m-6 3 1 1 1-1\"/><path d=\"M12 2v3m0 16v1\"/></svg><span>Owl Mast</span></div><div class=\"workspace\"><strong>AISQUAD</strong><span>Syntelligence · Jira + GitHub</span></div></header><main><p class=\"eyebrow\">Work evidence / Dependencies</p><h1>See the relationships behind the work.</h1><p class=\"intro\">Follow prerequisites, inspect a possible dependency, and trace pull requests without turning every connection into a blocker.</p><p class=\"note\"><strong>Illustrative records.</strong> The graph, source links and times are fixtures. No source relationship is changed. Example snapshot: 5 Nov 2026, 08:45 Europe/Warsaw.</p><div class=\"controls\"><div><label for=\"relation-filter\">Relationships to show</label><select id=\"relation-filter\"><option value=\"all\">All relationship types</option><option value=\"dependency\">Confirmed prerequisites</option><option value=\"possible\">Possible dependencies</option><option value=\"contribution\">PR contributions</option></select></div><div><label for=\"focus-node\">Inspect a record</label><select id=\"focus-node\"><option value=\"syn42\">Jira SYN-42</option><option value=\"syn40\">Jira SYN-40</option><option value=\"syn48\">Jira SYN-48</option><option value=\"pr118\">GitHub PR #118</option></select></div></div><div class=\"view-controls\" role=\"group\" aria-label=\"Relationship view\"><button id=\"show-graph\" type=\"button\" aria-pressed=\"true\" aria-controls=\"graph-region\">Graph</button><button id=\"show-list\" type=\"button\" aria-pressed=\"false\" aria-controls=\"relationship-region\">List</button></div><p class=\"basis\" id=\"relationship-count\" role=\"status\" aria-live=\"polite\">3 relationships shown · counted from records you can access.</p><section class=\"diagram\" id=\"graph-region\" aria-label=\"Dependency graph\"><div class=\"canvas\" tabindex=\"0\" aria-label=\"Relationship diagram; scroll horizontally if needed. The equivalent relationship list follows.\"><svg viewBox=\"0 0 760 350\" role=\"img\" aria-labelledby=\"graph-title graph-desc\"><title id=\"graph-title\">Dependencies and contributions for Syntelligence Jira SYN-42</title><desc id=\"graph-desc\">SYN-40 is a confirmed prerequisite for SYN-42. SYN-48 is a possible dependency for SYN-42. GitHub PR 118 contributes to SYN-42. Arrow direction points from prerequisite or contribution to the ticket.</desc><defs><marker id=\"dep-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path class=\"arrow\" d=\"M0 0 10 5 0 10z\"/></marker><marker id=\"pr-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path class=\"arrow contribution\" d=\"M0 0 10 5 0 10z\"/></marker></defs><g data-relation=\"dependency\"><path class=\"edge\" d=\"M278 65 C360 65 345 150 448 164\" marker-end=\"url(#dep-arrow)\"/><text class=\"edge-label\" x=\"319\" y=\"70\">prerequisite</text></g><g data-relation=\"possible\"><path class=\"edge possible\" d=\"M278 175 H448\" marker-end=\"url(#dep-arrow)\"/><text class=\"edge-label\" x=\"312\" y=\"163\">possible</text></g><g data-relation=\"contribution\"><path class=\"edge contribution\" d=\"M278 285 C360 285 345 220 448 202\" marker-end=\"url(#pr-arrow)\"/><text class=\"edge-label\" x=\"316\" y=\"284\">contributes</text></g><g class=\"node\" data-node=\"syn40\"><rect x=\"18\" y=\"24\" width=\"260\" height=\"82\" rx=\"10\"/><text class=\"label\" x=\"36\" y=\"51\">Jira · SYN-40</text><text x=\"36\" y=\"76\">Account-scope contract</text><text x=\"36\" y=\"96\">Tracker: Closed</text></g><g class=\"node\" data-node=\"syn48\"><rect x=\"18\" y=\"134\" width=\"260\" height=\"82\" rx=\"10\"/><text class=\"label\" x=\"36\" y=\"161\">Jira · SYN-48</text><text x=\"36\" y=\"186\">Audit scope mapping</text><text x=\"36\" y=\"206\">Tracker: In progress</text></g><g class=\"node\" data-node=\"pr118\"><rect x=\"18\" y=\"244\" width=\"260\" height=\"82\" rx=\"10\"/><text class=\"label\" x=\"36\" y=\"271\">GitHub · PR #118</text><text x=\"36\" y=\"296\">Account-scope implementation</text><text x=\"36\" y=\"316\">PR state: Merged</text></g><g class=\"node selected\" data-node=\"syn42\"><rect x=\"450\" y=\"128\" width=\"292\" height=\"104\" rx=\"10\"/><text class=\"label\" x=\"468\" y=\"156\">Jira · SYN-42</text><text x=\"468\" y=\"181\">Define account rollout rules</text><text x=\"468\" y=\"205\">Tracker: In progress</text><text x=\"468\" y=\"224\">Acceptance: Not recorded</text></g></svg></div><div class=\"legend\"><span><svg aria-hidden=\"true\"><line x1=\"0\" y1=\"6\" x2=\"38\" y2=\"6\"/></svg>Solid: source-confirmed relationship</span><span><svg aria-hidden=\"true\"><line x1=\"0\" y1=\"6\" x2=\"38\" y2=\"6\" stroke-dasharray=\"5 4\"/></svg>Dashed: inferred, not a blocker</span></div></section><div class=\"section-head\"><h2>Inspect a record</h2><span class=\"muted\">Same records in graph and list</span></div><div class=\"node-picker\" role=\"group\" aria-label=\"Select record\"><button type=\"button\" data-select-node=\"syn42\" aria-pressed=\"true\">SYN-42</button><button type=\"button\" data-select-node=\"syn40\" aria-pressed=\"false\">SYN-40</button><button type=\"button\" data-select-node=\"syn48\" aria-pressed=\"false\">SYN-48</button><button type=\"button\" data-select-node=\"pr118\" aria-pressed=\"false\">PR #118</button></div><section class=\"panel\" aria-labelledby=\"selected-title\"><div class=\"panel-head\"><span class=\"chip\" id=\"selected-source\">Syntelligence Jira</span><span class=\"chip\" id=\"selected-key\">SYN-42</span></div><h3 id=\"selected-title\">Define account rollout rules</h3><dl class=\"fields\"><div><dt>Source state</dt><dd id=\"selected-state\">In progress</dd></div><div><dt>Acceptance</dt><dd id=\"selected-acceptance\">Not recorded</dd></div><div><dt>Source event</dt><dd id=\"selected-time\">08:29 · Europe/Warsaw</dd></div><div><dt>Collected</dt><dd>08:42 · Europe/Warsaw</dd></div></dl><p class=\"basis\" id=\"selected-description\">One explicit prerequisite, one possible dependency and one contribution in this permitted example.</p><a class=\"link\" href=\"work-detail.html\">See the full work-detail pattern · separate example</a></section><section id=\"relationship-region\" aria-labelledby=\"relationships-title\"><div class=\"section-head\"><h2 id=\"relationships-title\">Relationship evidence</h2><span class=\"muted\">Arrow → dependent ticket</span></div><div class=\"relation-list\"><article class=\"relation\" data-relation-card=\"dependency\"><h3>SYN-40 → SYN-42 · prerequisite for</h3><p>Confirmed relationship · Syntelligence Jira issue link.</p><details><summary>Inspect source evidence</summary><p>Example link E-01 explicitly records SYN-40 as a prerequisite for SYN-42. Source event 08:20; collected 08:42.</p><p class=\"muted\">SYN-40's tracker closure does not establish its acceptance. The relationship is known; whether the prerequisite is satisfied still needs evidence.</p></details></article><article class=\"relation\" data-relation-card=\"possible\"><h3>SYN-48 → SYN-42 · possible dependency</h3><p class=\"possible-label\">Inferred relationship · not an established blocker.</p><details><summary>Inspect inference basis</summary><p>Example E-02 infers a relationship from a shared audit-contract reference. Inference recorded 08:40; collected 08:42.</p><p class=\"muted\">No explicit prerequisite link is recorded. Keep the inference separate until a permitted source supplies confirmation.</p></details></article><article class=\"relation\" data-relation-card=\"contribution\"><h3>PR #118 → SYN-42 · contributes to</h3><p>Confirmed mapping · GitHub contribution evidence.</p><details><summary>Inspect mapping evidence</summary><p>Example E-03 combines an explicit work reference in run R-21 with the permitted PR association. Source event 08:34; collected 08:42. A title match alone would not confirm this relationship.</p><p class=\"muted\">Merged is a PR state. It does not mean the ticket is accepted or that this PR is a prerequisite.</p></details></article></div></section><details class=\"alternates\"><summary>Alternate states and access boundaries</summary><div class=\"alternate\"><h3>Dependency cycle found · separate fixture</h3><p>A → B → A is shown as a cycle with its permitted source edges. Do not invent a topological order or a “next runnable” ticket.</p></div><div class=\"alternate\"><h3>No matching relationships</h3><p>The authorized query completed, but has no matching edges. This differs from “Relationship collection unavailable,” which must show its last known collection time.</p></div><div class=\"alternate\"><h3>This record is unavailable</h3><p>When access cannot be verified, remove protected nodes, links and derived summaries. Do not draw a hidden-node placeholder, reveal missing-node counts, or imply a complete graph from the remaining records.</p></div></details><p class=\"footer\">The graph is a read-only view of permitted relationships. Storage technology, including whether to use a graph database, is an architecture decision.</p></main><script>const nodeData={\"syn42\":{\"source\":\"Syntelligence Jira\",\"key\":\"SYN-42\",\"title\":\"Define account rollout rules\",\"state\":\"In progress\",\"acceptance\":\"Not recorded\",\"time\":\"08:29\",\"description\":\"One explicit prerequisite, one possible dependency and one contribution in this permitted example.\"},\"syn40\":{\"source\":\"Syntelligence Jira\",\"key\":\"SYN-40\",\"title\":\"Account-scope contract\",\"state\":\"Closed\",\"acceptance\":\"Not recorded\",\"time\":\"08:20\",\"description\":\"Explicit prerequisite for SYN-42. Tracker closure does not prove that the prerequisite acceptance condition was met.\"},\"syn48\":{\"source\":\"Syntelligence Jira\",\"key\":\"SYN-48\",\"title\":\"Audit scope mapping\",\"state\":\"In progress\",\"acceptance\":\"Unknown\",\"time\":\"08:35\",\"description\":\"A shared contract reference suggests a possible dependency. It is not an established blocker.\"},\"pr118\":{\"source\":\"Syntelligence GitHub\",\"key\":\"PR #118\",\"title\":\"Account-scope implementation\",\"state\":\"Merged\",\"acceptance\":\"Not a PR-state property\",\"time\":\"08:34\",\"description\":\"A source-supported contribution to SYN-42. The mapping does not make this PR a prerequisite or establish ticket acceptance.\"}};\n(()=>{'use strict';const focus=document.querySelector('#focus-node'),filter=document.querySelector('#relation-filter'),graph=document.querySelector('#graph-region'),graphButton=document.querySelector('#show-graph'),listButton=document.querySelector('#show-list');\nfunction selectNode(key){const n=nodeData[key];focus.value=key;document.querySelectorAll('[data-select-node]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.selectNode===key)));document.querySelectorAll('.node').forEach(g=>g.classList.toggle('selected',g.dataset.node===key));for(const field of ['source','key','title','state','acceptance','description'])document.querySelector('#selected-'+field).textContent=n[field];document.querySelector('#selected-time').textContent=n.time+' · Europe/Warsaw';}\nfunction filterRelations(){let count=0;document.querySelectorAll('[data-relation-card]').forEach(c=>{const show=filter.value==='all'||c.dataset.relationCard===filter.value;c.hidden=!show;if(show)count++;});document.querySelectorAll('[data-relation]').forEach(g=>{g.style.display=filter.value==='all'||g.dataset.relation===filter.value?'':'none';});document.querySelector('#relationship-count').textContent=count+' '+(count===1?'relationship':'relationships')+' shown · counted from records you can access.';const descriptions={all:'SYN-40 is a confirmed prerequisite for SYN-42. SYN-48 is a possible dependency. PR 118 contributes to SYN-42.',dependency:'SYN-40 is a confirmed prerequisite for SYN-42.',possible:'SYN-48 is a possible dependency for SYN-42; it is not an established blocker.',contribution:'GitHub PR 118 contributes to SYN-42. A contribution is not a prerequisite.'};document.querySelector('#graph-desc').textContent=descriptions[filter.value]+' The equivalent relationship list follows the diagram.';}\nfunction setView(showGraph){graph.hidden=!showGraph;graphButton.setAttribute('aria-pressed',String(showGraph));listButton.setAttribute('aria-pressed',String(!showGraph));}\nfocus.addEventListener('change',()=>selectNode(focus.value));filter.addEventListener('change',filterRelations);document.querySelectorAll('[data-select-node]').forEach(b=>b.addEventListener('click',()=>selectNode(b.dataset.selectNode)));graphButton.addEventListener('click',()=>setView(true));listButton.addEventListener('click',()=>setView(false));setView(!matchMedia('(max-width:599px)').matches);filterRelations();})();<\/script></body></html>"}];
const picker=document.getElementById('screen'),frame=document.getElementById('view'),standalone=document.getElementById('standalone');let resize;
const hostNames=['background','foreground','muted-foreground','card','secondary','secondary-foreground','border','ring','primary','primary-foreground','accent','destructive','warning','success','info','radius','font-sans','font-mono'];
function show(){const item=screens[Number(picker.value)];frame.title=item.label+' visual reference';standalone.href=item.file;const computed=getComputedStyle(document.documentElement);const inherited=hostNames.map(n=>[n,computed.getPropertyValue('--'+n).trim()]).filter(x=>x[1]);const rootStyle=inherited.map(([n,v])=>'--'+n+':'+v+';').join('');const fg=getComputedStyle(document.body).color;const nums=fg.match(/[\d.]+/g)||[];const theme=nums.length>=3?(Number(nums[0])+Number(nums[1])+Number(nums[2])>420?'dark':'light'):(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');frame.srcdoc=item.html.replace('<html lang="en">','<html lang="en" data-owl-theme="'+theme+'">').replace('</head>','<style>:root{'+rootStyle+'}</style></head>');}
frame.addEventListener('load',()=>{if(resize)resize.disconnect();const doc=frame.contentDocument;if(!doc)return;let queued=false;function fit(){if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;frame.style.height=Math.ceil(Math.max(doc.body.scrollHeight,doc.body.getBoundingClientRect().height)+16)+'px';});}resize=new ResizeObserver(fit);resize.observe(doc.body);doc.addEventListener('toggle',fit,true);fit();});picker.addEventListener('change',show);show();
</script></body></html>
