t scope</label><select id=\"project-scope\"><option value=\"all\">All authorized projects</option><option value=\"syntelligence\">Syntelligence · Jira + GitHub</option><option value=\"movesion\">Movesion · Jira + Bitbucket</option></select></div><div class=\"view-switch\" role=\"group\" aria-label=\"Focus layout\"><button type=\"button\" data-view=\"epic\" aria-pressed=\"true\">By epic</button><button type=\"button\" data-view=\"together\" aria-pressed=\"false\">Combined</button></div></div>\n    <p class=\"aggregate-basis\">Counted from records you can access</p><div class=\"refresh-row\"><span>Observed snapshots, with per-source freshness</span><button type=\"button\" class=\"refresh-control\" id=\"refresh-focus\">Refresh snapshot</button></div><div class=\"scope-summary\"><span id=\"ticket-count\"><strong>5 assigned tickets</strong> across 3 epics</span><span id=\"run-count\">4 distinct linked agent runs</span></div>\n    <div id=\"focus-content\"></div>\n    <section class=\"unlinked\" id=\"unlinked\" aria-labelledby=\"unlinked-title\"><div class=\"unlinked-heading\"><h2 id=\"unlinked-title\">Not linked to an epic</h2><span class=\"meta\">1 run</span></div><div class=\"tag-line\"><span class=\"agent-chip\"><span class=\"agent-dot\" aria-hidden=\"true\"></span><span class=\"type\">Codex</span><span class=\"alias\">CX-12</span></span><span>Syntelligence · Initiated by Ahmed</span></div><details class=\"run-row\" id=\"run-syn-cx12\"><summary><span class=\"run-name\">Epic link unknown</span><svg class=\"chevron\" aria-hidden=\"true\" viewBox=\"0 0 24 24\"><path d=\"m9 6 6 6-6 6\"/></svg></summary><div class=\"run-evidence\"><p><span class=\"run-id\">Client CX-12 · Observed run R-12 · Fixed type: Codex.</span> Ahmed is the confirmed initiating person in the session record. The Jira ticket and epic links have not been established; this run remains outside the epic totals.</p><p>Syntelligence client observation · 08:39. No ownership or linkage is inferred from a connection, commit author, or shared credential.</p></div></details></section>\n    <details class=\"mapping-state\"><summary>When a source identity is unconfirmed <span aria-hidden=\"true\">+</span></summary><div class=\"review-state\"><strong>Your identity in this source is not confirmed.</strong><p>Assigned work may be missing. An administrator can confirm the source identity mapping; a display-name match is insufficient.</p></div></details><footer class=\"footer\"><span>Snapshots · Syntelligence 08:42; Movesion Jira 07:55 · Europe/Warsaw</span><span>Read-only work observation</span></footer>\n  </main>\n</div>\n<p class=\"sr-only\" role=\"status\" aria-live=\"polite\" id=\"announcement\"></p>\n<script>\n  const chevron = '<svg class=\"chevron\" aria-hidden=\"true\" viewBox=\"0 0 24 24\"><path d=\"m9 6 6 6-6 6\"/></svg>';\n  const arrow = '<svg aria-hidden=\"true\" viewBox=\"0 0 24 24\"><path d=\"M7 17 17 7M7 7h10v10\"/></svg>';\n  const statusIcon = '<svg aria-hidden=\"true\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v6m0 4v.1\"/></svg>';\n\n    function agentChip(alias,provider,color='--identity-slate') {\n      const glyph=provider==='Claude'?'<svg class=\"type-glyph\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1M5.6 18.4l2.1-2.1m8.6-8.6 2.1-2.1\"/></svg>':'<svg class=\"type-glyph\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m8 6-5 6 5 6m8-12 5 6-5 6m-3-14-2 16\"/></svg>';\n      return `<span class=\"agent-chip\" style=\"--agent-color:var(${color})\"><span class=\"agent-dot\" aria-hidden=\"true\"></span><span class=\"alias\">${alias}</span>${glyph}<span class=\"type\">${provider}</span></span>`;\n    }\n    function ticketChip(key,scope='Syntelligence Jira site') {\n      return `<span class=\"ticket-chip\" title=\"${scope}\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 4h14v16H5zM9 9h6m-6 4h6\"/></svg><span>${key}</span></span>`;\n    }\n    function usageMarkup(kind, record, epic) {\n      const sharedRecord=kind==='ticket'&&(record.id==='SYN-42'||record.id==='SYN-67');\n      const sharedEpic=kind==='epic'&&(record.id==='SYN-10'||record.id==='SYN-20');\n      const explanation=sharedRecord||sharedEpic\n        ? (visibleShared('syn-cl17')?'Usage from run R-17 (client CL-17) remains unassigned across its permitted SYN-42 and SYN-67 links. No supported allocation is available.':'Linked usage remains unallocated from the evidence available in this scope.')\n        : 'Usage attribution is unavailable for this record.';\n      const scope=kind==='epic'?'Scope: all accessible child tickets in this epic, including other assignees.':'Scope: this source-qualified ticket.';\n      return `<details class=\"usage-detail\" id=\"usage-${record.id}\"><summary>Usage &amp; cost: Unavailable <span class=\"sr-only\">for ${record.id}</span>${chevron}</summary><p>${explanation} ${scope} Only measurement classes you may view in Usage can appear here. Observed tokens, API-equivalent estimates, subscription allocation, and actual bills remain separate; no zero cost or hidden allocation basis is implied.</p></details>`;\n    }\n\n  const epics = [\n    {id:'SYN-10', project:'syntelligence', name:'Syntelligence', account:'Syntelligence Jira site', code:'GitHub', title:'Account onboarding', closed:3, total:5, runs:['syn-cl17','syn-cx16'], tickets:[\n      {id:'SYN-42', title:'Define account rollout rules', state:'Needs input', done:2, total:4, run:'syn-cl17', evidence:'The Jira checklist has two completed criteria out of four. Rollout scope and final validation are open. No overall acceptance decision is recorded.'},\n      {id:'SYN-48', title:'Audit account usage mapping', state:'In progress', done:null, total:null, run:'syn-cx16', evidence:'The Jira ticket is In progress and has a linked GitHub pull request. There is no measurable acceptance checklist, so no completion percentage is shown.'}\n    ]},\n    {id:'SYN-20', project:'syntelligence', name:'Syntelligence', account:'Syntelligence Jira site', code:'GitHub', title:'Reliable project sync', closed:1, total:4, runs:['syn-cl17'], tickets:[\n      {id:'SYN-67', title:'Validate sync ownership rules', state:'In progress', done:3, total:4, run:'syn-cl17', evidence:'Three of four Jira acceptance criteria are complete. The final validation remains open. The permitted session links are shown in the observed evidence below.'}\n    ]},\n    {id:'MOV-30', project:'movesion', name:'Movesion', account:'Movesion Jira site', code:'Bitbucket', title:'Fleet reconciliation', closed:2, total:6, runs:['mov-cl8','mov-cx4'], tickets:[\n      {id:'MOV-42', title:'Clarify reconciliation boundaries', state:'Needs input', done:1, total:4, run:'mov-cl8', evidence:'The 07:55 Jira snapshot marked one of four criteria complete and recorded a boundary decision request. Input and execution continue in the existing agent tool.'},\n      {id:'MOV-48', title:'Reconcile duplicate fleet records', state:'In progress', done:2, total:5, run:'mov-cx4', evidence:'The 07:55 Jira snapshot marked two of five criteria complete. A linked Bitbucket record supplies contribution evidence; tracker state, checklist evidence, and acceptance remain distinct.'}\n    ]}\n  ];\n  const runs = {\n    'syn-cl17': {name:'Claude', alias:'Tawny', color:'--identity-iris', id:'CL-17', project:'Syntelligence', source:'Syntelligence Jira site + GitHub', shared:true, evidence:'Ahmed is the confirmed initiator; Claude is the executing agent.'},\n    'syn-cx16': {name:'Codex', alias:'Snowy', color:'--identity-mulberry', id:'CX-16', project:'Syntelligence', source:'Syntelligence Jira site + GitHub', shared:false, evidence:'Ahmed is the confirmed initiator. No checklist percentage is inferred from agent activity.'},\n    'mov-cl8': {name:'Claude', alias:'Barn', color:'--identity-clay', id:'CL-8', project:'Movesion', source:'Movesion Jira site + Bitbucket', shared:false, evidence:'Ahmed is the confirmed initiator in the last permitted snapshot.'},\n    'mov-cx4': {name:'Codex', alias:'Eagle', color:'--identity-slate', id:'CX-4', project:'Movesion', source:'Movesion Jira site + Bitbucket', shared:false, evidence:'Ahmed is the confirmed initiator in the last permitted snapshot. No current activity is inferred.'}\n  };\n  // Every fixture link below is permitted for this viewer; aliases are this viewer's own preferences.\n  const viewerAliases = {'CL-17':{alias:'Tawny',color:'--identity-iris'},'CX-16':{alias:'Snowy',color:'--identity-mulberry'},'CL-8':{alias:'Barn',color:'--identity-clay'},'CX-4':{alias:'Eagle',color:'--identity-slate'}};\n  const readableTicketIds = new Set(['SYN-42','SYN-48','SYN-67','MOV-42','MOV-48']);\n  function permittedRunLinks(id) {\n    return epics.filter(e=>selectedProject==='all'||e.project===selectedProject).flatMap(e=>e.tickets.filter(t=>t.run===id&&readableTicketIds.has(t.id)).map(t=>({ticket:t,epic:e})));\n  }\n  function visibleShared(id){return permittedRunLinks(id).length>1;}\n  function clientChip(run){const preference=viewerAliases[run.id];return agentChip(preference?preference.alias:run.id,run.name,preference?preference.color:'--identity-slate');}\n  function observedRunId(run){return run.id.replace(/^(CL|CX)-/,'R-');}\n  function sourceTime(epic){return epic.project==='movesion'?'07:55':'08:42';}\n  function sourceSnapshotNote(epic){return epic.project==='movesion'?'Stale Jira snapshot · authorization expired · last success 07:55':'Jira snapshot · 08:42';}\n  let selectedView = 'epic';\n  let selectedProject = 'all';\n  function ticketMarkup(ticket, epic) {\n    const run = runs[ticket.run];\n    const percentage = ticket.total ? Math.round(ticket.done / ticket.total * 100) : null;\n    const progress = percentage === null\n      ? '<p class=\"unknown\">Progress unknown<br><span>No checklist available</span></p>'\n      : `<div class=\"progress-copy\"><span>${ticket.done}/${ticket.total} criteria complete${epic.project==='movesion'?' · 07:55 snapshot':''}</span><strong>${percentage}%</strong></div><div class=\"progress-track\" role=\"progressbar\" aria-label=\"${epic.name} ${ticket.id} acceptance checklist\" aria-valuenow=\"${percentage}\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuetext=\"${ticket.done} of ${ticket.total} criteria marked complete${epic.project==='movesion'?' in the stale 07:55 snapshot':''}; overall acceptance not recorded\"><span style=\"--progress:${percentage}%\"></span></div>`;\n    return `<article class=\"ticket\"><p class=\"ticket-origin\">${epic.name} · Epic ${ticketChip(epic.id,epic.account)}<span class=\"origin-account\">${epic.account} · ${epic.code}</span></p><div class=\"ticket-main\"><p class=\"ticket-key\">${ticketChip(ticket.id,epic.account)}</p><h3 class=\"ticket-title\">${ticket.title}</h3><p class=\"status ${ticket.state === 'Needs input' ? 'attention' : ''}\">${statusIcon}${ticket.state}${epic.project==='movesion'?' · stale snapshot':''}</p></div><div class=\"ticket-metrics\">${progress}<a class=\"run-link\" id=\"origin-${ticket.id}\" data-return-label=\"${ticket.id}\" href=\"#run-${ticket.run}\">${clientChip(run)}<span class=\"evidence-label\">${visibleShared(ticket.run) ? 'Shared run evidence' : 'Run evidence'}</span>${arrow}<span class=\"sr-only\"> for ${ticket.id} in ${epic.name}</span></a></div><details id=\"work-${ticket.id}\"><summary>Work evidence <span class=\"sr-only\">for ${ticket.id}</span>${chevron}</summary><p>${ticket.evidence} ${sourceSnapshotNote(epic)}. Assignment to Ahmed uses a confirmed source identity${epic.project==='movesion'?' in that stale snapshot':''}.</p></details>${usageMarkup('ticket',ticket,epic)}</article>`;\n  }\n  function runMarkup(runId) {\n    const run=runs[runId],links=permittedRunLinks(runId),stale=run.project==='Movesion';\n    const references=links.map(link=>`${link.ticket.id} in ${link.epic.id}`).join(' and ');\n    const linkText=links.length>1?`The permitted links are ${references}. They refer to one observed run, counted once.`:references?`A confirmed source mapping links this run to ${references}.`:'No readable work mapping is available in this scope.';\n    return `<details class=\"run-row\" id=\"run-${runId}\"><summary><span class=\"run-name\">${clientChip(run)}<span class=\"run-state\">${visibleShared(runId)?'Shared permitted run':''}</span><span class=\"run-state\">${stale?'Current observation unavailable · Jira access expired':'Reported active · snapshot 08:42'}</span></span>${chevron}</summary><div class=\"run-evidence\"><span class=\"run-id\">Client ${run.id} · Observed run ${observedRunId(run)} · Fixed type: ${run.name}</span><p>${linkText}</p><p>${run.evidence}</p><p>${run.project} · ${run.source}. ${stale?'Jira last succeeded at 07:55. Both Movesion clients depend on that expired source authorization. These work associations are stale snapshots; current state and dependent knowledge delivery are unavailable.':'This is observed source state, not a live control.'}</p><div class=\"return-slot\" id=\"return-${runId}\"></div></div></details>`;\n  }\n  function groupedMarkup(selectedEpics) {\n    const renderedRuns = new Set();\n    return selectedEpics.map((epic, index) => {\n      const percent = Math.round(epic.closed / epic.total * 100);\n      const runRows = epic.runs.map(id => {\n        if (renderedRuns.has(id)) return `<div class=\"shared-run\"><span>${clientChip(runs[id])} · Shared permitted run</span><a id=\"origin-shared-${epic.id}\" data-return-label=\"${epic.tickets[0].id}\" href=\"#run-${id}\">Shared run evidence for ${epic.tickets[0].id}</a></div><p class=\"shared-note\">This permitted run is counted once across the visible scope.</p>`;\n        renderedRuns.add(id); return runMarkup(id);\n      }).join('');\n      return `<section class=\"epic\" aria-labelledby=\"epic-${epic.id}\"><header class=\"epic-header\"><p class=\"epic-origin\">${epic.name} · ${epic.code}</p><div class=\"epic-kicker\"><h2 class=\"epic-title\" id=\"epic-${epic.id}\">${epic.title}</h2><span class=\"epic-key\">${ticketChip(epic.id,epic.account)}</span></div><div class=\"context-row\"><p class=\"context-label\"><strong>${epic.tickets.length} assigned to you</strong></p><p class=\"context-basis\"><span class=\"tiny-bar\" aria-hidden=\"true\"><span style=\"--progress:${percent}%\"></span></span><strong>${epic.closed} of ${epic.total}</strong> child tickets closed</p></div><p class=\"epic-agentline\">${epic.runs.map(id => clientChip(runs[id])).join(' ')} · ${epic.runs.length} linked ${epic.runs.length === 1 ? 'run' : 'runs'}</p><p class=\"aggregate-basis\">Counted from records you can access</p><p class=\"context-label\">${sourceSnapshotNote(epic)}</p><details class=\"epic-context\" id=\"context-${epic.id}\"><summary>Epic counting basis ${chevron}</summary><p class=\"context-copy\">${epic.account}: ${epic.closed} of ${epic.total} permitted epic tickets have a closed tracker status in the ${sourceTime(epic)} snapshot. This denominator includes other assignees. Only your ${epic.tickets.length} assigned ${epic.tickets.length === 1 ? 'ticket is' : 'tickets are'} shown below. Epic acceptance is not recorded.</p></details>${usageMarkup('epic',epic,epic)}</header><details class=\"epic-work\" id=\"epic-work-${epic.id}\"${index === 0 ? ' open' : ''}><summary>Assigned work · ${epic.tickets.length} ${epic.tickets.length === 1 ? 'ticket' : 'tickets'} ${chevron}</summary><div class=\"ticket-grid\">${epic.tickets.map(ticket => ticketMarkup(ticket,epic)).join('')}</div><div class=\"sessions\"><p class=\"sessions-title\">Agent work in this epic <span>${epic.runs.length} linked ${epic.runs.length === 1 ? 'run' : 'runs'}</span></p>${runRows}</div></details></section>`;\n    }).join('');\n  }\n  function togetherMarkup(selectedEpics) {\n    const tickets = selectedEpics.flatMap(epic => epic.tickets.map(ticket => ({ticket, epic})));\n    tickets.sort((a,b) => (a.ticket.state === 'Needs input' ? 0 : 1) - (b.ticket.state === 'Needs input' ? 0 : 1));\n    const uniqueRuns = [...new Set(selectedEpics.flatMap(epic => epic.runs))];\n    return `<section aria-labelledby=\"combined-heading\"><h2 id=\"combined-heading\">Assigned work · combined view</h2><div class=\"combined\">${tickets.map(({ticket,epic}) => ticketMarkup(ticket,epic)).join('')}</div></section><section class=\"combined-sessions\" aria-label=\"Distinct observed sessions\"><div class=\"sessions\"><h2 class=\"sessions-title\">Distinct observed agent runs <span>Shared permitted appearances counted once</span></h2>${uniqueRuns.map(runMarkup).join('')}</div></section>`;\n  }\n  function render(announce = true) {\n    const selectedEpics = epics.filter(epic => selectedProject === 'all' || epic.project === selectedProject).map(epic=>{const tickets=epic.tickets.filter(ticket=>readableTicketIds.has(ticket.id));return {...epic,total:epic.total-(epic.tickets.length-tickets.length),tickets,runs:[...new Set(tickets.map(ticket=>ticket.run))]};}).filter(epic=>epic.tickets.length);\n    const ticketCount = selectedEpics.reduce((sum,epic) => sum + epic.tickets.length,0);\n    const runCount = new Set(selectedEpics.flatMap(epic => epic.runs)).size;\n    document.getElementById('ticket-count').innerHTML = `<strong>${ticketCount} assigned tickets</strong> across ${selectedEpics.length} ${selectedEpics.length === 1 ? 'epic' : 'epics'}`;\n    document.getElementById('run-count').textContent = `${runCount} distinct linked agent runs`;\n    document.getElementById('focus-content').innerHTML = selectedView === 'epic' ? groupedMarkup(selectedEpics) : togetherMarkup(selectedEpics);\n    document.getElementById('unlinked').hidden = selectedProject === 'movesion';\n    document.querySelectorAll('[data-view]').forEach(button => button.setAttribute('aria-pressed',String(button.dataset.view === selectedView)));\n    if (announce) document.getElementById('announcement').textContent = `${selectedView === 'epic' ? 'Grouped by epic' : 'Combined view'}. ${ticketCount} assigned tickets, ${runCount} distinct linked runs. Illustrative data.`;\n  }\n  document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => { selectedView = button.dataset.view; render(); }));\n  document.getElementById('project-scope').addEventListener('change', event => { selectedProject = event.target.value; render(); });\n  document.addEventListener('click', event => {\n    const returning=event.target.closest('a[data-return-to]');\n    if(returning){const origin=document.getElementById(returning.dataset.returnTo);if(origin){event.preventDefault();for(let parent=origin.parentElement;parent;parent=parent.parentElement){if(parent.tagName==='DETAILS')parent.open=true;}origin.focus();origin.scrollIntoView({block:'nearest'});}return;}\n    const anchor = event.target.closest('a[href^=\"#run-\"]');\n    if (!anchor) return;\n    const destination = document.querySelector(anchor.getAttribute('href'));\n    if (!destination) return;\n    event.preventDefault(); destination.open = true;\n    for (let ancestor = destination.parentElement; ancestor; ancestor = ancestor.parentElement) { if (ancestor.tagName === 'DETAILS') ancestor.open = true; }\n    const slot=destination.querySelector('.return-slot');\n    if(slot&&anchor.id){slot.innerHTML='';const back=document.createElement('a');back.className='return-link';back.href='#'+anchor.id;back.dataset.returnTo=anchor.id;back.textContent='Back to '+anchor.dataset.returnLabel;slot.append(back);}\n    destination.querySelector('summary').focus({preventScroll:true});\n    destination.scrollIntoView({block:'nearest',behavior:'instant'});\n  });\n  document.getElementById('refresh-focus').addEventListener('click',()=>{\n    const openIds=[...document.querySelectorAll('details[open][id]')].map(item=>item.id);\n    const position=window.scrollY;render(false);for(const id of openIds){const item=document.getElementById(id);if(item)item.open=true;}\n    window.scrollTo({top:position});document.getElementById('announcement').textContent='Illustrative snapshot refreshed. Open evidence is preserved. Movesion Jira remains stale since 07:55.';\n  });\n  render(false);\n<\/script>\n</body>\n</html>\n"},{"label":"Work evidence","file":"work-detail.html","html":"<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Owl Mast — Work evidence</title>\n<style>\n/* Governed by DESIGN: Brand & Style, Typography, Layout & Spacing, Components.\n   EXPERIENCE: S2, scope-bar, work-record, progress-evidence, evidence-detail,\n   State Patterns S2, Evidence semantics, SC-1 steps 3–5. This static composition\n   extends key-focus.html's accepted shell. Host tokens illustrate the direction;\n   they do not verify the exact DESIGN palette. All records and rules are fixtures. */\n* { box-sizing: border-box; }\nhtml, body { margin: 0; padding: 0; background: transparent; }\nbody { color: var(--foreground,var(--owl-text)); font: 14px/1.5 var(--font-sans, system-ui, sans-serif); -webkit-font-smoothing: antialiased; }\nh1, h2, h3, p, dl, dd { margin: 0; }\nstrong { font-weight: 600; }\nsvg { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }\n.study-note { margin: 0 0 12px; color: var(--muted-foreground,var(--owl-secondary-text)); }\n.study-note strong { color: var(--foreground,var(--owl-text)); }\n.app { overflow: hidden; border: 1px solid var(--border,var(--owl-divider)); border-radius: 14px; background: var(--background,var(--owl-canvas)); }\n.topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 24px; border-bottom: 1px solid var(--border,var(--owl-divider)); background: var(--card,var(--owl-card)); }\n.brand { display: flex; align-items: center; gap: 9px; font-size: 17px; font-weight: 700; letter-spacing: -.035em; }\n.brand-mark { display: grid; place-items: center; width: 34px; height: 3 ight: 16px; stroke-width: 1.6; color: var(--chip-accent); }\n.agent-line { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }\n.agent-line + .agent-line { margin-top: 7px; }\nh1 { font-size: 28px; line-height: 1.2; letter-spacing: -.025em; font-weight: 650; }\n.eyebrow { margin-bottom: 5px; color: var(--muted-foreground,var(--owl-secondary-text)); }\n.title-note { margin-top: 8px; color: var(--muted-foreground,var(--owl-secondary-text)); }\n.panel { margin-top: 20px; padding: 16px; background: var(--card,var(--owl-card)); border: 1px solid var(--border,var(--owl-divider)); border-radius: 12px; }\nh2 { font-size: 18px; line-height: 1.4; font-weight: 600; letter-spacing: -.015em; }\n.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }\n.measure { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }\n.progress-track { height: 5px; border-radius: 6px; background: var(--secondary,var(--owl-secondary-surface)); margin: 12px 0 9px; overflow: hidden; }\n.progress-track span { display: block; width: 75%; height: 100%; background: var(--primary,var(--owl-primary)); }\ndetails { margin-top: 10px; }\nsummary { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 8px 0; cursor: pointer; list-style: none; font-weight: 600; }\nsummary::-webkit-details-marker { display: none; }\nsummary::after { content: '+'; font-size: 20px; font-weight: 400; flex-shrink: 0; }\ndetails[open] > summary::after { content: '−'; }\nsummary:focus-visible { outline: 3px solid var(--ring,var(--owl-control-outline)); outline-offset: 3px; border-radius: 4px; }\n.criterion-list { list-style: none; padding: 0; margin: 4px 0 8px; }\n.criterion-list li { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-top: 1px solid var(--border,var(--owl-divider)); }\n.criterion-state { color: var(--muted-foreground,var(--owl-secondary-text)); }\n.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 14px; }\n.fact { min-width: 0; padding-left: 12px; border-left: 2px solid var(--border,var(--owl-divider)); }\n.fact dt { color: var(--muted-foreground,var(--owl-secondary-text)); }\n.fact dd { margin-top: 4px; font-weight: 600; }\n.fact p { margin-top: 3px; color: var(--muted-foreground,var(--owl-secondary-text)); }\n.acceptance { background: var(--secondary,var(--owl-secondary-surface)); border: 0; }\n.acceptance .section-head p { color: var(--foreground,var(--owl-text)); font-weight: 600; }\n.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; margin-top: 14px; }\n.fields > div { min-width: 0; }\n.fields dt { margin-bottom: 4px; color: var(--muted-foreground,var(--owl-secondary-text)); }\n.fields dd { overflow-wrap: anywhere; }\n.note { margin-top: 12px; }\n.disclosure { padding-top: 0; padding-bottom: 0; }\n.disclosure > details { margin-top: 0; }\n.disclosure > details > summary { min-height: 54px; }\n.disclosure .fields { margin: 2px 0 16px; }\n.disclosure p { margin: 0 0 14px; }\n.relationship-list { margin: 0 0 14px; padding-left: 20px; }\n.relationship-list li + li { margin-top: 8px; }\n.footer { margin-top: 18px; color: var(--muted-foreground,var(--owl-secondary-text)); }\n.alternate { margin-top: 18px; padding: 16px; border: 1px dashed var(--border,var(--owl-divider)); border-radius: 12px; background: var(--card,var(--owl-card)); }\n.alternate h2 { font-size: 16px; margin: 4px 0 8px; }\n.alternate p + p { margin-top: 6px; }\n@media (max-width: 599px) {\n .topbar { padding: 14px 16px; gap: 12px; align-items: flex-start; }\n .brand { font-size: 16px; }\n .workspace { max-width: 130px; }\n .nav { padding: 10px 16px; }\n main { padding: 20px 16px; }\n h1 { font-size: 25px; }\n .scope { padding: 12px; }\n .facts, .fields { grid-template-columns: 1fr; }\n .panel { padding: 14px; }\n .disclosure { padding-top: 0; padding-bottom: 0; }\n .criterion-list li { grid-template-columns: 1fr; gap: 2px; }\n}\n\n/* Reviewer corrections: operational 14px floor; 16px fields; safe personal identity;\n   native disclosures; readable reflow; fixed type glyphs. No runtime integration. */\n.app,.project-panel{overflow:visible}.topbar{border-radius:12px 12px 0 0}.nav,.brand,.row-head,.agent-line,.client-head,.client-chiprow{flex-wrap:wrap}.brand{white-space:normal}.nav{gap:8px 20px}\nbody{overflow-wrap:anywhere}.meta,.workspace,.workspace span,.eyebrow,.readiness-time,.notification-state-label,.footer,.study-note{font-size:14px}\ninput,select,.field input[type=text],.field select{font-size:16px}button,input,select,summary,a{touch-action:manipulation}\na{color:var(--primary,var(--owl-primary));text-underline-offset:3px}a.local-link{display:inline-flex;align-items:center;min-height:44px;padding:8px 4px;gap:8px}\nsummary:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--ring,var(--owl-control-outline));outline-offset:3px}\nsummary::after{content:none!important}summary{gap:10px;min-height:44px}summary>span{min-width:0}.chevron{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.7}details[open]>summary .chevron{transform:rotate(90deg)}\n.agent-chip{display:inline-flex;align-items:center;flex-wrap:wrap;gap:6px;max-width:100%;padding:6px 9px;border:1px solid var(--border,var(--owl-divider));border-radius:999px;background:var(--secondary,var(--owl-secondary-surface));color:var(--foreground,var(--owl-text));font-size:14px;line-height:1.5;vertical-align:middle;overflow-wrap:anywhere}.agent-chip .alias{font-weight:600;overflow-wrap:anywhere;max-width:100%}.agent-chip .type,.stable-id{color:var(--muted-foreground,var(--owl-secondary-text));font-size:14px}.stable-id{font-family:var(--font-mono,monospace)}.agent-marker{width:8px;height:8px;flex-shrink:0;transform:rotate(45deg);border:1px solid var(--identity-color,CanvasText);background:var(--identity-color,CanvasText);margin:0 3px}.type-glyph{display:block;width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:var(--muted-foreground,var(--owl-secondary-text))}\n.ticket-chip{max-width:100%;overflow-wrap:anywhere}.scope-basis{margin:10px 0;color:var(--foreground,var(--owl-text));font-size:14px}.section-links{display:flex;gap:0 16px;flex-wrap:wrap;margin:10px 0}.section-links a{min-height:44px;display:inline-flex;align-items:center}.facts dd p,.metrics dd p{font-size:14px;font-weight:400;letter-spacing:normal;line-height:1.5}\n.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.bar span,.bar.unassigned span{background:var(--primary,var(--owl-primary))}\nfieldset{min-width:0;border:1px solid var(--border,var(--owl-divider));border-radius:8px;padding:12px;margin:12px 0}legend{font-size:14px;font-weight:600;padding:0 6px}.check-label{min-height:44px}.help{margin-top:8px;font-size:14px}.error-copy{color:var(--foreground,var(--owl-text));border-left:3px solid var(--destructive,var(--owl-error));padding-left:10px;margin:12px 0}.list{padding-left:20px;margin:12px 0}.list li+li{margin-top:6px}.fixture-state{margin-top:18px;padding:16px;border:1px dashed var(--border,var(--owl-divider));border-radius:12px}.fixture-state h1,.fixture-state h2{margin:8px 0}.arrival-shell{border:1px solid var(--border,var(--owl-divider));border-radius:12px;padding:16px;margin-top:16px;background:var(--card,var(--owl-card))}.arrival-shell p+p{margin-top:8px}.receipt-note{margin-top:10px}.totals dd{font-variant-numeric:tabular-nums}\n@media(max-width:599px){.row-head,.facts,.fields,.toolbar,.metrics,.client-grid,.split{display:grid;grid-template-columns:1fr}.row-head{gap:6px}.source-row,.definition-row{grid-template-columns:1fr}.workspace,.workspace span{font-size:14px}.topbar{align-items:flex-start}.nav{flex-wrap:wrap}.work-row{min-width:0}.agent-chip{max-width:100%}.app{overflow:visible}}\n@media(forced-colors:active){.agent-marker{background:CanvasText;border:1px solid CanvasText}.bar span,.progress-track span{background:Highlight}.ticket-chip,.agent-chip{border:1px solid CanvasText}.nav [aria-current]{outline:2px solid Highlight;outline-offset:-2px}}\n.skip-link{position:absolute;left:12px;top:-200px;z-index:5;padding:10px;background:var(--card,var(--owl-card));color:var(--foreground,var(--owl-text))}.skip-link:focus{top:12px}\n</style>\n<style id=\"owl-reference-theme\">:root{--owl-canvas:#F5F7FB;--owl-card:#FFFFFF;--owl-secondary-surface:#EAF0F8;--owl-text:#172337;--owl-secondary-text:#52627A;--owl-divider:#D7E0EC;--owl-control-outline:#74849B;--owl-primary:#2456D6;--owl-on-primary:#FFFFFF;--owl-knowledge:#086A7B;--owl-attention:#845900;--owl-success:#176B50;--owl-error:#B23549;--owl-identity-iris:#6B4CC2;--owl-identity-mulberry:#943B75;--owl-identity-clay:#8F4D40;--owl-identity-slate:#556579;color-scheme:light;--identity-iris:var(--owl-identity-iris);--identity-mulberry:var(--owl-identity-mulberry);--identity-clay:var(--owl-identity-clay);--identity-slate:var(--owl-identity-slate);}\n@media(prefers-color-scheme:dark){:root{--owl-canvas:#0B1018;--owl-card:#121A27;--owl-secondary-surface:#1B2738;--owl-text:#EAF1FA;--owl-secondary-text:#A5B5CB;--owl-divider:#2E3C50;--owl-control-outline:#73869E;--owl-primary:#91B5FF;--owl-on-primary:#0B1730;--owl-knowledge:#70D7E7;--owl-attention:#F0C268;--owl-success:#72D6AF;--owl-error:#FF95A5;--owl-identity-iris:#C4B0FF;--owl-identity-mulberry:#F0ADDA;--owl-identity-clay:#F0B5A8;--owl-identity-slate:#B7C8DD;color-scheme:dark;}}\nhtml[data-owl-theme=\"dark\"]{--owl-canvas:#0B1018;--owl-card:#121A27;--owl-secondary-surface:#1B2738;--owl-text:#EAF1FA;--owl-secondary-text:#A5B5CB;--owl-divider:#2E3C50;--owl-control-outline:#73869E;--owl-primary:#91B5FF;--owl-on-primary:#0B1730;--owl-knowledge:#70D7E7;--owl-attention:#F0C2 y publications</span></div>\n<p class=\"access-note\"><strong>Project scope is a ceiling, not a read grant.</strong> A version's title, body, evaluation, and references appear only when you can read their source-derived material, or that exact version has been evaluated as safe for your wider project audience. Unverifiable access withholds the whole version.</p>\n<section class=\"gap\" aria-labelledby=\"search-label\"><label id=\"search-label\" for=\"knowledge-search\">Search this authorized scope</label><div class=\"search\"><input id=\"knowledge-search\" type=\"search\" placeholder=\"Search by topic or applicability\" readonly><button disabled aria-describedby=\"search-reason\">Search</button></div><p class=\"reason\" id=\"search-reason\">Static input only; no query is stored or sent. Query-context retention and visibility remain open under A-3.</p><div class=\"filter-row\" role=\"group\" aria-label=\"Example lifecycle filters\"><span class=\"filter selected\">All visible states</span><span class=\"filter\">Approved</span><span class=\"filter\">Candidate</span><span class=\"filter\">Quarantined</span><span class=\"filter\">Withdrawn</span><span class=\"filter\">Superseded</span></div></section>\n<p class=\"note gap\">Claude and Codex search when they need knowledge. Opening this library does not send context to an agent. Default delivery eligibility remains assumption A-1.</p>\n<h2 class=\"section-title\">2 example knowledge records</h2><p class=\"basis\">Counted from records you can access.</p>\n<article class=\"panel\"><div class=\"panel-head\"><div><p class=\"eyebrow mono\">SYN-K07 · v3</p><h3><a class=\"entry-title\" href=\"knowledge-detail.html\">Check that the expected tests actually ran</a></h3></div><span class=\"badge knowledge\">Scope: Syntelligence</span></div><p class=\"smallgap\">A successful check needs supporting test evidence before it can establish validation.</p><div class=\"badges\"><span class=\"badge success\">Approved</span><span class=\"badge\">Human-reviewed</span></div><p class=\"record-meta\">Notion · Hermes learning flow · Reviewed 5 Nov, 08:50</p><p class=\"access-note\">This example viewer is authorized for the version and the material from which its evaluation is derived.</p><details class=\"gap\"><summary><svg class=\"disclosure-chevron\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"m6 3 5 5-5 5\"/></svg>Evaluation and applicability · SYN-K07 v3</summary><div class=\"details-body\"><p><strong>Evaluated by:</strong> Ahmed, project maintainer in this example. Evaluated version: v3. Basis: source check record compared with test evidence.</p><p><strong>Applies to:</strong> reviewing reported check success. Current access gates this entire evaluation, not only its links.</p></div></details></article>\n<article class=\"panel\"><div class=\"panel-head\"><div><p class=\"eyebrow mono\">SYN-K12 · v1</p><h3>Keep skipped checks separate from passing checks</h3></div><span class=\"badge knowledge\">Scope: Syntelligence</span></div><div class=\"badges\"><span class=\"badge\">Candidate</span></div><p class=\"smallgap muted\">Origin and applicability are recorded; evaluation is incomplete. This item is not labeled approved.</p><p class=\"record-meta\">Notion · Captured by the existing learning flow · 08:42</p><p class=\"access-note\">The example viewer has current source-derived-content access. A project badge alone would not make this candidate readable.</p></article>\n<details class=\"panel gap\"><summary><svg class=\"disclosure-chevron\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"m6 3 5 5-5 5\"/></svg>Submit a project lesson</summary><div class=\"details-body\"><p class=\"muted\">Use an existing Notion record when available. Preserve the Hermes → Notion flow without a second save.</p><div class=\"twocol gap\"><div><label for=\"lesson-title\">Lesson title</label><input id=\"lesson-title\" value=\"Check that the expected tests ran\" readonly></div><div><label for=\"lesson-origin\">Origin</label><input id=\"lesson-origin\" value=\"Existing Notion learning record\" readonly></div><div class=\"full\"><label for=\"lesson-applies\">When this lesson applies</label><textarea id=\"lesson-applies\" readonly>When assessing a reported successful check before accepting its validation evidence.</textarea></div><div class=\"full\"><label for=\"lesson-evidence\">Permitted supporting evidence</label><input id=\"lesson-evidence\" value=\"Authorized Notion and check references\" readonly></div></div><div class=\"row gap\"><span class=\"badge knowledge\">Scope: Syntelligence</span><button disabled aria-describedby=\"submit-reason\">Submit candidate</button></div><p class=\"reason\" id=\"submit-reason\">Static study. Submission preserves lineage but neither approves nor publishes.</p><p class=\"smallgap\"><strong>Duplicate/conflict response:</strong> show a reference only if this reader may access the matched version. Otherwise show “Saved as a candidate” and route the restricted comparison to a source-authorized maintainer; expose no match count, title, cross-project comparison, or existence signal.</p></div></details>\n<details class=\"panel gap\"><summary><svg class=\"disclosure-chevron\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"m6 3 5 5-5 5\"/></svg>Alternate catalog states · access, lifecycle, and empty search</summary><div class=\"details-body\"><div class=\"state-list\"><section><h3>No matching knowledge in this scope</h3><p>The authorized search completed. Try different terms; another project's content is not substituted. This is different from a permission or connection failure.</p></section><section><h3>This item is unavailable</h3><p>Return to knowledge to view the items currently available to you. No old title, body, evaluation, duplicate/conflict link, or receipt is shown.</p></section><section><h3>Knowledge version withdrawn</h3><p><span class=\"badge\">Withdrawn</span> <span class=\"mono\">Reference W-04</span></p><p class=\"smallgap\">Owl Mast delivery stopped. This safety/permission-related return uses a neutral reference without the old title or content. Authorized audit access is separate.</p></section><section><h3>Knowledge version quarantined</h3><p><span class=\"badge\">Quarantined · system-initiated</span></p><p class=\"smallgap\">5 Nov, 10:20 · delivery withheld pending authorized review. The recipient view omits the title, body, source, and restricted reason. A permitted maintainer sees the specific reason and time.</p></section><section><h3>Superseded version</h3><p>A still-authorized version may remain readable with a “Superseded” label and a permitted current-version link. Do not infer access from its former delivery.</p></section></div><p class=\"note gap\">A-2 remains open for exact retrieval/retention defaults. Lifecycle states do not authorize unsafe human-read content. Direct Notion/client access remains governed separately.</p></div></details>\n\n<footer class=\"footer\"><span>Example date · 5 Nov 2026 · Europe/Warsaw</span><span>Static study · no source changes</span></footer></main></div></body></html>"},{"label":"Knowledge and delivery","file":"knowledge-detail.html","html":"<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>Owl Mast — Knowledge detail</title><style>\n/* Governing spines: DESIGN.md Brand & Style, Colors, Typography, Layout & Spacing,\n   Components; EXPERIENCE.md S3/S4/S6, knowledge-record, delivery-receipt,\n   promotion-review, settings-field, state-message, SC-2 and SC-3.\n   Static reference only. Layout is a designer proposal under delegated visual judgment. */\n*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent}\nbody{font:14px/1.5 var(--font-sans,system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif);color:var(--foreground,var(--owl-text));-webkit-font-smoothing:antialiased}\nh1,h2,h3,p{margin:0}button,input,textarea{font:inherit}bu sion is approved</h2><section class=\"panel\" aria-label=\"Knowledge evaluation\"><dl class=\"dl-grid\"><div><dt>Evaluation kind</dt><dd>Human-reviewed</dd></div><div><dt>Evaluated version</dt><dd class=\"mono\">SYN-K07 · v3</dd></div><div><dt>Reviewer</dt><dd>Ahmed · source-authorized project maintainer in this example</dd></div><div><dt>Evaluation time</dt><dd>5 Nov, 08:50 · Europe/Warsaw</dd></div><div class=\"full\"><dt>Basis</dt><dd>The source check result was compared with expected test evidence. Wording was corrected to distinguish passed from skipped checks.</dd></div></dl><details class=\"gap\"><summary><svg class=\"disclosure-chevron\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"m6 3 5 5-5 5\"/></svg>Earlier evaluation · SYN-K07 v2</summary><div class=\"details-body\"><p>Automatically evaluated by example policy “Evidence checks” v1 on 4 Nov at 16:20. This authorized history applies only to v2; it does not approve edited v3 or permit company publication.</p></div></details></section>\n<details class=\"panel gap\"><summary><svg class=\"disclosure-chevron\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"m6 3 5 5-5 5\"/></svg>Origin and controlled provenance</summary><div class=\"details-body\"><dl class=\"dl-grid\"><div><dt>Origin</dt><dd>Notion project learning record</dd></div><div><dt>Capture path</dt><dd>Existing Hermes → Notion learning</dd></div><div><dt>Contributor</dt><dd>Mohamed · <span class=\"agent-chip\" style=\"--identity-color:var(--identity-slate,var(--muted))\"><span class=\"identity-marker\" aria-hidden=\"true\"></span><svg class=\"type-glyph\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1M5.6 18.4l2.1-2.1m8.6-8.6 2.1-2.1\"/></svg><span class=\"agent-type\">Claude<span class=\"sr-only\"> agent</span></span><span class=\"mono\">CL-21</span></span><p class=\"smallgap\">Source-confirmed contributor mapping · observed run R-21. uture visibility requires recipient-project authorization.</p>\n<ol class=\"timeline\"><li><time>09:10</time><div><strong>Available in the authorized scope</strong><p>The version was eligible for this example request; A-1's default set remains provisional.</p></div></li><li><time>09:11:02</time><div><strong>Retrieved</strong><p>An Owl Mast-mediated read of SYN-K07 v3 was observed.</p></div></li><li><time>09:11:04</time><div><strong>Delivered</strong><p>Receipt observed for client CL-17, run R-17, in Syntelligence. Receipt does not prove useful reuse.</p></div></li><li><span class=\"muted\">Not established</span><div><strong>Useful reuse not yet verified</strong><p>A task artifact and authorized human verification are still required.</p></div></li></ol>\n<details class=\"gap\"><summary><svg class=\"disclosure-chevron\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"m6 3 5 5-5 5\"/></svg>Record verified reuse · authorized reviewer only</summary><div class=\"details-body\"><p>An authorized reviewer can record the exact item/version, permitted task-artifact reference, verification basis, and time. The artifact and its metadata remain visible only to readers authorized for the recipient project and source.</p><div class=\"twocol gap\"><div><label for=\"reuse-version\">Version used</label><input id=\"reuse-version\" value=\"SYN-K07 · v3\" readonly></div><div><label for=\"reuse-artifact\">Authorized task artifact</label><input id=\"reuse-artifact\" placeholder=\"Select a permitted artifact reference\" readonly></div></div><button class=\"gap\" disabled aria-describedby=\"reuse-reason\">Record verified reuse</button><p class=\"reason\" id=\"reuse-reason\">Static study; no verification or artifact is submitted. Retrieval alone cannot enable this record.</p><p class=\"note gap\"><strong>Restricted artifact alternative:</strong> a reader entitled to the reuse outcome but not its artifact sees only “Reuse verified in a permitted project.” No artifact title, link, recipient identity, or task context is exposed.</p></div></details>\n<details class=\"gap\"><summary><svg class=\"disclosure-chevron\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"m6 3 5 5-5 5\"/></svg>Receipt alternatives · lifecycle and restricted recipients</summary><div class=\"details-body\"><div class=\"state-list\"><section><h3>Delivered · since withdrawn</h3><p><span class=\"mono\">Reference W-04</span> · delivery observed 09:11:04 · withdrawn 10:15.</p><p class=\"smallgap\">Owl Mast delivery stopped. The former title/body is withheld. Old feed rows and notification returns use the same neutral lifecycle view.</p></section><section><h3>Delivered · since superseded</h3><p>The receipt identifies the delivered version and its current lifecycle state. A still-authorized reader may inspect that version and a permitted replacement.</p></section><section><h3>Publication delivery history</h3><p>This history covers only deliveries you may inspect. The publication's permitted audience defines its possible reach; recipient identities, project tasks, and query context outside your access are not shown.</p></section></div><p class=\"smallgap\">No-receipt means no observed Owl Mast-mediated delivery here, not that nobody read the content. Revoking Owl Mast delivery does not revoke independent Notion/client access or erase earlier copies/actions.</p></div></details>\n</section>\n<p class=\"note gap\"><strong>Pilot integration status:</strong> current Notion skill reading by Claude/Codex remains unverified. Receipts here illustrate intended evidence; they do not prove a completed integration.</p>\n<div id=\"company-reader\"><details class=\"panel gap\"><summary><svg class=\"disclosure-chevron\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"m6 3 5 5-5 5\"/></svg>Alternate company-reader view · CMP-K04 v1</summary><div class=\"details-body\">\n<p class=\"alt-label\">Alternate viewer · authorized Movesion company-knowledge reader</p><p class=\"smallgap\">This replaces the project-detail view above. Only publication-authorized fields are rendered.</p>\n<div class=\"scope gap\"><strong>Movesion</strong><span>Permitted company knowledge</span></div>\n<h2 class=\"state-heading\">Verify the expected test suite</h2><div class=\"badges\"><span class=\"badge mono\">CMP-K04 · v1</span><span class=\"badge knowledge\">Scope: Company</span><span class=\"badge success\">Published</span></div>\n<div class=\"quote gap\">Before using a successful check as evidence, confirm that the expected test suite ran. Keep skipped or not-run checks separate from passed checks.</div>\n<dl class=\"dl-grid gap\"><div><dt>Applicability</dt><dd>Reviewing reported check success.</dd></div><div><dt>Freshness</dt><dd>Published 5 Nov, 10:00 · current as observed 10:01.</dd></div><div><dt>Evaluation kind</dt><dd>Evaluated by policy</dd></div><div><dt>Publication version</dt><dd class=\"mono\">CMP-K04 · v1</dd></div></dl>\n<p class=\"smallgap\">These fields describe the publication this reader may use. No originating project/source identifier, named evaluator, restricted evaluation basis, or another project's receipts are included.</p>\n</div></details></div>\n<h2 class=\"section-title\" id=\"lifecycle-heading\">Lifecycle and access alternatives</h2><details class=\"panel gap\"><summary><svg class=\"disclosure-chevron\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"m6 3 5 5-5 5\"/></svg>Withdrawn, quarantined, and superseded versions</summary><div class=\"details-body\"><div class=\"state-list\"><section><h3>Knowledge version withdrawn</h3><p><span class=\"badge\">Withdrawn</span> <span class=\"mono\">Reference W-04</span></p><p class=\"smallgap\">Owl Mast delivery stopped · 5 Nov, 10:15. The former-audience view contains no old title, body, origin, or restricted reason. Return to the authorized knowledge catalog.</p></section><section><h3>Knowledge version quarantined</h3><p><span class=\"badge\">Quarantined · system-initiated</span></p><p class=\"smallgap\">5 Nov, 10:20 · delivery withheld. Ordinary readers receive the neutral state. Source-authorized maintainers/auditors can inspect the reason and exact affected version in a separately authorized audit view.</p></section><section><h3>Superseded version · still authorized</h3><p><span class=\"badge\">Superseded</span> <span class=\"mono\">SYN-K07 · v2</span></p><p class=\"smallgap\">This version may remain readable while its material is still authorized. Its own evaluation is not approval of v3; a permitted link can lead to the current version.</p></section><section><h3>Audit view · separate authorization</h3><p>An authorized audit view may include exact earlier content, evaluator/policy, reason, and delivery evidence only within that auditor's permissions. A maintainer designation alone does not reveal it.</p></section></div><p class=\"note gap\">A-2's exact retrieval/retention defaults remain open. Safety/permission restrictions apply to human views, feed rows, notification returns, and receipts now; a lifecycle badge is not permission to keep showing excluded content.</p></div></details>\n<details class=\"panel gap\"><summary><svg class=\"disclosure-chevron\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"m6 3 5 5-5 5\"/></svg>Unavailable version · safe return</summary><div class=\"details-body\"><h2 class=\"state-heading hidden-heading\" tabindex=\"-1\">This item is unavailable</h2><p>Return to knowledge to view the items currently available to you.</p><a class=\"return-link\" href=\"knowledge.html\">Return to Knowledge</a><p class=\"smallgap\">This replacement state reveals no restricted title, excerpt, provenance, query, or receipt. Arrival focuses the neutral heading.</p></div></details>\n\n<footer class=\"footer\"><span>Example date · 5 Nov 2026 · Europe/Warsaw</span><span>Static study · no source changes</span></footer></main></div></body></html>"},{"label":"Connections and agent appearance","file":"connections.html","html":"<!doctype html><html lang=\"en\ s=\"panel\" aria-labelledby=\"appearance-heading\"><h2 id=\"appearance-heading\">Your agent appearance</h2><p class=\"body-copy\">An alias belongs to this viewer and stable client enrollment. It never renames the provider, source account, agent history, or another person’s view.</p><div class=\"fields\"><div class=\"field\"><label for=\"appearance-client\">Client to personalize</label><select id=\"appearance-client\" disabled aria-describedby=\"study-note\"><option>Tawny · Claude · CL-17</option></select></div><div class=\"field\"><p class=\"field-label\">Current appearance</p><span class=\"agent-chip\" style=\"--identity-color:var(--identity-iris, CanvasText)\"><span class=\"agent-marker\" aria-hidden=\"true\"></span><span class=\"alias\">Tawny</span><span class=\"sr-only\">, </span><svg class=\"type-glyph\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1M5.6 18.4l2.1-2.1m8.6-8.6 2.1-2.1\"/></svg><span class=\"type\">Claude</span><span class=\"sr-only\"> agent, client </span><span class=\"stable-id\">CL-17</span></span></div><div class=\"field\"><label for=\"agent-name\">Display name</label><input id=\"agent-name\" type=\"text\" value=\"Tawny\" readonly required minlength=\"1\" maxlength=\"32\" aria-describedby=\"name-help study-note\"><p class=\"field-help\" id=\"name-help\">Use 1–32 characters after trimming surrounding spaces. A blank or longer name is not saved. Stable client IDs distinguish repeated names.</p></div><div class=\"field\"><label for=\"agent-color\">Personal marker color</label><select id=\"agent-color\" disabled aria-describedby=\"color-help study-note\"><option>Iris</option><option>Mulberry</option><option>Clay</option><option>Slate</option></select><p class=\"field-help\" id=\"color-help\">A diamond marks identity; it never communicates work status. The type icon and readable Claude label stay fixed.</p></div></div><div class=\"action-row\"><button class=\"button\" type=\"button\" disabled aria-describedby=\"study-note\">Save your appearance</button><button class=\"button\" type=\"button\" disabled aria-describedby=\"reset-help study-note\">Reset your appearance</button></div><p class=\"help\" id=\"reset-help\">Reset removes your alias and chosen color, returning to the fixed type, stable client ID, and neutral marker: <span class=\"agent-chip\" style=\"--identity-color:var(--identity-slate, CanvasText)\"><span class=\"agent-marker\" aria-hidden=\"true\"></span><svg class=\"type-glyph\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1M5.6 18.4l2.1-2.1m8.6-8.6 2.1-2.1\"/></svg><span class=\"type\">Claude</span><span class=\"sr-only\"> agent, client </span><span class=\"stable-id\">CL-17</span></span>.</p>\n<details><summary><span>Validation and save-failure examples<span class=\"sr-only\"></span></span><svg class=\"chevron\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m9 6 6 6-6 6\"/></svg></summary><p class=\"error-copy\"><strong>Name not saved:</strong> Enter 1–32 characters after trimming spaces. The error stays beside the name field.</p><p class=\"error-copy\"><strong>Could not save appearance:</strong> Tawny / Iris remains the current appearance. Keep the unsaved field values available for a retry; do not claim they were saved.</p><p class=\"detail-copy\">If access to a client is revoked, remove it and its personal alias from this list. Move focus to the safe Connections heading without naming the removed client.</p></details>\n</section><section class=\"panel\"><h2>Keep your Notion workflow</h2><p class=\"body-copy\">Existing page creation and Hermes-to-Notion capture remain. Agents search when needed; reading, delivery, and useful reuse require separate evidence.</p></section><footer class=\"footer\">Illustrative snapshot · 5 Nov, Europe/Warsaw. No client connection is performed.</footer></main></div>\n</body>\n</html>\n"},{"label":"Promotion","file":"promotion.html","html":"<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>Owl Mast — Promotion</title><style>\n/* Governing spines: DESIGN.md Brand & Style, Colors, Typography, Layout & Spacing,\n   Components; EXPERIENCE.md S3/S4/S6, knowledge-record, delivery-receipt,\n   promotion-review, settings-field, state-message, SC-2 and SC-3.\n   Static reference only. Layout is a designer proposal under delegated visual judgment. */\n*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent}\nbody{font:14px/1.5 var(--font-sans,system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif);color:var(--foreground,var(--owl-text));-webkit-font-smoothing:antialiased}\nh1,h2,h3,p{margin:0}button,input,textarea{font:inherit}button,input,textarea,summary{touch-action:manipulation}\nbutton,input,textarea,summary,a{outline-offset:3px}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--ring,var(--owl-control-outline))}\n.study-note{margin:0 0 12px;color:var(--muted-foreground,var(--owl-secondary-text));font-size:14px}.study-note strong{font-weight:600;color:var(--foreground,var(--owl-text))}\n.app{--canvas:var(--background,var(--owl-canvas));--panel:var(--card,var(--owl-card));--ink:var(--foreground,var(--owl-text));--muted:var(--muted-foreground,var(--owl-secondary-text));--line:var(--border,var(--owl-divider));--nested:var(--secondary,var(--owl-secondary-surface));--accent:var(--primary,var(--owl-primary));--outline:var(--muted-foreground,var(--owl-secondary-text));--knowledge:var(--info,var(--owl-knowledge));--attention:var(--warning,var(--owl-attention));--positive:var(--success,var(--owl-success));color:var(--ink);background:var(--canvas);border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:1100px;margin: nel-head>div{min-width:0}.record-meta{color:var(--muted);margin-top:8px}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:1px solid var(--line);background:var(--nested);border-radius:6px;font-size:14px;line-height:1.5}.badge.knowledge{color:var(--knowledge)}.badge.attention{color:var(--attention)}.badge.success{color:var(--positive)}\n.note{background:var(--nested);border-radius:8px;padding:12px 14px;color:var(--ink)}.note p+p{margin-top:6px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.stack{display:grid;gap:12px}.twocol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.twocol>*{min-width:0}\nlabel{display:block;font-size:14px;font-weight:600;margin-bottom:6px}input,textarea{width:100%;min-width:0;min-height:44px;border:1px solid var(--outline);border-radius:8px;background:var(--panel);color:var(--ink);padding:10px 12px;font-size:16px}textarea{resize:vertical;min-height:82px}input[readonly],textarea[readonly]{cursor:default}.search{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.filter{display:inline-flex;align-items:center;min-height:44px;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px}.filter.selected{border-color:var(--outline);font-weight:600;color:var(--accent)}\nbutton{min-height:44px;min-width:44px;padding:10px 14px;border:1px solid var(--outline);border-radius:8px;background:var(--panel);color:var(--ink);font-weight:600;white-space:normal}button:disabled{opacity:1;cursor:not-allowed;color:var(--muted);background:var(--nested);border-style:dashed}.reason{color:var(--muted);margin-top:8px;font-size:14px}\ndetails{min-width:0}summary{min-height:44px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:10px;padding:10px 0;list-style:none}summary::-webkit-details-marker{display:none}.details-body{padding-top:8p
