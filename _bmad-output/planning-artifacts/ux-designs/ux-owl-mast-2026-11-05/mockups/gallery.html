d;grid-template-columns:100px minmax(0,1fr);gap:6px 12px}.mode .selected-label{grid-column:2;margin-top:0}.timeline li{grid-template-columns:1fr;gap:4px}.checks li{gap:12px;align-items:flex-start}.check-state{min-width:80px}.row>button{width:100%}}\n@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}\n\n/* Review fixes: identity is a non-status diamond; restricted provenance is gated at\n   the version boundary, not merely hidden behind a disclosure. Alternates are\n   separate permitted-view fixtures, never client-side authorization machinery. */\n.app{overflow:visible}.agent-chip{border-left:1px solid var(--line);flex-wrap:wrap;overflow-wrap:anywhere}.identity-marker{display:inline-block;width:9px;height:9px;flex:0 0 9px;transform:rotate(45deg);border-radius:1px;background:var(--identity-color,var(--identity-slate,var(--muted)));margin:0 2px}.type-glyph{width:16px;height:16px;display:block;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 16px}.agent-name{overflow-wrap:anywhere}summary::before,details[open]>summary::before{content:none}.disclosure-chevron{width:15px;height:15px;flex:0 0 15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}details[open]>summary .disclosure-chevron{transform:rotate(90deg)}.basis{font-size:14px;color:var(--muted);margin:8px 0 12px}.access-note{font-size:14px;line-height:1.6;margin-top:10px}.state-heading{font-size:18px;margin-bottom:6px}.dl-grid>div>p{margin-top:4px}.state-list{display:grid;gap:12px;margin-top:12px}.state-list>section{border:1px solid var(--line);border-radius:8px;padding:14px}.state-list h3{margin-bottom:7px}.section-links{display:flex;flex-wrap:wrap;gap:4px 16px;margin:12px 0}.section-links a,.return-link{display:inline-flex;align-items:center;min-height:44px}.filter.selected{border-bottom:3px solid var(--accent)}.entry-title{display:inline-flex;align-items:center;min-height:44px}.button-explanation{font-size:14px;margin-top:8px}.mode-change{border:1px solid var(--outline);border-radius:8px;padding:14px;margin-top:12px}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline-color:var(--ring,var(--owl-control-outline))}.checks li{flex-wrap:wrap}.check-state{overflow-wrap:anywhere}p,dd,h1,h2,h3,.badge{overflow-wrap:anywhere}.hidden-heading:focus{outline:3px solid var(--ring,var(--owl-control-outline));outline-offset:3px}@media(prefers-color-scheme:dark){button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline-color:var(--ring,var(--owl-control-outline))}}@media(forced-colors:active){.identity-marker{background:CanvasText}.badge,.filter,.agent-chip,.ticket-chip{border-color:CanvasText}.filter.selected,.mode.current{outline:2px solid Highlight}.disclosure-chevron{stroke:CanvasText}}\n</style><style id=\"owl-reference-theme\">:root{--owl-canvas:#F5F7FB;--owl-card:#FFFFFF;--owl-secondary-surface:#EAF0F8;--owl-text:#172337;--owl-secondary-text:#52627A;--owl-divider:#D7E0EC;--owl-control-outline:#74849B;--owl-primary:#2456D6;--owl-on-primary:#FFFFFF;--owl-knowledge:#086A7B;--owl-attention:#845900;--owl-success:#176B50;--owl-error:#B23549;--owl-identity-iris:#6B4CC2;--owl-identity-mulberry:#943B75;--owl-identity-clay:#8F4D40;--owl-identity-slate:#556579;color-scheme:light;--identity-iris:var(--owl-identity-iris);--identity-mulberry:var(--owl-identity-mulberry);--identity-clay:var(--owl-identity-clay);--identity-slate:var(--owl-identity-slate);}\n@media(prefers-color-scheme:dark){:root{--owl-canvas:#0B1018;--owl-card:#121A27;--owl-secondary-surface:#1B2738;--owl-text:#EAF1FA;--owl-secondary-text:#A5B5CB;--owl-divider:#2E3C50;--owl-control-outline:#73869E;--owl-primary:#91B5FF;--owl-on-primary:#0B1730;--owl-knowledge:#70D7E7;--owl-attention:#F0C268;--owl-success:#72D6AF;--owl-error:#FF95A5;--owl-identity-iris:#C4B0FF;--owl-identity-mulberry:#F0ADDA;--owl-identity-clay:#F0B5A8;--owl-identity-slate:#B7C8DD;color-scheme:dark;}}\nhtml[data-owl-theme=\"dark\"]{--owl-canvas:#0B1018;--owl-card:#121A27;--owl-secondary-surface:#1B2738;--owl-text:#EAF1FA;--owl-secondary-text:#A5B5CB;--owl-divider:#2E3C50;--owl-control-outline:#73869E;--owl-primary:#91B5FF;--owl-on-primary:#0B1730;--owl-knowledge:#70D7E7;--owl-attention:#F0C268;--owl-success:#72D6AF;--owl-error:#FF95A5;--owl-identity-iris:#C4B0FF;--owl-identity-mulberry:#F0ADDA;--owl-identity-clay:#F0B5A8;--owl-identity-slate:#B7C8DD;color-scheme:dark;}\nhtml[data-owl-theme=\"light\"]{--owl-canvas:#F5F7FB;--owl-card:#FFFFFF;--owl-secondary-surface:#EAF0F8;--owl-text:#172337;--owl-secondary-text:#52627A;--owl-divider:#D7E0EC;--owl-control-outline:#74849B;--owl-primary:#2456D6;--owl-on-primary:#FFFFFF;--owl-knowledge:#086A7B;--owl-attention:#845900;--owl-success:#176B50;--owl-error:#B23549;--owl-identity-iris:#6B4CC2;--owl-identity-mulberry:#943B75;--owl-identity-clay:#8F4D40;--owl-identity-slate:#556579;color-scheme:light;}\nhtml,body{background:transparent}body{color:var(--foreground,var(--owl-text));font-family:var(--font-sans,system-ui)}input,select,textarea{font-size:16px}input,select,textarea,button{max-width:100%}.app{overflow:visible}.agent-chip,.ticket-chip{border-radius:9999px;max-width:100%;overflow-wrap:anywhere}.agent-chip{background:var(--secondary,var(--owl-secondary-surface));border-color:var(--border,var(--owl-divider));color:var(--foreground,var(--owl-text))}.type-glyph{color:var(--foreground,var(--owl-text))}.agent-dot,.agent-marker,.identity-marker{width:9px;height:9px;flex:0 0 9px;border-radius:1px;transform:rotate(45deg)}p,dd,h1,h2,h3{overflow-wrap:anywhere}@media(forced-colors:active){[aria-current],[aria-pressed=\"true\"]{outline:2px solid Highlight}.agent-dot,.agent-marker,.identity-marker{background:CanvasText}}</style></head><body>\n<p class=\"study-note\"><strong>Illustrative fixtures.</strong> S6 exception outcomes, exact publication approval, mode changes, and lifecycle alternatives. No live source, policy, delivery, or permission changes. Alternate states replace the main view in the product; they are shown together here only for review.</p>\n<div class=\"app\"><header class=\"topbar\"><div class=\"brand\"><span class=\"brand-mark\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\"><path d=\"M4 5l3 2 5-1 5 1 3-2-1 11-7 4-7-4z\"/><path d=\"M7 11h3m4 0h3m-6 3 1 1 1-1\"/><path d=\"M12 2v3m0 16v1\"/></svg></span>Owl Mast</div><div class=\"workspace\">AISQUAD<span>Syntelligence · authorized example</span></div></header><nav class=\"nav\" aria-label=\"Workspace surfaces\"><span>Daily Work</span><span>Focus</span><span class=\"current\" aria-current=\"page\">Knowledge</span><span>Connections</span><span>Usage</span></nav><main>\n\n<header class=\"pagehead\"><p class=\"eyebrow\">Knowledge / Project policy</p><h1>Promotion</h1><p class=\"subtitle\">Review what may become company knowledge.</p></header><div class=\"scope\"><strong>Syntelligence</strong><span>Example viewer: project-designated knowledge maintainer with source access</span></div>\n<section aria-labelledby=\"mode-heading\"><h2 id=\"mode-heading\">Promotion mode</h2><div class=\"modes gap\"><div class=\"mode current\"><strong>Automatic</strong><p>Publish eligible versions after required checks.</p><span class=\"selected-label\">Current · preferred</span></div><div class=\"mode\"><strong>Manual approval</strong><p>A maintainer approves the exact publication version.</p></div><div class=\"mode\"><strong>Disabled</strong><p>No new company publications.</p></div></div><p class=\"reason\">Static policy example. A mode or maintainer designation grants neither source access nor permission to reuse customer content.</p></section>\n<h2 class=\"section-title\">1 publication exception</h2><p class=\"basis\">Counted from records you can access.</p>\n<article class=\"panel\"><div class=\"panel-head\"><div><p class=\"eyebrow mono\">CMP-K04 · v1 · candidate</p><h3>Verify the expected test suite</h3></div><span class=\"badge attention\">Not published</span></div><div class=\"badges\"><span class=\"badge knowledge\">Candidate access: Syntelligence source-authorized readers</span><span class=\"badge\">Use permission unresolved</span></div><p class=\"gap\"><strong>Exact proposed publication text</strong></p><div class=\"quote smallgap\">Before using a successful check as evidence, confirm that the expected test suite ran. Keep skipped or not-run checks separate from passed checks.</div><dl class=\"dl-grid gap\"><div><dt>Publication identity/version</dt><dd class=\"mono\">CMP-K04 · v1</dd></div><div><dt>Proposed audience</dt><dd>Explicitly permitted AISQUAD company-knowledge recipients</dd></div><div><dt>Policy version</dt><dd>Company-use policy · v1</dd></div><div><dt>Evaluating automation</dt><dd class=\"mono\">company-knowledge-policy · v1</dd></div><div><dt>Evaluation time</dt><dd>5 Nov, 09:15</dd></div><div><dt>Origin reference</dt><dd>Restricted to authorized source readers</dd></div></dl><p class=\"access-note\">CMP-K04 v1 is a separate publication record with its own exact text and version. It does not inherit the identity or approval of the source version. This preview itself requires authorization for its derived material.</p>\n<details class=\"gap\"><summary><svg class=\"disclosure-chevron\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"m6 3 5 5-5 5\"/></svg>Required checks · CMP-K04 v1 permission unresolved</summary><div class=\"details-body\"><ul class=\"checks\" aria-label=\"Publication checks\"><li><span>Provenance and reusable applicability</span><span class=\"check-state good-text\">Confirmed</span></li><li><span>Permitted audience and use</span><span class=\"check-state attention-text\">Unresolved</span></li><li><span>Restricted details and secrets in exact preview</span><span class=\"check-state good-text\">Check passed</span></li><li><span>Contradiction or withdrawal</span><span class=\"check-state good-text\">Check passed</span></li></ul><p class=\"smallgap\">Check reasons and evidence have the same source-derived-content restrictions as the candidate. No human decision bypasses a required check.</p></div></details>\n<p class=\"note gap\"><strong>Publication withheld.</strong> The candidate remains within its project/source restrictions. Permitted-use input must be supplied by its authorized owner before re-evaluation.</p>\n<details class=\"gap\"><summary><svg class=\"disclosure-chevron\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"m6 3 5 5-5 5\"/></svg>Resolve this exception · permitted outcomes</summary><div class=\"details-body\"><p>The project-designated knowledge maintainer can choose one bounded outcome after authorization is checked:</p><div class=\"state-list\"><section><h3>Keep project-scoped</h3><p>Record why company publication is not appropriate. Existing project-source restrictions remain in force.</p><button class=\"gap\" disabled>Record project-only outcome</button></section><section><h3>Correct the content</h3><p>Create a new candidate publication version; evaluate its exact text and audience again. Do not edit or silently approve the existing evaluated version.</p><button class=\"gap\" disabled>Create corrected version</button></section><section><h3>Request re-evaluation</h3><p>Use only after missing permission/policy evidence has been recorded by its authorized owner. A reviewer's preference cannot override a failed or unresolved check.</p><button class=\"gap\" disabled>Request re-evaluation after authorized input</button></section></div><p class=\"note gap\"><strong>Open dependency:</strong> the owner entitled to supply source-use permission is not established by this UX plan. A maintainer role alone does not confer that authority.</p><p class=\"reason\">All actions are disabled in this static reference. Each real outcome must record actor, version, reason, and time within permitted audit access.</p></div></details>\n<details class=\"gap\"><summary><svg class=\"disclosure-chevron\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"m6 3 5 5-5 5\"/></svg>Restricted origin and previous decisions</summary><div class=\"details-body\"><p><strong>Restricted origin:</strong> SYN-K07 v3, existing Hermes → Notion learning. Visible here only because the example maintainer may read the source material.</p><p><strong>Project evaluation:</strong> v3 was human-reviewed by Ahmed at 08:50. That is separate from company-use evaluation of CMP-K04 v1.</p><p><strong>09:15:</strong> company-knowledge-policy v1 withheld publication of CMP-K04 v1. Source/lineage restrictions and earlier withdrawal signals remain inputs to new evaluations.</p></div></details>\n</article>\n<details class=\"panel gap\"><summary><svg class=\"disclosure-chevron\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"m6 3 5 5-5 5\"/></svg>Alternate review state · maintainer without source access</summary><div class=\"details-body\"><h2 class=\"state-heading\">This review needs a maintainer with access to its source.</h2><p>No decision is recorded. The candidate remains project-scoped and source-restricted. This viewer receives no candidate title, body, origin identity, check reasons, evaluation basis, or restricted history.</p><p class=\"smallgap\">Maintainer designation alone does not authorize source content. Route to an authorized reviewer without exposing the hidden record; do not offer an approval override.</p></div></details>\n<details class=\"panel gap\"><summary><svg class=\"disclosure-chevron\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"m6 3 5 5-5 5\"/></svg>Alternate manual approval · exact publication identity</summary><div class=\"details-body\"><p class=\"alt-label\">Alternate snapshot · manual approval after all required checks</p><h2 class=\"state-heading\">Approve the publication version</h2><div class=\"badges\"><span class=\"badge mono\">CMP-K04 · v1</span><span class=\"badge knowledge\">Scope: Company publication candidate</span><span class=\"badge\">Manual approval</span></div><p class=\"gap\"><strong>Exact publication text to approve</strong></p><div class=\"quote smallgap\">Before using a successful check as evidence, confirm that the expected test suite ran. Keep skipped or not-run checks separate from passed checks.</div><p class=\"gap\"><strong>Audience:</strong> explicitly permitted AISQUAD company-knowledge recipients.</p><p class=\"smallgap\"><strong>Evaluation:</strong> company-use policy v1; provenance, applicability, audience/use, restricted-content, contradiction, and withdrawal checks confirmed for CMP-K04 v1 in this alternate snapshot.</p><div class=\"row gap\"><button disabled aria-describedby=\"manual-reason\">Approve CMP-K04 v1 for this audience</button><button disabled aria-describedby=\"manual-reason\">Keep project-scoped</button></div><p class=\"reason\" id=\"manual-reason\">Static study. Approval binds this exact publication text/version, audience, and policy, not the originating project version. Changed content, policy, audience, or authority requires new evaluation.</p></div></details>\n<details class=\"panel gap\"><summary><svg class=\"disclosure-chevron\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"m6 3 5 5-5 5\"/></svg>Alternate automatic success · published by policy</summary><div class=\"details-body\"><p class=\"alt-label\">Alternate snapshot · required checks passed, automatic publication succeeded</p><h2 class=\"state-heading\">Published by policy</h2><div class=\"badges\"><span class=\"badge mono\">CMP-K04 · v1</span><span class=\"badge knowledge\">Scope: Company</span><span class=\"badge success\">Published</span></div><div class=\"quote gap\">Before using a successful check as evidence, confirm that the expected test suite ran. Keep skipped or not-run checks separate from passed checks.</div><dl class=\"dl-grid gap\"><div><dt>Permitted audience</dt><dd>Explicitly permitted AISQUAD company-knowledge recipients</dd></div><div><dt>Published by automation</dt><dd class=\"mono\">company-knowledge-policy · v1</dd></div><div><dt>Policy version</dt><dd>Company-use policy · v1</dd></div><div><dt>Publication time</dt><dd>5 Nov, 10:00</dd></div></dl><p class=\"smallgap\">Checks and exact publication text/version are recorded. A company reader sees only the fields allowed in the company-reader detail; restricted origin, named source evaluator, check basis, and other-project receipts are not included.</p><a class=\"return-link\" href=\"knowledge-detail.html#company-reader\">View company-reader example</a></div></details>\n<details class=\"panel gap\"><summary><svg class=\"disclosure-chevron\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"m6 3 5 5-5 5\"/></svg>Mode-change confirmation · evaluate existing candidates</summary><div class=\"details-body\"><p class=\"alt-label\">Confirmation preview · Disabled → Automatic</p><h2 class=\"state-heading\">Enable automatic promotion for Syntelligence?</h2><p>Existing candidates and future eligible candidates will be evaluated under company-use policy v1. Passing versions may publish to <strong>explicitly permitted AISQUAD company-knowledge recipients</strong>. Required checks and source permissions still apply.</p><p class=\"smallgap\">Changing mode invalidates pending publication under the previous mode. No candidate publishes merely because the mode changed; an exact version/audience evaluation is required.</p><button class=\"gap\" disabled aria-describedby=\"enable-reason\">Enable Automatic and evaluate candidates</button><p class=\"reason\" id=\"enable-reason\">Static confirmation only. No setting, evaluation, or publication is performed.</p><p class=\"note gap\"><strong>Disabling alternative:</strong> stop new publication and invalidate pending automatic publication under the old mode. Whether existing published versions remain retrievable is A-4, still open; disabling is not presented as withdrawal.</p></div></details>\n<details class=\"panel gap\"><summary><svg class=\"disclosure-chevron\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"m6 3 5 5-5 5\"/></svg>Withdrawal, supersession, and system quarantine</summary><div class=\"details-body\"><p class=\"alt-label\">Separate authorized lifecycle action</p><h2 class=\"state-heading\">Withdraw CMP-K04 v1?</h2><p>The authorized maintainer confirms the exact publication version and reason. Owl Mast delivery stops; ordinary safety/permission-related views, feed entries, receipts, and notification returns use a neutral reference with no former title/body. Audit content requires separate authorization.</p><button class=\"gap\" disabled aria-describedby=\"withdraw-reason\">Withdraw CMP-K04 v1</button><p class=\"reason\" id=\"withdraw-reason\">Static action only. Earlier external copies/actions cannot be erased, and independent Notion/client access is governed separately.</p><h3 class=\"gap\">Supersede with a new evaluated publication</h3><p class=\"smallgap\">A replacement carries its own version, exact content, audience, and evaluation. A still-authorized older version may remain readable with a Superseded label; existing receipts show “since superseded.”</p><h3 class=\"gap\">Quarantined by the system</h3><p class=\"smallgap\">An example authorized audit entry records the exact affected version, system actor, reason, and time. Ordinary readers see only the neutral Quarantined state. Corrected content needs a new version and fresh evaluation; no bypass or automatic release is implied.</p><p class=\"note gap\">A-2 remains open for detailed withdrawal/quarantine retrieval and retention defaults; A-4 remains open for published versions after disabling. These states select no architecture.</p></div></details>\n<p class=\"note gap\">A-1–A-6 keep their original owners and revisit points. These fixtures do not settle delivery eligibility, collected-content defaults, retention, enrollment ceilings, or pilot proof requirements.</p>\n\n<footer class=\"footer\"><span>Example date · 5 Nov 2026 · Europe/Warsaw</span><span>Static study · no source changes</span></footer></main></div></body></html>"},{"label":"Usage and cost","file":"usage.html","html":"<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Owl Mast — Usage</title>\n<style>\n/* Governed by DESIGN: Brand & Style, Typography, Layout & Spacing, Components.\n   EXPERIENCE: S7, scope-bar, usage-breakdown, settings-field, state-message;\n   State Patterns S7; Usage semantics; J6 steps 1–4. The accepted key-focus shell\n   is retained. Host tokens illustrate, rather than validate, the exact palette.\n   All quantities, rates, source records, and mappings are illustrative fixtures. */\n* { box-sizing: border-box; }\nhtml, body { margin: 0; padding: 0; background: transparent; }\nbody { color: var(--foreground,var(--owl-text)); font: 14px/1.5 var(--font-sans, system-ui, sans-serif); -webkit-font-smoothing: antialiased; }\nh1, h2, h3, p, dl, dd { margin: 0; }\nstrong { font-weight: 600; }\nsvg { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }\n.study-note { margin-bottom: 12px; color: var(--muted-foreground,var(--owl-secondary-text)); }\n.study-note strong { color: var(--foreground,var(--owl-text)); }\n.app { overflow: hidden; border: 1px solid var(--border,var(--owl-divider)); border-radius: 14px; background: var(--background,var(--owl-canvas)); }\n.topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 24px; border-bottom: 1px solid var(--border,var(--owl-divider)); background: var(--card,var(--owl-card)); }\n.brand { display: flex; align-items: center; gap: 9px; font-size: 17px; font-weight: 700; letter-spacing: -.035em; }\n.brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--border,var(--owl-divider)); border-radius: 10px; color: var(--primary,var(--owl-primary)); background: var(--secondary,var(--owl-secondary-surface)); }\n.brand-mark svg { width: 24px; height: 24px; stroke-width: 1.8; }\n.workspace { text-align: right; font-weight: 600; }\n.workspace span { display: block; font-weight: 400; color: var(--muted-foreground,var(--owl-secondary-text)); }\n.nav { display: flex; align-items: center; gap: 24px; min-height: 48px; padding: 0 24px; border-bottom: 1px solid var(--border,var(--owl-divider)); color: var(--muted-foreground,var(--owl-secondary-text)); }\n.nav span { display: flex; align-items: center; min-height: 48px; }\n.nav [aria-current] { font-weight: 600; color: var(--foreground,var(--owl-text)); border-bottom: 2px solid var(--primary,var(--owl-primary)); }\nmain { padding: 24px; }\nh1 { font-size: 28px; line-height: 1.2; font-weight: 650; letter-spacing: -.025em; }\nh2 { font-size: 18px; line-height: 1.4; font-weight: 600; letter-spacing: -.015em; }\nh3 { font-size: 14px; font-weight: 600; }\n.subtitle { margin-top: 7px; color: var(--muted-foreground,var(--owl-secondary-text)); }\n.scope { padding: 12px 16px; background: var(--secondary,var(--owl-secondary-surface)); border-radius: 8px; margin-top: 20px; }\n.scope p + p { margin-top: 3px; }\n.muted { color: var(--muted-foreground,var(--owl-secondary-text)); }\n.id { font-family: var(--font-mono, ui-monospace, monospace); }\n.ticket-chip { display: inline-flex; align-items: center; min-height: 28px; padding: 2px 8px; border: 1px solid var(--border,var(--owl-divider)); border-radius: 6px; background: var(--secondary,var(--owl-secondary-surface)); color: var(--foreground,var(--owl-text)); font: 600 14px/1.5 var(--font-mono, ui-monospace, monospace); vertical-align: middle; }\n.agent-chip { --chip-accent: var(--primary,var(--owl-primary)); display: inline-flex; align-items: center; flex-wrap: wrap; gap: 5px; min-height: 30px; padding: 3px 8px; border: 1px solid color-mix(in srgb, var(--chip-accent) 40%, var(--border,var(--owl-divider))); border-radius: 8px; background: color-mix(in srgb, var(--chip-accent) 8%, var(--card,var(--owl-card))); color: var(--foreground,var(--owl-text)); font-size: 14px; vertical-align: middle; }\n.agent-chip.snowy { --chip-accent: var(--identity-mulberry); }\n.agent-chip .alias { font-weight: 600; }\n.type-mark { width: 16px; height: 16px; stroke-width: 1.6; color: var(--chip-accent); }\n.metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }\n.metric { min-width: 0; padding: 16px; border: 1px solid var(--border,var(--owl-divider)); border-radius: 12px; background: var(--card,var(--owl-card)); }\n.metric dt { font-weight: 600; }\n.metric dd { margin-top: 8px; font-size: 25px; line-height: 1.25; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.025em; }\n.metric .unavailable { font-size: 20px; }\n.metric p { margin-top: 8px; color: var(--muted-foreground,var(--owl-secondary-text)); }\n.panel { margin-top: 20px; border: 1px solid var(--border,var(--owl-divider)); border-radius: 12px; padding: 16px; background: var(--card,var(--owl-card)); }\n.compact-note { margin-top: 12px; color: var(--muted-foreground,var(--owl-secondary-text)); }\n.toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: end; margin-top: 16px; }\nlabel { display: block; margin-bottom: 5px; }\nselect { width: 100%; min-height: 44px; padding: 8px 12px; font: inherit; color: var(--foreground,var(--owl-text)); background: var(--card,var(--owl-card)); border: 1px solid var(--muted-foreground,var(--owl-secondary-text)); border-radius: 8px; }\nselect:disabled { opacity: 1; color: var(--muted-foreground,var(--owl-secondary-text)); -webkit-text-fill-color: var(--muted-foreground,var(--owl-secondary-text)); cursor: not-allowed; }\n.work-row { margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border,var(--owl-divider)); }\n.row-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; }\n.row-head strong { font-variant-numeric: tabular-nums; }\n.work-row > p { margin-top: 4px; color: var(--muted-foreground,var(--owl-secondary-text)); }\n.bar { height: 5px; margin-top: 10px; border-radius: 6px; background: var(--secondary,var(--owl-secondary-surface)); overflow: hidden; }\n.bar span { display: block; width: var(--share); height: 100%; background: var(--primary,var(--owl-primary)); }\n.bar.unassigned span { background: var(--muted-foreground,var(--owl-secondary-text)); }\ndetails { margin-top: 10px; }\nsummary { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 8px 0; cursor: pointer; font-weight: 600; list-style: none; }\nsummary::-webkit-details-marker { display: none; }\nsummary::after { content: '+'; font-size: 20px; font-weight: 400; flex-shrink: 0; }\ndetails[open] > summary::after { content: '−'; }\nsummary:focus-visible { outline: 3px solid var(--ring,var(--owl-control-outline)); outline-offset: 3px; border-radius: 4px; }\n.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; padding: 8px 0 12px; }\n.fields > div { min-width: 0; }\n.fields dt { color: var(--muted-foreground,var(--owl-secondary-text)); margin-bottom: 3px; }\n.fields dd { overflow-wrap: anywhere; }\n.method { margin: 5px 0 12px; padding: 12px; background: var(--secondary,var(--owl-secondary-surface)); border-radius: 8px; }\n.method p + p { margin-top: 8px; }\n.disclosure { padding-top: 0; padding-bottom: 0; }\n.disclosure > details { margin: 0; }\n.disclosure > details > summary { min-height: 54px; }\n.footer { margin-top: 18px; color: var(--muted-foreground,var(--owl-secondary-text)); }\n.alternate { margin-top: 18px; padding: 16px; border: 1px dashed var(--border,var(--owl-divider)); border-radius: 12px; background: var(--card,var(--owl-card)); }\n.alternate h2 { font-size: 16px; margin: 4px 0 8px; }\n.alternate p + p { margin-top: 6px; }\n@media (max-width: 599px) {\n .topbar { padding: 14px 16px; gap: 12px; align-items: flex-start; }\n .brand { font-size: 16px; }\n .workspace { max-width: 130px; }\n .nav { gap: 20px; padding: 0 16px; }\n main { padding: 20px 16px; }\n h1 { font-size: 25px; }\n .metrics, .toolbar, .fields { grid-template-columns: 1fr; }\n .metric, .panel { padding: 14px; }\n .disclosure { padding-top: 0; padding-bottom: 0; }\n .scope { padding: 12px; }\n}\n\n/* Reviewer corrections: operational 14px floor; 16px fields; safe personal identity;\n   native disclosures; readable reflow; fixed type glyphs. No runtime integration. */\n.app,.project-panel{overflow:visible}.topbar{border-radius:12px 12px 0 0}.nav,.brand,.row-head,.agent-line,.client-head,.client-chiprow{flex-wrap:wrap}.brand{white-space:normal}.nav{gap:8px 20px}\nbody{overflow-wrap:anywhere}.meta,.workspace,.workspace span,.eyebrow,.readiness-time,.notification-state-label,.footer,.study-note{font-size:14px}\ninput,select,.field input[type=text],.field select{font-size:16px}button,input,select,summary,a{touch-action:manipulation}\na{color:var(--primary,var(--owl-primary));text-underline-offset:3px}a.local-link{display:inline-flex;align-items:center;min-height:44px;padding:8px 4px;gap:8px}\nsummary:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--ring,var(--owl-control-outline));outline-offset:3px}\nsummary::after{content:none!important}summary{gap:10px;min-height:44px}summary>span{min-width:0}.chevron{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.7}details[open]>summary .chevron{transform:rotate(90deg)}\n.agent-chip{display:inline-flex;align-items:center;flex-wrap:wrap;gap:6px;max-width:100%;padding:6px 9px;border:1px solid var(--border,var(--owl-divider));border-radius:999px;background:var(--secondary,var(--owl-secondary-surface));color:var(--foreground,var(--owl-text));font-size:14px;line-height:1.5;vertical-align:middle;overflow-wrap:anywhere}.agent-chip .alias{font-weight:600;overflow-wrap:anywhere;max-width:100%}.agent-chip .type,.stable-id{color:var(--muted-foreground,var(--owl-secondary-text));font-size:14px}.stable-id{font-family:var(--font-mono,monospace)}.agent-marker{width:8px;height:8px;flex-shrink:0;transform:rotate(45deg);border:1px solid var(--identity-color,CanvasText);background:var(--identity-color,CanvasText);margin:0 3px}.type-glyph{display:block;width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:var(--muted-foreground,var(--owl-secondary-text))}\n.ticket-chip{max-width:100%;overflow-wrap:anywhere}.scope-basis{margin:10px 0;color:var(--foreground,var(--owl-text));font-size:14px}.section-links{display:flex;gap:0 16px;flex-wrap:wrap;margin:10px 0}.section-links a{min-height:44px;display:inline-flex;align-items:center}.facts dd p,.metrics dd p{font-size:14px;font-weight:400;letter-spacing:normal;line-height:1.5}\n.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.bar span,.bar.unassigned span{background:var(--primary,var(--owl-primary))}\nfieldset{min-width:0;border:1px solid var(--border,var(--owl-divider));border-radius:8px;padding:12px;margin:12px 0}legend{font-size:14px;font-weight:600;padding:0 6px}.check-label{min-height:44px}.help{margin-top:8px;font-size:14px}.error-copy{color:var(--foreground,var(--owl-text));border-left:3px solid var(--destructive,var(--owl-error));padding-left:10px;margin:12px 0}.list{padding-left:20px;margin:12px 0}.list li+li{margin-top:6px}.fixture-state{margin-top:18px;padding:16px;border:1px dashed var(--border,var(--owl-divider));border-radius:12px}.fixture-state h1,.fixture-state h2{margin:8px 0}.arrival-shell{border:1px solid var(--border,var(--owl-divider));border-radius:12px;padding:16px;margin-top:16px;background:var(--card,var(--owl-card))}.arrival-shell p+p{margin-top:8px}.receipt-note{margin-top:10px}.totals dd{font-variant-numeric:tabular-nums}\n@media(max-width:599px){.row-head,.facts,.fields,.toolbar,.metrics,.client-grid,.split{display:grid;grid-template-columns:1fr}.row-head{gap:6px}.source-row,.definition-row{grid-template-columns:1fr}.workspace,.workspace span{font-size:14px}.topbar{align-items:flex-start}.nav{flex-wrap:wrap}.work-row{min-width:0}.agent-chip{max-width:100%}.app{overflow:visible}}\n@media(forced-colors:active){.agent-marker{background:CanvasText;border:1px solid CanvasText}.bar span,.progress-track span{background:Highlight}.ticket-chip,.agent-chip{border:1px solid CanvasText}.nav [aria-current]{outline:2px solid Highlight;outline-offset:-2px}}\n.skip-link{position:absolute;left:12px;top:-200px;z-index:5;padding:10px;background:var(--card,var(--owl-card));color:var(--foreground,var(--owl-text))}.skip-link:focus{top:12px}\n</style>\n<style id=\"owl-reference-theme\">:root{--owl-canvas:#F5F7FB;--owl-card:#FFFFFF;--owl-secondary-surface:#EAF0F8;--owl-text:#172337;--owl-secondary-text:#52627A;--owl-divider:#D7E0EC;--owl-control-outline:#74849B;--owl-primary:#2456D6;--owl-on-primary:#FFFFFF;--owl-knowledge:#086A7B;--owl-attention:#845900;--owl-success:#176B50;--owl-error:#B23549;--owl-identity-iris:#6B4CC2;--owl-identity-mulberry:#943B75;--owl-identity-clay:#8F4D40;--owl-identity-slate:#556579;color-scheme:light;--identity-iris:var(--owl-identity-iris);--identity-mulberry:var(--owl-identity-mulberry);--identity-clay:var(--owl-identity-clay);--identity-slate:var(--owl-identity-slate);}\n@media(prefers-color-scheme:dark){:root{--owl-canvas:#0B1018;--owl-card:#121A27;--owl-secondary-surface:#1B2738;--owl-text:#EAF1FA;--owl-secondary-text:#A5B5CB;--owl-divider:#2E3C50;--owl-control-outline:#73869E;--owl-primary:#91B5FF;--owl-on-primary:#0B1730;--owl-knowledge:#70D7E7;--owl-attention:#F0C268;--owl-success:#72D6AF;--owl-error:#FF95A5;--owl-identity-iris:#C4B0FF;--owl-identity-mulberry:#F0ADDA;--owl-identity-clay:#F0B5A8;--owl-identity-slate:#B7C8DD;color-scheme:dark;}}\nhtml[data-owl-theme=\"dark\"]{--owl-canvas:#0B1018;--owl-card:#121A27;--owl-secondary-surface:#1B2738;--owl-text:#EAF1FA;--owl-secondary-text:#A5B5CB;--owl-divider:#2E3C50;--owl-control-outline:#73869E;--owl-primary:#91B5FF;--owl-on-primary:#0B1730;--owl-knowledge:#70D7E7;--owl-attention:#F0C268;--owl-success:#72D6AF;--owl-error:#FF95A5;--owl-identity-iris:#C4B0FF;--owl-identity-mulberry:#F0ADDA;--owl-identity-clay:#F0B5A8;--owl-identity-slate:#B7C8DD;color-scheme:dark;}\nhtml[data-owl-theme=\"light\"]{--owl-canvas:#F5F7FB;--owl-card:#FFFFFF;--owl-secondary-surface:#EAF0F8;--owl-text:#172337;--owl-secondary-text:#52627A;--owl-divider:#D7E0EC;--owl-control-outline:#74849B;--owl-primary:#2456D6;--owl-on-primary:#FFFFFF;--owl-knowledge:#086A7B;--owl-attention:#845900;--owl-success:#176B50;--owl-error:#B23549;--owl-identity-iris:#6B4CC2;--owl-identity-mulberry:#943B75;--owl-identity-clay:#8F4D40;--owl-identity-slate:#556579;color-scheme:light;}\nhtml,body{background:transparent}body{color:var(--foreground,var(--owl-text));font-family:var(--font-sans,system-ui)}input,select,textarea{font-size:16px}input,select,textarea,button{max-width:100%}.app{overflow:visible}.agent-chip,.ticket-chip{border-radius:9999px;max-width:100%;overflow-wrap:anywhere}.agent-chip{background:var(--secondary,var(--owl-secondary-surface));border-color:var(--border,var(--owl-divider));color:var(--foreground,var(--owl-text))}.type-glyph{color:var(--foreground,var(--owl-text))}.agent-dot,.agent-marker,.identity-marker{width:9px;height:9px;flex:0 0 9px;border-radius:1px;transform:rotate(45deg)}p,dd,h1,h2,h3{overflow-wrap:anywhere}@media(forced-colors:active){[aria-current],[aria-pressed=\"true\"]{outline:2px solid Highlight}.agent-dot,.agent-marker,.identity-marker{background:CanvasText}}</style></head>\n<body><a class=\"skip-link local-link\" href=\"#main-content\">Skip to content</a>\n\n<p class=\"study-note\"><strong>Illustrative data.</strong> Usage study. Quantities and rates are fixtures, not current provider prices or actual project measurements.</p>\n<div class=\"app\">\n <header class=\"topbar\"><div class=\"brand\"><span class=\"brand-mark\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\"><path d=\"M4 5l3 2 5-1 5 1 3-2-1 11-7 4-7-4z\"/><path d=\"M7 11h3m4 0h3m-6 3 1 1 1-1\"/><path d=\"M12 2v3m0 16v1\"/></svg></span>Owl Mast</div><div class=\"workspace\">AISQUAD<span>Syntelligence</span></div></header>\n <nav class=\"nav\" aria-label=\"Workspace surfaces\"><span>Daily Work</span><span>Focus</span><span aria-current=\"page\">Usage</span></nav>\n <main id=\"main-content\" tabindex=\"-1\"><nav aria-label=\"Related views\" style=\"display:flex;flex-wrap:wrap;gap:8px 18px;margin-bottom:14px\"><a style=\"display:inline-flex;align-items:center;min-height:44px;font-size:14px\" href=\"knowledge-usage.html\">Skill and memory statistics</a></nav>\n  <h1 id=\"usage-heading\" tabindex=\"-1\">Understand the usage</h1><p class=\"subtitle\">Observed consumption, with its evidence and gaps.</p>\n  <div class=\"scope\"><p><strong>Syntelligence</strong> · Syntelligence Jira site + GitHub</p><p>5 Nov, 00:00–08:42 Europe/Warsaw · Claude + Codex records</p></div>\n\n  <p class=\"scope-basis\">Counted from records you can access.</p><p>Only measurement classes you are authorized to see are included. No allocation basis exposes another project’s share.</p><nav class=\"section-links\" aria-label=\"Usage sections\"><a href=\"#breakdown-title\">Work attribution</a><a href=\"#measurement-evidence\">Calculation and coverage</a></nav><dl class=\"metrics\">\n   <div class=\"metric\"><dt>Observed units</dt><dd>1.60M tokens<p>1.40M input + 0.20M output<br>6 observed sessions</p></dd></div>\n   <div class=\"metric\"><dt>API-equivalent estimate</dt><dd>$7.20 <span style=\"font-size:14px;font-weight:400\">USD</span><p>1.20M tokens priced · 0.40M unpriced<br>Illustrative schedule · 5 Nov</p></dd></div>\n   <div class=\"metric\"><dt>Subscription allocation</dt><dd class=\"unavailable\">Not allocated<p>No allocation basis recorded for this project and period.</p></dd></div>\n   <div class=\"metric\"><dt>Actual bill</dt><dd class=\"unavailable\">Unavailable<p>No billing evidence connected. The estimate above is not a charge.</p></dd></div>\n  </dl>\n  <p class=\"compact-note\">0.90M cached-read tokens are already included in input. Missing usage is not counted as zero.</p>\n  <p><a class=\"local-link\" href=\"run-history.html\">Inspect a separate ticket-linked run-history example</a></p><p class=\"compact-note\">That example shows model, effort, source session ID, machine and tokens IN/OUT per task. Its figures are a separate dataset and are not included in this screen’s totals.</p>\n\n  <section class=\"panel\" aria-labelledby=\"breakdown-title\">\n   <h2 id=\"breakdown-title\" tabindex=\"-1\">Usage awaiting work attribution</h2>\n   <details><summary><span>View options · Attribution status / both clients</span><svg class=\"chevron\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m9 6 6 6-6 6\"/></svg></summary><div class=\"toolbar\"><div><label for=\"group\">Breakdown</label><select id=\"group\" disabled aria-describedby=\"fixed-controls\"><option>Attribution status</option></select></div><div><label for=\"client\">Client</label><select id=\"client\" disabled aria-describedby=\"fixed-controls\"><option>Claude + Codex</option></select></div></div><p class=\"compact-note\" id=\"fixed-controls\">Selections are fixed in this static preview. Expand a row to inspect its example evidence.</p></details>\n\n   <article class=\"work-row\"><div class=\"row-head\"><h3>Shared session · work allocation unavailable</h3><strong>0.60M tokens · 37.5%</strong></div><p class=\"scope-basis\">Counted from records you can access.</p><div class=\"bar\" aria-hidden=\"true\"><span style=\"--share:37.5%\"></span></div><p>$3.60 API-equivalent estimate · kept unassigned to a work item</p><p><span class=\"agent-chip\" style=\"--identity-color:var(--identity-iris, CanvasText)\"><span class=\"agent-marker\" aria-hidden=\"true\"></span><span class=\"alias\">Tawny</span><span class=\"sr-only\">, </span><svg class=\"type-glyph\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1M5.6 18.4l2.1-2.1m8.6-8.6 2.1-2.1\"/></svg><span class=\"type\">Claude</span><span class=\"sr-only\"> agent, client </span><span class=\"stable-id\">CL-17</span></span></p><details><summary><span>Inspect shared-session attribution<span class=\"sr-only\"> for CL-17, session R-17</span></span><svg class=\"chevron\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m9 6 6 6-6 6\"/></svg></summary><dl class=\"fields\"><div><dt>Client / session</dt><dd>CL-17 / R-17</dd></div><div><dt>Initiating person</dt><dd>Ahmed · confirmed session record</dd></div><div><dt>Permitted linked work</dt><dd><span class=\"ticket-chip\">SYN-42</span> + <span class=\"ticket-chip\">SYN-67</span></dd></div><div><dt>Allocation evidence</dt><dd>No supported split between those work items. All 0.60M tokens and $3.60 remain unassigned; neither ticket receives the full session amount.</dd></div></dl><p>These links are visible because the viewer may read both. Otherwise no shared marker or hidden work reference would appear.</p></details></article>\n<article class=\"work-row\"><div class=\"row-head\"><h3>Unlinked client usage</h3><strong>0.40M tokens · 25%</strong></div><p class=\"scope-basis\">Counted from records you can access.</p><div class=\"bar\" aria-hidden=\"true\"><span style=\"--share:25%\"></span></div><p>$2.40 API-equivalent estimate · no supported work-item mapping</p><p><span class=\"agent-chip\" style=\"--identity-color:var(--identity-mulberry, CanvasText)\"><span class=\"agent-marker\" aria-hidden=\"true\"></span><span class=\"alias\">Snowy</span><span class=\"sr-only\">, </span><svg class=\"type-glyph\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m8 6-5 6 5 6m8-12 5 6-5 6m-3-14-2 16\"/></svg><span class=\"type\">Codex</span><span class=\"sr-only\"> agent, client </span><span class=\"stable-id\">CX-16</span></span></p><details><summary><span>Inspect unlinked attribution<span class=\"sr-only\"> for CX-16, session R-16</span></span><svg class=\"chevron\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m9 6 6 6-6 6\"/></svg></summary><dl class=\"fields\"><div><dt>Client / session</dt><dd>CX-16 / R-16</dd></div><div><dt>Initiating person</dt><dd>Ahmed · confirmed session record</dd></div><div><dt>Model</dt><dd>Recorded model B · illustrative label</dd></div><div><dt>Work item</dt><dd>Unknown. A person, client, or nearby timestamp does not establish a ticket link.</dd></div></dl></details></article>\n<article class=\"work-row\"><div class=\"row-head\"><h3>Other unassigned work</h3><strong>0.60M tokens · 37.5%</strong></div><p class=\"scope-basis\">Counted from records you can access.</p><div class=\"bar\" aria-hidden=\"true\"><span style=\"--share:37.5%\"></span></div><p>$1.20 estimate for 0.20M tokens · 0.40M remain unpriced</p><details><summary><span>Inspect remaining attribution gaps<span class=\"sr-only\"></span></span><svg class=\"chevron\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m9 6 6 6-6 6\"/></svg></summary><p>These authorized project records have no supported work mapping. One session has no model label, usable price mapping, or confirmed person association. Units remain counted without inventing a ticket, owner, or price.</p></details></article><p class=\"compact-note\">All 1.60M observed tokens remain unassigned to individual work items. Bars partition authorized observed records once; no people ranking or inaccessible-source residual is shown.</p>\n  </section>\n\n  <section class=\"panel disclosure\" aria-label=\"Dimensions and measurement evidence\" id=\"measurement-evidence\" tabindex=\"-1\"><details><summary><span>Dimensions, calculation, and coverage</span><svg class=\"chevron\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m9 6 6 6-6 6\"/></svg></summary><p>Supported dimensions in this example: project, client, model, agent, person, session, and work item. Unknown values stay visible within each breakdown.</p><div class=\"method\"><p><strong>Estimate basis:</strong> 1.05M priced input tokens × $4/M + 0.15M priced output tokens × $20/M = $7.20. Illustrative schedule dated 5 Nov 2026; these are not vendor rates.</p><p><strong>Unpriced:</strong> 0.35M input + 0.05M output have no usable price mapping. They are excluded from the estimate, included in observed units.</p><p><strong>Counting:</strong> cached reads are a subset of input, counted once. Shared session appearances do not create extra sessions or tokens.</p></div><p class=\"muted\">Latest received client event: 08:40. Last successful collection: 08:42. This scope includes only permitted Syntelligence records. No other project identity or usage is disclosed.</p><p class=\"compact-note\">Source records and rates are fixed examples. This screen does not validate connectors, bills, source coverage, or economic return.</p></details></section>\n  <p class=\"footer\">Usage describes consumption. It does not measure a person's productivity or the value of delivered work.</p>\n </main>\n</div>\n<section class=\"alternate\" aria-labelledby=\"alternate-title\"><p class=\"muted\">Alternate state · partial collection</p><h2 id=\"alternate-title\">Codex collection is delayed.</h2><p>Last successful collection: 08:20. Keep received, authorized data and label totals incomplete; unavailable records are not zero.</p><p class=\"muted\">The gap concerns collection, not agent health. If source access cannot be checked, withhold its records and totals rather than expose cached detail.</p></section>\n\n</body>\n</html>\n"},{"label":"Administrator setup","file":"administrator-setup.html","html":"<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"widt olors:active){[aria-current],[aria-pressed=\"true\"]{outline:2px solid Highlight}.agent-dot,.agent-marker,.identity-marker{background:CanvasText}}</style></head><body><a class=\"skip-link local-link\" href=\"#main-content\">Skip to content</a>\n<p class=\"study-note\" id=\"study-note\"><strong>Illustrative data.</strong> Static fixture. Settings and source actions are disabled; disclosures and local reference links work. No integration or preference changes occur.</p><div class=\"app\"><header class=\"topbar\"><div class=\"brand\"><span class=\"brand-mark\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\"><path d=\"M4 5l3 2 5-1 5 1 3-2-1 11-7 4-7-4z\"/><path d=\"M7 11h3m4 0h3m-6 3 1 1 1-1\"/><path d=\"M12 2v3m0 16v1\"/></svg></span>Owl Mast</div><div class=\"workspace\">AISQUAD<span>Ahmed · Preferences</span></div></header><nav class=\"nav\" aria-label=\"Location\"><span aria-current=\"page\">Preferences</span></nav><main id=\"main-content\" tabindex=\"-1\"><div class=\"pagehead\"><h1 id=\"preferences-heading\" tabindex=\"-1\">Stay in the loop</h1><p class=\"intro\">Every observed work update triggers push by default. Updates also remain in Daily Work.</p></div><div class=\"split\"><section class=\"panel\" aria-labelledby=\"updates-heading\"><h2 id=\"updates-heading\">Work notifications</h2><p class=\"body-copy\">Includes authorized connected work beyond your assignments. There is no attention-only or category filter on this default.</p><fieldset><legend>Followed project scope</legend><label class=\"check-label\"><input id=\"follow-syn\" type=\"checkbox\" checked disabled aria-describedby=\"study-note\">Syntelligence</label><label class=\"check-label\"><input id=\"follow-mov\" type=\"checkbox\" checked disabled aria-describedby=\"study-note\">Movesion</label><p>Following never expands record-level source access.</p></fieldset><div class=\"permission-state\"><strong>Push not requested</strong><span class=\"meta\">Device permission</span></div><p class=\"body-copy small-gap\">Allow notifications for permitted work updates. The device may ask for permission.</p><div class=\"action-row\"><button type=\"button\" class=\"button\" disabled aria-describedby=\"study-note\">Enable push notifications</button></div></section><section class=\"panel\" aria-labelledby=\"preview-heading\"><h2 id=\"preview-heading\">Notification preview</h2><p class=\"body-copy\">Generic preview is the designer-proposed default. No richer preview is configured.</p><div class=\"notification-preview\"><p class=\"meta\">OWL MAST · 08:32</p><h3>Owl Mast has an update</h3><p>Open to view the current permitted state.</p><a class=\"local-link\" href=\"#arrival-heading\">Open illustrative 08:32 update</a></div><div class=\"field small-gap\"><label for=\"appearance\">Appearance</label><select id=\"appearance\" disabled aria-describedby=\"study-note\"><option>Follow system appearance</option><option>Light</option><option>Dark</option></select></div></section></div>\n<section class=\"panel\" aria-labelledby=\"events-heading\"><h2 id=\"events-heading\">What counts as a work update</h2><p class=\"body-copy\">Illustrative event contract: every permitted distinct event below triggers push and stays in the feed.</p><ul class=\"list\"><li><strong>Tracker changes:</strong> new work, assignment, status, epic membership, and acceptance-criteria or checklist changes.</li><li><strong>Attention:</strong> observed blockers and requests for input.</li><li><strong>Agent observation:</strong> observed agent-state changes.</li><li><strong>Contribution and evidence:</strong> pull-request, check-result, and merge events.</li></ul><p class=\"help\"><strong>Separate proposed default-on notices:</strong> knowledge lifecycle and delivery events, and connection failure or recovery. These are additional notice classes; they do not narrow the every-work-update default. Any category preference must leave the default work-event set intact unless the user explicitly changes that policy.</p><p>Before sending anything, verify this recipient’s access to the source record. An unauthorized or unverifiable event produces no push, including no generic push, and no feed entry. This is permission enforcement, not throttling.</p><p class=\"help\">Distinct events retain distinct notification identities; only replayed copies deduplicate. Platform stacking must not discard updates. Denied or unsupported push leaves authorized in-app updates usable.</p></section>\n<section class=\"arrival-shell\" aria-labelledby=\"arrival-heading\"><p class=\"notification-state-label\">Destination example · S2 Work evidence</p><a class=\"local-link\" href=\"#safe-work-heading\">Back to Daily Work</a><h1 id=\"arrival-heading\" tabindex=\"-1\">Define account rollout rules</h1><p class=\"status success\">The observed request is now resolved.</p><p>Opened from the 08:32 notification · current source event 09:16 · collected 09:18.</p><p><span class=\"ticket-chip\">SYN-42</span> · Syntelligence · Syntelligence Jira site</p><p>Request text is not collected under this project’s policy. Permitted metadata records that no further input is requested; no transcript is displayed.</p><a class=\"local-link\" href=\"#safe-work-heading\">Other updates since 08:32</a><p class=\"body-copy\">The local link focuses this destination heading. Production routing updates the page title and moves focus here; a previous location is restored when available, otherwise the safe Daily Work destination below is used.</p></section>\n<section class=\"fixture-state\" aria-labelledby=\"unavailable-heading\"><p class=\"notification-state-label\">Alternate destination · unavailable</p><h2 id=\"unavailable-heading\" tabindex=\"-1\">This item is unavailable.</h2><p>Return to your work.</p><a class=\"local-link\" href=\"#safe-work-heading\">Return to Daily Work</a></section>\n<section class=\"fixture-state\" aria-labelledby=\"withdrawn-heading\"><p class=\"notification-state-label\">Alternate destination · since withdrawn</p><h2 id=\"withdrawn-heading\" tabindex=\"-1\">This item is unavailable.</h2><p>The previously delivered guidance has since been withdrawn. Its former title, body, origin, and task context are not shown.</p><a class=\"local-link\" href=\"#safe-work-heading\">Return to Daily Work</a></section>\n<section class=\"arrival-shell\" aria-labelledby=\"safe-work-heading\"><p class=\"notification-state-label\">Safe return example · S1</p><h2 id=\"safe-work-heading\" tabindex=\"-1\">Daily Work</h2><p>Syntelligence · current authorized project scope.</p><p>Updates since 08:32. Counted from records you can access.</p><p class=\"body-copy\">This neutral return does not name the unavailable target. Your currently permitted work remains available.</p><a class=\"local-link\" href=\"daily-work.html\">Open the full Daily Work reference</a><a class=\"local-link\" href=\"#preferences-heading\">Back to notification preferences</a></section><footer class=\"footer\">Illustrative states only. No device subscription, notification, or schedule is created. Push arrival and production routing remain to be validated.</footer></main></div>\n</body>\n</html>\n"},{"label":"Navigation and company overview","file":"navigation.html","html":"<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Owl Mast — Company overview and navigation</title><style>\n*{box-sizing:border-box}html,body{background:transparent;margin:0;padding:0}body{font:16px/1.5 var(--font-sans,system-ui);color:var(--foreground,var(--owl-text))}p,h1,h2,h3{margin:0}a{color:var(--primary,var(--owl-primary));text-underline-offset:3px}a,summary,button,select{min-height:44px}a{display:inline-flex;align-items:center}button,select{font:inherit}a:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid var(--ring,var(--owl-control-outline));outline-offset:2px}.note{font-size:14px;color:var(--muted-foreground,var(--owl-secondary-text));margin-bottom ly-work.html\">Open Syntelligence work</a></section><section class=\"card\" data-project=\"mov\"><h2>Movesion</h2><p class=\"caption\">Movesion Jira + Bitbucket</p><p class=\"metric\">2 of 6 child tickets closed</p><p>Fleet reconciliation · last verified permitted child set. Current coverage incomplete.</p><p><span class=\"pill\">2 known agent clients</span> Current activity unverified</p><p class=\"attention\">Jira authorization expired · no current all-clear</p><p class=\"caption\">Last successful Jira collection 07:55 · illustrative</p><a href=\"connections.html\">Inspect connection readiness</a></section><section class=\"card span\"><h2>Company knowledge</h2><p class=\"knowledge\">CMP-K04 · v1 · Company-approved</p><p>Before using a successful check as evidence, confirm that the expected test suite ran. Keep skipped or not-run checks separate from passed checks.</p><p class=\"caption\">Automatically evaluated under the displayed policy. Origin and other projects’ receipts require separate access.</p><div class=\"linkrow\"><a href=\"knowledge-detail.html#company-reader\">Read the company publication</a><a href=\"usage.html\">Inspect permitted usage and cost</a></div></section></div><details><summary>Scope and contextual return behavior</summary><div class=\"safe\"><p>Changing scope rechecks access and resets incompatible filters. Knowledge search still opens in an authorized project; this aggregate does not widen retrieval.</p><p>A contextual destination returns here with its prior filters. With no history, Back returns to Daily Work in the same authorized project. Revoked destinations use neutral unavailable copy.</p><a href=\"daily-work.html\">Back to Daily Work</a></div></details></main></div></div><script>\nconst scope=document.querySelector('#scope');scope.addEventListener('change',()=>{const value=scope.value;document.querySelectorAll('[data-project]').forEach(el=>el.hidden=value!=='company'&&el.dataset.project!==value);document.querySelector('h1').textContent=value==='company'?'Across your projects':scope.options[scope.selectedIndex].text;document.querySelector('.scope .caption').textContent='Today · viewer’s timezone · selected scope remains visible';});\n<\/script></body></html>"},{"label":"Ticket run history","file":"run-history.html","html":"<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>Owl Mast — Per-ticket run history</title><style>:root{--owl-canvas:#F5F7FB;--owl-card:#FFFFFF;--owl-secondary-surface:#EAF0F8;--owl-text:#172337;--owl-secondary-text:#52627A;--owl-divider:#D7E0EC;--owl-control-outline:#74849B;--owl-primary:#2456D6;--owl-on-primary:#FFFFFF;--owl-knowledge:#086A7B;--owl-attention:#845900;--owl-success:#176B50;--owl-error:#B23549;--owl-identity-iris:#6B4CC2;--owl-identity-mulberry:#943B75;--owl-identity-clay:#8F4D40;--owl-identity-slate:#556579;color-scheme:light;--identity-iris:var(--owl-identity-iris);--identity-mulberry:var(--owl-identity-mulberry);--identity-clay:var(--owl-identity-clay);--identity-slate:var(--owl-identity-slate);}\n@media(prefers-color-scheme:dark){:root{--owl-canvas:#0B1018;--owl-card:#121A27;--owl-secondary-surface:#1B2738;--owl-text:#EAF1FA;--owl-secondary-text:#A5B5CB;--owl-divider:#2E3C50;--owl-control-outline:#73869E;--owl-primary:#91B5FF;--owl-on-primary:#0B1730;--owl-knowledge:#70D7E7;--owl-attention:#F0C268;--owl-success:#72D6AF;--owl-error:#FF95A5;--owl-identity-iris:#C4B0FF;--owl-identity-mulberry:#F0ADDA;--owl-identity-clay:#F0B5A8;--owl-identity-slate:#B7C8DD;color-scheme:dark;}}\nhtml[data-owl-theme=\"dark\"]{--owl-canvas:#0B1018;--owl-card:#121A27;--owl-secondary-surface:#1B2738;--owl-text:#EAF1FA;--owl-secondary-text:#A5B5CB;--owl-divider:#2E3C50;--owl-control-outline:#73869E;--owl-primary:#91B5FF;--owl-on-primary:#0B1730;--owl-knowledge:#70D7E7;--owl-attention:#F0C268;--owl-success:#72D6AF;--owl-error:#FF95A5;--owl-identity-iris:#C4B0FF;--owl-identity-mulberry:#F0ADDA ar(--rh-panel);border:1px solid var(--rh-line);border-radius:12px;padding:16px;margin-top:20px}.rh-ticket-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}.rh-ticket-title{margin-top:10px!important}.rh-chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.rh-chip{display:inline-flex;align-items:center;gap:7px;padding:4px 9px;border:1px solid var(--rh-line);border-radius:9999px;max-width:100%;background:var(--rh-nested);font-size:14px;line-height:1.5;overflow-wrap:anywhere}.rh-ticket-id,.rh-code{font-family:var(--font-mono,ui-monospace,monospace);font-size:14px}.rh-code{overflow-wrap:anywhere;white-space:normal;user-select:text}.rh-chip svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 16px}.rh-agent-name{font-weight:600}.rh-agent-type{color:var(--rh-muted)}.rh-identity{display:inline-block;width:9px;height:9px;flex:0 0 9px;border-radius:1px;transform:rotate(45deg);margin:0 2px;background:var(--owl-identity-slate,#556579)}.rh-identity.rh-tawny{background:var(--owl-identity-iris,#6B4CC2)}.rh-identity.rh-snowy{background:var(--owl-identity-mulberry,#943B75)}.rh-caption{margin-top:10px!important;color:var(--rh-muted)}.rh-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:16px!important;border-top:1px solid var(--rh-line);border-bottom:1px solid var(--rh-line)}.rh-stats>div{padding:14px 12px 14px 0;min-width:0}.rh-stats>div+div{padding-left:16px;border-left:1px solid var(--rh-line)}.rh-stats dt{color:var(--rh-muted);font-size:14px}.rh-stats dd{font-size:25px;line-height:1.3;font-weight:600;letter-spacing:-.02em;margin-top:4px}.rh-stats dd.rh-coverage{font-size:20px;line-height:1.6}.rh-stats .rh-stat-help{display:block;margin-top:4px;font-size:14px;color:var(--rh-muted)}.rh-basis{margin-top:10px!important}.rh-section-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:24px 0 12px}.rh-section-heading h2{font-size:18px}.rh-runs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.rh-run{min-width:0;border:1px solid var(--rh-line);border-radius:12px;padding:16px;background:var(--rh-panel)}.rh-run.rh-run-partial{grid-column:1/-1}.rh-run-head{display:block}.rh-run-head .rh-trace{display:block;margin-top:6px}.rh-trace{font-size:14px;color:var(--rh-muted)}.rh-run>.rh-chips{margin-top:12px}.rh-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;margin-top:16px!important}.rh-fields>div{min-width:0}.rh-fields dt{color:var(--rh-muted);margin-bottom:4px;font-size:14px}.rh-fields dd{font-size:14px;line-height:1.55}.rh-fields dd strong{font-size:16px;font-weight:600}.rh-fields .rh-full{grid-column:1/-1}.rh-field-help{display:block;margin-top:4px;color:var(--rh-muted);font-size:14px}.rh-tokens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;border-top:1px solid var(--rh-line);padding-top:14px;margin-top:16px!important}.rh-tokens dt{color:var(--rh-muted);font-size:14px}.rh-tokens dd{font-size:23px;line-height:1.3;font-weight:600;margin-top:4px}.rh-tokens dd.rh-unknown{font-size:16px;line-height:1.85}.rh-view details{margin-top:14px}.rh-view summary{min-height:44px;display:flex;justify-content:flex-start;align-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:600;list-style:none;padding:8px 0}.rh-view summary::-webkit-details-marker{display:none}.rh-chevron{width:14px;height:14px;flex:0 0 14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.rh-view details[open]>summary>.rh-chevron{transform:rotate(90deg)}.rh-view summary:focus-visible{outline:3px solid var(--rh-outline);outline-offset:3px}.rh-detail-body{padding:12px 0 2px;border-top:1px solid var(--rh-line)}.rh-detail-body p+p{margin-top:8px}.rh-detail-body .rh-fields{margin-top:0!important}.rh-explainer{margin-top:16px;padding:12px 14px;background:var(--rh-nested);border-radius:8px}.rh-explainer p+p{margin-top:6px}.rh-costs{padding:2px 16px;border:1px solid var(--rh-line);border-radius:12px;background:var(--rh-panel);margin-top:16px}.rh-costs details{margin:0}.rh-footer{margin-top:16px!important;color:var(--rh-muted)}\n@media(max-width:599px){.rh-view h1{font-size:25px}.rh-runs{grid-template-columns:1fr}.rh-run.rh-run-partial{grid-column:auto}.rh-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.rh-stats>div:nth-child(3){grid-column:1/-1;border-left:0;border-top:1px solid var(--rh-line);padding-left:0}.rh-stats dd{font-size:23px}.rh-ticket,.rh-run{padding:14px}.rh-fields{gap:14px 12px}.rh-ticket-heading{gap:10px}}\n@media(prefers-reduced-motion:reduce){.rh-view *{transition:none!important;scroll-behavior:auto!important}}@media(forced-colors:active){.rh-chip,.rh-run,.rh-ticket,.rh-costs{border-color:CanvasText}.rh-identity{background:CanvasText}.rh-chevron{stroke:CanvasText}}\n</style>\n<div class=\"rh-view\">\n  <header><p class=\"rh-eyebrow\">Work evidence / Per-ticket run history</p><h1 id=\"run-history-heading\" tabindex=\"-1\">Every contribution, in context.</h1><p class=\"rh-intro\">See which model did each task, at what effort, on which machine—and what usage was actually recorded.</p></header>\n  <p class=\"rh-sample\"><strong>Illustrative example.</strong> SYN-42, the runs, machine names and figures below are design fixtures. They are not connected to the real GitHub or Notion records. This separate dataset is not included in the Usage screen's example totals.</p>\n  <section class=\"rh-ticket\" aria-labelledby=\"rh-ticket-title\">\n    <div class=\"rh-ticket-heading\"><div class=\"rh-chips\"><span class=\"rh-chip rh-ticket-id\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M3 2.5h10v11H3zM5.5 6h5M5.5 9h3\"/></svg>SYN-42</span><span class=\"rh-chip\">Syntelligence · example project</span></div><span class=\"rh-muted\">Ticket progress: Unknown</span></div>\n    <h2 class=\"rh-ticket-title\" id=\"rh-ticket-title\">Add acceptance-evidence links</h2>\n    <p class=\"rh-caption\">Implementation, review and verification · 2 reported models · 3 machines</p>\n    <dl class=\"rh-stats\"><div><dt>Attributed input tokens</dt><dd>160,000</dd><span class=\"rh-stat-help\">Observed subtotal in this fixture</span></div><div><dt>Attributed output tokens</dt><dd>10,000</dd><span class=\"rh-stat-help\">Observed subtotal in this fixture</span></div><div><dt>Token coverage</dt><dd class=\"rh-coverage\">2 of 3 runs</dd><span class=\"rh-stat-help\">Incomplete · verification usage unavailable</span></div></dl>\n    <p class=\"rh-basis\">Counted from records you can access. Example period: 5 Nov 2026, 09:00–10:10 UTC.</p>\n  </section>\n  <div class=\"rh-section-heading\"><h2>Contributions to SYN-42</h2><span class=\"rh-muted\">Run state and evidence coverage are separate</span></div>\n  <div class=\"rh-runs\">\n    <article class=\"rh-run\" aria-labelledby=\"rh-implementation-title\">\n      <div class=\"rh-run-head\"><h3 id=\"rh-implementation-title\">Implementation</h3><span class=\"rh-trace\">Displayed fields recorded</span></div>\n      <div class=\"rh-chips\"><span class=\"rh-chip\"><i class=\"rh-identity rh-tawny\" aria-hidden=\"true\"></i><span class=\"rh-agent-name\">Tawny</span><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M8 2v12M2 8h12M4 4l8 8M12 4l-8 8\"/></svg><span class=\"rh-agent-type\">Claude</span></span></div>\n      <dl class=\"rh-fields\"><div class=\"rh-mobile-full\"><dt>Model</dt><dd><strong>Opus 5.5</strong></dd></div><div><dt>Effort</dt><dd><strong>Medium</strong><span class=\"rh-field-help\">Reported run setting</span></dd></div><div class=\"rh-full\"><dt>Machine / sandbox</dt><dd><strong>Builder laptop</strong></dd></div><div class=\"rh-full\"><dt>Session ID</dt><dd class=\"rh-code\">demo-impl-001</dd></div><div><dt>Run state</dt><dd>Finished</dd></div><div><dt>Time · UTC</dt><dd>09:00–09:28</dd></div></dl>\n      <dl class=\"rh-tokens\"><div><dt>Tokens IN</dt><dd>120,000</dd></div><div><dt>Tokens OUT</dt><dd>8,000</dd></div></dl>\n      <details><summary><svg class=\"rh-chevron\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"m6 3 5 5-5 5\"/></svg>Attribution and source identity</summary><div class=\"rh-detail-body\"><dl class=\"rh-fields\"><div><dt>Client identity</dt><dd class=\"rh-code\">demo-claude-client-01</dd></div><div><dt>Machine identity</dt><dd class=\"rh-code\">demo-machine-laptop</dd></div><div class=\"rh-full\"><dt>Session scope</dt><dd>Claude · demo-claude-client-01</dd></div></dl><p class=\"rh-caption\">Fixture basis: this run is mapped exclusively to SYN-42. The 16,000 cache-read tokens are included in input; they are not added again.</p></div></details>\n    </article>\n    <article class=\"rh-run\" aria-labelledby=\"rh-review-title\">\n      <div class=\"rh-run-head\"><h3 id=\"rh-review-title\">Review</h3><span class=\"rh-trace\">Displayed fields recorded</span></div>\n      <div class=\"rh-chips\"><span class=\"rh-chip\"><i class=\"rh-identity rh-snowy\" aria-hidden=\"true\"></i><span class=\"rh-agent-name\">Snowy</span><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"m3 4 4 4-4 4m6 0h4\"/></svg><span class=\"rh-agent-type\">Codex</span></span></div>\n      <dl class=\"rh-fields\"><div class=\"rh-mobile-full\"><dt>Model</dt><dd><strong>gpt-6-astra</strong></dd></div><div><dt>Effort</dt><dd><strong>Ultra</strong><span class=\"rh-field-help\">Reported run setting</span></dd></div><div class=\"rh-full\"><dt>Machine / sandbox</dt><dd><strong>Review node</strong></dd></div><div class=\"rh-full\"><dt>Session ID</dt><dd class=\"rh-code\">demo-review-002</dd></div><div><dt>Run state</dt><dd>Finished</dd></div><div><dt>Time · UTC</dt><dd>09:32–09:56</dd></div></dl>\n      <dl class=\"rh-tokens\"><div><dt>Tokens IN</dt><dd>40,000</dd></div><div><dt>Tokens OUT</dt><dd>2,000</dd></div></dl>\n      <details><summary><svg class=\"rh-chevron\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"m6 3 5 5-5 5\"/></svg>Attribution and source identity</summary><div class=\"rh-detail-body\"><dl class=\"rh-fields\"><div><dt>Client identity</dt><dd class=\"rh-code\">demo-codex-client-02</dd></div><div><dt>Machine identity</dt><dd class=\"rh-code\">demo-machine-review</dd></div><div class=\"rh-full\"><dt>Session scope</dt><dd>Codex · demo-codex-client-02</dd></div></dl><p class=\"rh-caption\">Fixture basis: this run is mapped exclusively to SYN-42. Input and output are recorded separately. This row reports a finished review run, not acceptance of the ticket.</p></div></details>\n    </article>\n    <article class=\"rh-run rh-run-partial\" aria-labelledby=\"rh-verification-title\">\n      <div class=\"rh-run-head\"><h3 id=\"rh-verification-title\">Verification</h3><span class=\"rh-trace\">Evidence: Partial</span></div>\n      <p class=\"rh-caption\">The machine and session are recorded; the agent, model, effort and token counters are missing.</p>\n      <dl class=\"rh-fields\"><div><dt>Model / effort</dt><dd>Unknown / Unknown</dd></div><div><dt>Machine / sandbox</dt><dd><strong>Build node</strong></dd></div><div class=\"rh-full\"><dt>Session ID</dt><dd class=\"rh-code\">demo-verify-003</dd></div><div><dt>Run state</dt><dd>Finished</dd></div><div><dt>Time · UTC</dt><dd>10:00–10:10</dd></div></dl>\n      <dl class=\"rh-tokens\"><div><dt>Tokens IN</dt><dd class=\"rh-unknown\">Unavailable</dd></div><div><dt>Tokens OUT</dt><dd class=\"rh-unknown\">Unavailable</dd></div></dl>\n      <details><summary><svg class=\"rh-chevron\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"m6 3 5 5-5 5\"/></svg>Evidence gap</summary><div class=\"rh-detail-body\"><p>The fixture records this session under local observation source <span class=\"rh-code\">demo-build-observer</span>, on machine <span class=\"rh-code\">demo-machine-build</span>. It has no provider/client attribution or token measurements.</p><p>Missing usage is not zero. No model or effort is inherited from another run or from the machine's current settings.</p></div></details>\n    </article>\n  </div>\n  <div class=\"rh-explainer\"><p><strong>One ticket can span several agents and machines.</strong> Each contribution keeps its own model, effort and session. A machine name identifies where work ran; it does not prove security isolation.</p><p class=\"rh-muted\">Effort labels are shown as reported, without equating them across providers. Unknown settings remain unknown.</p></div>\n  <section class=\"rh-costs\" aria-label=\"Usage and cost evidence\"><details><summary><svg class=\"rh-chevron\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"m6 3 5 5-5 5\"/></svg>Usage &amp; cost · price evidence unavailable</summary><div class=\"rh-detail-body\"><dl class=\"rh-fields\"><div><dt>Observed units</dt><dd>160,000 IN / 10,000 OUT<br><span class=\"rh-field-help\">Illustrative subtotal · 2 of 3 runs</span></dd></div><div><dt>API-equivalent estimate</dt><dd>Unavailable · no price basis</dd></div><div><dt>Subscription allocation</dt><dd>Unavailable</dd></div><div><dt>Actual bill</dt><dd>Unavailable</dd></div></dl><p class=\"rh-caption\">Each attributable usage segment is counted once. Shared sessions without a supported ticket allocation stay unassigned; retries count only their distinct measured usage. These figures never establish an individual productivity score.</p></div></details></section>\n  <p class=\"rh-footer\">Read-only observation. No assignment, machine routing, session launch or agent execution controls. Source access also governs run identities and usage evidence.</p>\n</div>\n</main></div></body></html>"},{"file":"kanban.html","label":"Focus · SDLC board","html":"<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><title>Owl Mast — SDLC board</title><style>:root{--owl-canvas:#F5F7FB;--owl-card:#FFFFFF;--owl-secondary-surface:#EAF0F8;--owl-text:#172337;--owl-secondary-text:#52627A;--owl-d  data-owner=\"Ahmed\"><div class=\"kb-tags\"><span class=\"kb-chip kb-id\">SYN-87</span><span class=\"kb-chip\">Ahmed</span></div><h3>Clarify a newly imported ticket</h3><p class=\"kb-state\">Jira: Done</p><p class=\"kb-muted\">Criteria: Unknown</p><details><summary>Stage evidence <span aria-hidden=\"true\">+</span></summary><p>No stage mapping or supporting artifact. Observed 5 Nov, 10:30 UTC. This is an illustrative source-qualified Syntelligence record.</p><p>Epic: SYN-10 · Recovery. Stage mapping is separate from tracker status and acceptance.</p><a href=\"work-detail.html\">Open work evidence example</a></details></article></section><details class=\"kb-note\"><summary>How stages relate to evidence <span aria-hidden=\"true\">+</span></summary><p>In this fixture every stage assignment has a recorded source basis. Jira “In Progress” alone cannot distinguish Design, Build or Test. Concurrent build/test contributions remain inspectable without duplicating the ticket subtotal.</p><p>Accepted artifacts and observed handoffs may explain stage movement, but Owl Mast does not trigger the next activity. Stale mapping and conflicting sources retain an explicit warning rather than silently moving cards.</p><a href=\"dependencies.html\">Inspect dependencies separately</a><p>Columns follow the user-supplied AI Native SDLC Playbook, pages 8–9. The book describes non-linear stages; prerequisite arrows have a different meaning from column order.</p></details><p class=\"kb-footer\">Illustrative data only. Stage mapping, filter behavior and layout are design proposals; no real work status is changed.</p></main><script>(()=>{const owner=document.querySelector('#kb-owner'),root=document.querySelector('main'),board=document.querySelector('#kb-board-button'),list=document.querySelector('#kb-list-button');function layout(isList){root.classList.toggle('kb-list',isList);board.setAttribute('aria-pressed',String(!isList));list.setAttribute('aria-pressed',String(isList));}function filter(){
