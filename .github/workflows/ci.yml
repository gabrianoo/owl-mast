name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    name: Build, gates, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '27.0.1'
          check-latest: false
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
      - name: Container runtime
        run: docker version
      - name: Build with all gates (formatting, Error Prone, ArchUnit, unit + integration suites)
        run: ./gradlew build --console=plain
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-reports
          path: backend/build/reports/tests
          if-no-files-found: ignore

  gate-negative-checks:
    name: Gates fail on deliberate violations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '27.0.1'
          check-latest: false
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
      - name: Inject violations and assert each gate fails with its diagnostic
        run: scripts/verify-quality-gates.sh
